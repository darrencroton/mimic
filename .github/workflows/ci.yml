name: Mimic CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev libyaml-dev pkg-config

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Build Mimic
      run: |
        make clean
        make

    - name: Check property metadata is up-to-date
      run: |
        make check-generated

    - name: Run unit tests
      run: |
        make test-unit

    - name: Run integration tests
      run: |
        make test-integration

    - name: Run scientific tests
      run: |
        make test-scientific

    - name: Check for memory leaks
      run: |
        if grep -riq "memory leak" tests/data/output/binary/metadata/*.log 2>/dev/null; then
          echo "Memory leak detected!"
          grep -i "memory leak" tests/data/output/binary/metadata/*.log
          exit 1
        fi
        echo "No memory leaks detected"

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          tests/unit/build/*.log
          tests/data/output/binary/metadata/*.log
