name: Mimic CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev libyaml-dev pkg-config

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Check code formatting
      run: |
        make check-format

    - name: Build Mimic
      run: |
        make clean
        make

    - name: Check property metadata is up-to-date
      run: |
        make check-generated

    - name: Validate documentation links
      run: |
        make check-docs

    - name: Validate module metadata
      run: |
        make validate-modules

    - name: Run converter tests
      run: |
        make tests-converter

    - name: Run bench tests
      run: |
        make tests-bench

    - name: Run unit tests
      run: |
        make tests-unit

    - name: Run integration tests
      run: |
        make tests-integration

    - name: Run scientific tests
      # The SAGE galaxy-physics baseline is generated on macOS, so this cross-platform
      # run uses the relaxed gate. The baseline regenerated on 2026-11-12 reproduced
      # exactly in an Ubuntu 24.04 container (gcc 13.3, arm64 and emulated x86_64);
      # its predecessor differed by up to 6.8e-4 relative. The gate is not tightened
      # on a container measurement alone, and stays where the sage26 job's is. The strict
      # 1e-6 default still applies locally, and diffs in (1e-6, 1e-3] are reported
      # as warnings. The absolute floor (atol) is fixed in the comparator.
      env:
        MIMIC_BASELINE_RTOL: "1e-3"
      run: |
        make tests-scientific

    # Memory-leak gating happens inside the test suites: C unit tests call
    # check_memory_leaks() in-process, and integration tests assert
    # check_no_memory_leaks() against each Mimic run's captured output.
    # (A previous standalone step here grepped metadata/*.log files that no
    # Mimic run ever writes, so it could never fail.)

    - name: Upload test results
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-results
        path: |
          tests/unit/build/*.log
          tests/data/output/binary/metadata/

  horizontal-v3:
    name: Horizontal v3 fixtures and snapshot-global battery
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev libyaml-dev pkg-config libopenmpi-dev openmpi-bin

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Run horizontal v3 fixture battery
      run: |
        make tests-horizontal-v3

    # The generic integration tier on a horizontal package, over the committed
    # worked_graph fixture (simulations/mini-millennium-horizontal/_tests/input/
    # test_simulation.yaml): HDF5-only run files, vertical-only tests reported NA.
    # The tier tolerates skips and NAs, so the four horizontal-run cases that must
    # execute here are required by name: a stale guard would otherwise turn them into
    # a quiet SKIP or NA. Needs no real dataset; the tier runs in seconds after the build.
    - name: Run integration tests on a horizontal package
      run: |
        set -o pipefail
        mkdir -p build
        make MODEL=halos-only SIMULATION=mini-millennium-horizontal tests-integration \
          | tee build/horizontal_integration.log
        missing=0
        for name in \
          test_horizontal_run_completes_and_writes_output_over_the_fixture \
          test_horizontal_failure_keeps_partition_files_that_already_closed \
          test_horizontal_failure_removes_the_in_flight_partition_file \
          test_horizontal_unwritable_output_directory_fails_before_the_dataset_opens; do
          if ! grep -qx "MIMIC_RESULT: PASS $name" build/horizontal_integration.log; then
            echo "::error::required case did not PASS: $name"
            missing=1
          fi
        done
        exit $missing

    # The snapshot-global battery on the committed horizontal fixtures: the post_snapshot
    # phase and typed callback contract, and the sham_rank_match and hod_populate packages
    # (the latter creates records). It builds every package pair it needs as a test build and
    # needs no real dataset.
    - name: Run snapshot-global battery
      run: |
        make tests-snapshot-global

    # The distributed-snapshot gate: builds the MPI binaries and runs the fixture
    # identity checks across rank counts and the MPI control test. --oversubscribe
    # lets the 8-rank case run on the runner's few cores.
    - name: Run distributed snapshot gate
      env:
        MPIRUN: "mpirun --oversubscribe"
      run: |
        make tests-distributed

    # The gate writes its whole output to a log; print it in a separate step that runs
    # whether the gate passed, failed or timed out, so a failure is diagnosable from the job.
    - name: Print distributed gate log
      if: always()
      run: |
        echo "::group::Distributed gate log"
        if [ -f build/distributed_tests.log ]; then
          cat build/distributed_tests.log
        else
          echo "build/distributed_tests.log was not written"
        fi
        echo "::endgroup::"

    # The rate battery's legs that need no real data, on the committed forest_blocks fixture:
    # the rate fixtures serial against -np 1, 2, 3, 4 and 8 and forest_chunks 2, 3 and 8, every
    # order of the four rate modules under both schemes, and record creation across task
    # counts. It builds its own test-build pairs (the second with MPI) and writes its whole
    # output to build/rate_tests.log, printed by the next step. --oversubscribe lets the
    # 8-rank case run on the runner's few cores. The cross-driver leg (with its stiff case and
    # its reordered real-data runs, which are what can see a missing canonical order) runs
    # locally (make tests-rate): it needs the real mini-Millennium data.
    - name: Run rate battery
      env:
        MPIRUN: "mpirun --oversubscribe"
      run: |
        make tests-rate RATE_BATTERY_ARGS=--offline

    # Print the battery's log in a separate step that runs whether the battery passed,
    # failed, timed out or was cancelled, so a failure is diagnosable from the job.
    - name: Print rate battery log
      if: always()
      run: |
        echo "::group::Rate battery log"
        if [ -f build/rate_tests.log ]; then
          cat build/rate_tests.log
        else
          echo "build/rate_tests.log was not written"
        fi
        echo "::endgroup::"

  sage26:
    name: sage26 model package
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libhdf5-dev libyaml-dev pkg-config

    - name: Install Python dependencies
      run: |
        pip install -r requirements.txt

    - name: Build sage26 on mini-millennium
      run: |
        make MODEL=sage26 SIMULATION=mini-millennium

    - name: Check generated code and module metadata
      run: |
        make MODEL=sage26 SIMULATION=mini-millennium check-generated
        make MODEL=sage26 SIMULATION=mini-millennium validate-modules

    - name: Run unit tests
      run: |
        make MODEL=sage26 SIMULATION=mini-millennium tests-unit

    - name: Run integration tests
      run: |
        make MODEL=sage26 SIMULATION=mini-millennium tests-integration

    - name: Run scientific tests
      # The sage26 baseline is generated on macOS; Linux gcc reproduces it to 5.5e-4
      # relative at worst (measured 2026-11-08, Ubuntu 24.04, gcc 13). Same relaxed
      # cross-platform gate as the default job; the strict 1e-6 default applies locally.
      env:
        MIMIC_BASELINE_RTOL: "1e-3"
      run: |
        make MODEL=sage26 SIMULATION=mini-millennium tests-scientific
