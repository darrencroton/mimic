# L-Halo binary mapping profile -- default (no extra fields selected).
#
# Source format: the shipped fixed-record L-Halo tree files used by
# mini-Millennium, Millennium, mini-Uchuu and micro-Uchuu. Role names and
# binary_layout offsets are the record's own field names and byte offsets
# (src/include/generated/raw_halo_defs.h -> struct RawHalo, 104 bytes), and
# must be validated against the ordered simulations/<package>/halo_properties.yaml
# rather than guessed from host packing. Alias matching is exact for binary
# names: a stored field name is an on-disk object, not a printed header token.
#
# byte_order is a property of the file, not of this machine. Every shipped
# L-Halo dataset inspected so far is little-endian; a big-endian source
# needs its own profile with byte_order: big and the same offsets.
#
# Structural metadata (the Ntrees/totNHalos/per-tree count header) is
# adapter-owned and deliberately absent here: it cannot be remapped or omitted.

schema_version: 1
source_format: lhalo_binary

required_columns:
  Descendant: [Descendant]
  FirstProgenitor: [FirstProgenitor]
  NextProgenitor: [NextProgenitor]
  FirstHaloInFOFgroup: [FirstHaloInFOFgroup]
  NextHaloInFOFgroup: [NextHaloInFOFgroup]
  Len: [Len]
  M_Crit200: [M_Crit200]
  Pos: [Pos]
  Vel: [Vel]
  Spin: [Spin]
  VelDisp: [VelDisp]
  Vmax: [Vmax]
  MostBoundID: [MostBoundID]
  SnapNum: [SnapNum]

extra_fields: []

# Every field of the record, selected or not: an unselected field still
# occupies its bytes, and the stride a reader steps is a property of the
# source, not of the selection.
binary_layout:
  byte_order: little
  itemsize: 104
  offsets:
    Descendant: 0
    FirstProgenitor: 4
    NextProgenitor: 8
    FirstHaloInFOFgroup: 12
    NextHaloInFOFgroup: 16
    Len: 20
    M_Mean200: 24
    M_Crit200: 28
    M_TopHat: 32
    Pos: 36
    Vel: 48
    VelDisp: 60
    Vmax: 64
    Spin: 68
    MostBoundID: 80
    SnapNum: 88
    FileNr: 92
    SubhaloIndex: 96
    SubHalfMass: 100
