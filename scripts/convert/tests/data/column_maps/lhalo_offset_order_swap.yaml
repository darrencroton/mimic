# Invalid: M_Mean200's and M_TopHat's offsets are swapped. Both are float32,
# so coverage, extent and overlap all still pass -- every byte is claimed
# exactly once. Only a declaration-order check catches it, and without one an
# adapter would file each field's bytes under the other's name.
schema_version: 1
source_format: lhalo_binary

required_columns:
  Descendant: [Descendant]
  FirstProgenitor: [FirstProgenitor]
  NextProgenitor: [NextProgenitor]
  FirstHaloInFOFgroup: [FirstHaloInFOFgroup]
  NextHaloInFOFgroup: [NextHaloInFOFgroup]
  Len: [Len]
  M_Crit200: [M_Crit200]
  Pos: [Pos]
  Vel: [Vel]
  Spin: [Spin]
  VelDisp: [VelDisp]
  Vmax: [Vmax]
  MostBoundID: [MostBoundID]
  SnapNum: [SnapNum]

extra_fields: []

# Every field of the record, selected or not: an unselected field still
# occupies its bytes, and the stride a reader steps is a property of the
# source, not of the selection.
binary_layout:
  byte_order: little
  itemsize: 104
  offsets:
    Descendant: 0
    FirstProgenitor: 4
    NextProgenitor: 8
    FirstHaloInFOFgroup: 12
    NextHaloInFOFgroup: 16
    Len: 20
    M_Mean200: 32
    M_Crit200: 28
    M_TopHat: 24
    Pos: 36
    Vel: 48
    VelDisp: 60
    Vmax: 64
    Spin: 68
    MostBoundID: 80
    SnapNum: 88
    FileNr: 92
    SubhaloIndex: 96
    SubHalfMass: 100
