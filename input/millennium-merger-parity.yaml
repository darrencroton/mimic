# Mimic SAGE Model Configuration — Merger-Ordering Parity Profile
#
# OPT-IN PARITY PROFILE: use this config to validate SAGE merger-ordering parity.
#
# Differs from millennium.yaml only in phase_2 plus output naming:
#   - Replaces the three-module split path
#       sage_update_merger_time / sage_merge_galaxies / sage_disrupt_satellites
#     with the single-pass immediate handler:
#       sage_handle_mergers_immediate
#   - Per-event merger consumers (sage_quasar_mode, sage_collisional_starburst)
#     remain in place immediately after the immediate handler, so merger-triggered
#     events are still dispatched in the correct order.
#   - Writes to the existing Millennium output directory with a distinct base name,
#     so the profile works with the standard first-run setup without clobbering the
#     default `model_*.hdf5` outputs.
#
# Do NOT use this config as the production default until broader scientific
# validation confirms numerical parity with the split-module path.
#
# See: docs/sage-merger-ordering-parity-contract.md

output:
  output_filename: model_merger_parity
  output_directory: ./output/results/millennium/
  output_format: hdf5                 # Select binary or hdf5
  snapshot_count: 8                   # Use -1 to override snapshot_list and write all snapshots
  snapshot_list: [63, 37, 32, 27, 23, 20, 18, 16]

input:
  first_file: 0
  last_file: 7
  tree_name: trees_063
  tree_type: lhalo_binary
  simulation_dir: ./input/data/millennium/
  snapshot_list_file: ./input/data/millennium/millennium.a_list
  last_snapshot: 63

simulation:
  cosmology:
    omega_matter: 0.25
    omega_lambda: 0.75
    hubble_h: 0.73
  box_size: 62.5
  particle_mass: 0.0860657
  units:
    length_in_cm: 3.08568e+24         # WATCH OUT: Mpc/h
    mass_in_g: 1.989e+43              # WATCH OUT: 10^10 Msun/h
    velocity_in_cm_per_s: 100000.0    # WATCH OUT: km/s

SubSteps: 10

modules:

  pre_timestep:
    - sage_reionization: process_full_halo
    - sage_calculate_infall: process_full_halo
    - sage_update_disk_radius: process_full_halo
    - sage_calculate_merger_timescale: process_full_halo

  phase_1:
    # Infall, Reincorporation & Stripping
    - sage_add_infall: process_full_halo
    - sage_reincorporation: process_full_halo
    - sage_satellite_stripping: process_full_halo

    # Cooling (Calculate → Modify → Apply)
    - sage_calculate_cooling: process_by_galaxy
    - sage_radio_mode_heating: process_by_galaxy
    - sage_add_cooling: process_by_galaxy

    # Star Formation (Calculate → Calculate → Update)
    - sage_calculate_star_formation: process_by_galaxy
    - sage_calculate_supernova_feedback: process_by_galaxy
    - sage_update_star_formation_supernova: process_by_galaxy

    # Disk Instability (Check → Transfer → Trigger Physics)
    - sage_disk_instability: process_by_galaxy
    - sage_quasar_mode: process_by_galaxy
    - sage_collisional_starburst: process_by_galaxy
    - sage_clear_disk_instability_triggers: process_by_galaxy

  phase_2:
    # Mergers — immediate single-pass parity handler (SAGE ordering parity profile)
    # Replaces: sage_update_merger_time + sage_merge_galaxies + sage_disrupt_satellites
    - sage_handle_mergers_immediate: process_full_halo
    - sage_quasar_mode: process_per_event          # Triggered by sage_handle_mergers_immediate merger events
    - sage_collisional_starburst: process_per_event  # Triggered by sage_handle_mergers_immediate merger events

  post_timestep:

  parameters:
    # Reionisation
    GlobalBaryonFraction: 0.17          # Cosmic baryon fraction (Planck 2018)

    # Star Formation
    SfrEfficiency: 0.05                 # Star formation efficiency
    StarFormingDiskFactor: 3.0          # Number of disc scale radii to form stars over

    # Supernova Feedback
    FeedbackReheatingEpsilon: 3.0       # Reheating efficiency
    FeedbackEjectionEfficiency: 0.3     # Ejection efficiency

    # Gas Reincorporation
    ReIncorporationFactor: 0.15          # Reincorporation timescale factor

    # Cooling & AGN Feedback
    AGNrecipe: 2                        # AGN feedback mode (0=off, 1=empirical, 2=Bondi, 3=cold cloud)
    RadioModeEfficiency: 0.08           # Radio-mode AGN feedback efficiency

    # Black Hole Growth
    BlackHoleGrowthRate: 0.015          # BH growth efficiency during mergers
    QuasarModeEfficiency: 0.005         # Quasar-mode AGN feedback efficiency

    # Metals
    RecycleFraction: 0.43               # Instantaneous recycling fraction
    Yield: 0.025                        # Metal yield per unit stellar mass
    FracZleaveDisk: 0.0                 # Fraction of metals leaving disk

    # Mergers & Disruption
    ThresholdMajorMerger: 0.3           # Mass ratio threshold for major mergers
    ThresholdSatDisruption: 1.0         # Mvir-to-baryonic mass ratio threshold for sat merger/disruption
