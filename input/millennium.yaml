# Mimic Model Configuration
# For documentation see: docs/user/module-configuration.md

output:
  output_filename: model
  output_directory: ./output/results/millennium/
  output_format: hdf5                 # Select binary or hdf5
  snapshot_count: 8                   # Use -1 to override snapshot_list and write all snapshots
  snapshot_list: [63, 37, 32, 27, 23, 20, 18, 16]

input:
  first_file: 0
  last_file: 7
  tree_name: trees_063
  tree_type: lhalo_binary
  simulation_dir: ./input/data/millennium/
  snapshot_list_file: ./input/data/millennium/millennium.a_list
  last_snapshot: 63

simulation:
  cosmology:
    omega_matter: 0.25
    omega_lambda: 0.75
    hubble_h: 0.73
  box_size: 62.5
  particle_mass: 0.0860657
  units:
    length_in_cm: 3.08568e+24
    mass_in_g: 1.989e+43
    velocity_in_cm_per_s: 100000.0

SubSteps: 10

modules:

  pre_timestep:
    - sage_reionization: process_full_halo
    - sage_calculate_infall: process_full_halo
    - sage_update_disk_radius: process_full_halo
    - sage_calculate_merger_timescale: process_full_halo

  phase_1:
    # Infall, Reincorporation & Stripping
    - sage_add_infall: process_full_halo
    - sage_reincorporation: process_full_halo
    - sage_satellite_stripping: process_full_halo

    # Cooling (Calculate → Modify → Apply)
    - sage_calculate_cooling: process_by_galaxy
    - sage_radio_mode_heating: process_by_galaxy
    - sage_add_cooling: process_by_galaxy

    # Star Formation (Calculate → Calculate → Update)
    - sage_calculate_star_formation: process_by_galaxy
    - sage_calculate_supernova_feedback: process_by_galaxy
    - sage_update_star_formation_supernova: process_by_galaxy

    # Disk Instability (Check → Transfer → Trigger Physics)
    - sage_disk_instability: process_by_galaxy
    # - sage_quasar_mode: process_by_galaxy
    # - sage_collisional_starburst: process_by_galaxy

  phase_2:
    # Mergers (Check → Transfer → Trigger Physics)
    # - sage_update_merger_time: process_full_halo
    # - sage_merge_galaxies: process_full_halo
    # - sage_disrupt_satellites: process_full_halo

    # Post-Merger Physics
    # - sage_quasar_mode: process_by_galaxy
    # - sage_collisional_starburst: process_by_galaxy

  post_timestep:

  parameters:
    # Reionisation
    GlobalBaryonFraction: 0.17          # Cosmic baryon fraction (Planck 2018)

    # Cooling & AGN Feedback
    AGNrecipe: 1                        # AGN feedback mode (0=off, 1=empirical, 2=Bondi, 3=cold cloud)
    AGNrecipeOn: 1                      # AGN recipe enabled (0=off, 1=on)
    RadioModeEfficiency: 0.01           # Radio-mode AGN feedback efficiency

    # Star Formation
    SfrEfficiency: 0.02                 # Star formation efficiency
    StarFormingDiskFactor: 3.0          # Number of disc scale radii to form stars over

    # Supernova Feedback
    SupernovaRecipeOn: 1                # Supernova feedback enabled (0=off, 1=on)
    FeedbackReheatingEpsilon: 3.0       # Reheating efficiency
    FeedbackEjectionEfficiency: 0.3     # Ejection efficiency
    EtaSNcode: 5.0e-3                   # Supernova mass loading efficiency
    EnergySNcode: 1.0e51                # Supernova energy in code units

    # Metals
    RecycleFraction: 0.43               # Instantaneous recycling fraction
    Yield: 0.03                         # Metal yield per unit stellar mass
    FracZleaveDisk: 0.3                 # Fraction of metals leaving disk

    # Gas Reincorporation
    ReIncorporationFactor: 1.0          # Reincorporation timescale factor

    # Mergers & BH Growth
    ThreshMajorMerger: 0.3              # Mass ratio threshold for major mergers
    BlackHoleGrowthRate: 0.01           # BH growth efficiency during mergers
    QuasarModeEfficiency: 0.001         # Quasar-mode AGN feedback efficiency
