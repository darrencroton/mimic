# Mimic Model Configuration
# Format: YAML (industry standard)
# For documentation see: docs/user/module-configuration.md

output:
  output_filename: model
  output_directory: ./output/results/millennium/
  output_format: hdf5                 # Select binary or hdf5
  snapshot_count: 8                   # Use -1 to override snapshot_list and write all snapshots
  snapshot_list: [63, 37, 32, 27, 23, 20, 18, 16]

input:
  first_file: 0
  last_file: 7
  tree_name: trees_063
  tree_type: lhalo_binary
  simulation_dir: ./input/data/millennium/
  snapshot_list_file: ./input/data/millennium/millennium.a_list
  last_snapshot: 63

simulation:
  cosmology:
    omega_matter: 0.25
    omega_lambda: 0.75
    hubble_h: 0.73
  box_size: 62.5
  particle_mass: 0.0860657
  units:
    length_in_cm: 3.08568e+24
    mass_in_g: 1.989e+43
    velocity_in_cm_per_s: 100000.0

# Time sub-stepping (top-level parameter)
SubSteps: 1  # Number of substeps per snapshot (1 = no substeps, 20 = SAGE-like)

# Multi-phase pipeline configuration
# Phase names are generic (phase_1, phase_2) to avoid assuming physics structure
# Users control what physics goes in which phase
modules:
  # Pre-timestep: Setup calculations (runs once before substeps)
  pre_timestep:
    - sage_reionization: once   # Calculate HaloBaryonFraction for this snapshot
    - sage_infall: once          # Calculate total infall budget

  # Phase 1: Main physics (runs each substep for each galaxy)
  phase_1:
    - sage_satellite_stripping: all  # Currently enabled for testing
    # - sage_reincorporation: all
    # - sage_cooling: all
    # - sage_starformation_feedback: all
    # - sage_disk_instability: all

  # Phase 2: Mergers/disruption (runs each substep for each galaxy)
  phase_2: []
    # - sage_mergers: all

  # Post-timestep: Finalization (runs once after substeps)
  post_timestep: []
    # - sage_finalization: once   # Convert accumulators to rates

  # Model parameters (shared by all modules)
  parameters:
    # Reionisation
    GlobalBaryonFraction: 0.17          # Cosmic baryon fraction (Planck 2018)

    # Cooling & AGN Feedback
    CoolFunctionsDir: "src/modules/sage_cooling/CoolFunctions"  # Cooling function tables directory
    AGNrecipeOn: 1                      # AGN feedback mode (0=off, 1=empirical, 2=Bondi, 3=cold cloud)
    RadioModeEfficiency: 0.01           # Radio-mode AGN feedback efficiency

    # Star Formation
    SFprescription: 0                   # SF law (0=Kennicutt-Schmidt, only option)
    SfrEfficiency: 0.02                 # Star formation efficiency

    # Supernova Feedback
    SupernovaRecipeOn: 1                # Enable supernova feedback (0=off, 1=on)
    FeedbackReheatingEpsilon: 3.0       # Reheating efficiency
    FeedbackEjectionEfficiency: 0.3     # Ejection efficiency
    EnergySNcode: 1.0                   # Supernova energy (code units)
    EtaSNcode: 0.5                      # Supernova rate per unit stellar mass

    # Metals
    RecycleFraction: 0.43               # Instantaneous recycling fraction
    Yield: 0.03                         # Metal yield per unit stellar mass
    FracZleaveDisk: 0.3                 # Fraction of metals leaving disk

    # Gas Reincorporation
    ReIncorporationFactor: 1.0          # Reincorporation timescale factor

    # Mergers & BH Growth
    ThreshMajorMerger: 0.3              # Mass ratio threshold for major mergers
    BlackHoleGrowthRate: 0.01           # BH growth efficiency during mergers
    QuasarModeEfficiency: 0.001         # Quasar-mode AGN feedback efficiency

    # Disk Instability
    DiskInstabilityOn: 1                # Enable disk instability (0=off, 1=on)
    DiskRadiusFactor: 3.0               # Disk effective radius factor
