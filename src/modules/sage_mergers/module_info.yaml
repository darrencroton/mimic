# Module Metadata: sage_mergers
#
# Galaxy merger physics from the SAGE galaxy evolution model.
# Implements dynamical friction, merger-induced starbursts, black hole growth,
# quasar feedback, and morphological transformations.
#
# For schema documentation, see:
#   docs/developer/module-metadata-schema.md

module:
  # ===========================================================================
  # Core Metadata
  # ===========================================================================

  name: sage_mergers
  display_name: "SAGE Mergers"
  description: "Galaxy merger physics: dynamical friction, starbursts, BH growth, morphology from SAGE model."
  version: "1.0.0"
  author: "Mimic Team (ported from SAGE)"

  # ===========================================================================
  # Source Files
  # ===========================================================================

  sources:
    - sage_mergers.c

  headers:
    - sage_mergers.h

  register_function: sage_mergers_register

  # ===========================================================================
  # Dependencies
  # ===========================================================================

  dependencies:
    # Properties required from other modules
    requires:
      properties:
        - ColdGas
        - StellarMass
        - HotGas
        - MetalsHotGas
        - MetalsColdGas
        - EjectedMass
        - MetalsEjectedMass
        - ICS
        - MetalsICS
        - BlackHoleMass
      parameters:
        - AGNrecipeOn
        - SupernovaRecipeOn
        - FeedbackReheatingEpsilon
        - FeedbackEjectionEfficiency
        - RecycleFraction
        - Yield
        - FracZleaveDisk
        - BlackHoleGrowthRate
        - QuasarModeEfficiency
        - ThreshMajorMerger
        - DiskInstabilityOn

    # Properties provided by this module
    provides:
      - BulgeMass
      - MetalsBulgeMass
      - QuasarModeBHaccretionMass
      - TimeOfLastMajorMerger
      - TimeOfLastMinorMerger
      # Note: This module also MODIFIES (but does not provide):
      #   - MetalsStellarMass (provided by sage_starformation_feedback)
      #   - OutflowRate (provided by sage_starformation_feedback)
      #   - DiskScaleRadius (provided by sage_starformation_feedback)

  # ===========================================================================
  # Testing
  # ===========================================================================

  tests:
    unit: test_unit_sage_mergers.c
    integration: test_integration_sage_mergers.py
    scientific: test_scientific_sage_mergers_validation.py

  # ===========================================================================
  # Documentation
  # ===========================================================================

  docs:
    physics: src/modules/sage_mergers/README.md

  # ===========================================================================
  # Build Configuration
  # ===========================================================================

  compilation_requires: []
  default_enabled: true
