module:
  name: sage_radio_mode_heating
  description: "Implements AGN radio-mode feedback suppressing cooling via black hole accretion; supports empirical, Bondi-Hoyle, and cold-cloud accretion modes"

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - Type
      - HaloNr
      - SnapNum
      - dT
      - Mvir
      - Vvir
      - Rvir
      - CoolingGas
      - BlackHoleMass
      - HotGas
      - MetalsHotGas
      - CoolingLambda
      - Rheat
      - Rcool
      - Heating
    parameters:
      - RadioModeEfficiency
      - AGNrecipe

  tests:
    unit: _tests/test_unit_sage_radio_mode_heating.c
    integration: _tests/test_integration_sage_radio_mode_heating.py
    scientific: []

  docs:
    physics: src/modules/sage_radio_mode_heating/README.md
