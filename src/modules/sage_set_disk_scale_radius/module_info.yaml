module:
  name: sage_set_disk_scale_radius
  description: "Computes disk scale radius for the FOF Type 0 central using Mo, Mao & White (1998) model; Type 1 satellites keep their inherited DiskScaleRadius"

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - Type
      - Spin
      - Vvir
      - Rvir
      - DiskScaleRadius
    parameters: []

  tests:
    unit: _tests/test_unit_sage_set_disk_scale_radius.c
    integration: _tests/test_integration_sage_set_disk_scale_radius.py
    scientific: []

  docs:
    physics: src/modules/sage_set_disk_scale_radius/README.md
