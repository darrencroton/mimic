# Module Metadata: sage_starformation_feedback
#
# Star formation and supernova feedback from the SAGE galaxy evolution model.
# This module handles star formation following the Kennicutt-Schmidt law and
# implements supernova-driven feedback (reheating and ejection).
#
# For schema documentation, see:
#   docs/developer/module-metadata-schema.md

module:
  # ===========================================================================
  # Core Metadata
  # ===========================================================================

  name: sage_starformation_feedback
  display_name: "SAGE Star Formation & Feedback"
  description: "Star formation (Kennicutt-Schmidt law) and supernova feedback (reheating & ejection) from SAGE model."
  version: "1.0.0"
  author: "Mimic Team (ported from SAGE)"

  # ===========================================================================
  # Source Files
  # ===========================================================================

  sources:
    - sage_starformation_feedback.c

  headers:
    - sage_starformation_feedback.h

  register_function: sage_starformation_feedback_register

  # ===========================================================================
  # Dependencies
  # ===========================================================================

  dependencies:
    # All properties used by this module
    properties:
      - HotGas
      - MetalsHotGas
      - EjectedMass
      - MetalsEjectedMass
      - ColdGas
      - MetalsColdGas
      - StellarMass
      - MetalsStellarMass
      - DiskScaleRadius
      - OutflowRate

    # Parameters needed by this module
    parameters:
      - SFprescription
      - SfrEfficiency
      - EnergySNcode
      - EtaSNcode
      - SupernovaRecipeOn
      - FeedbackReheatingEpsilon
      - FeedbackEjectionEfficiency
      - RecycleFraction
      - Yield
      - FracZleaveDisk
      - DiskInstabilityOn

  # ===========================================================================
  # Parameter Definitions
  # ===========================================================================

  parameter_definitions:
    - name: SFprescription
      type: int
      description: "Star formation law (0=Kennicutt-Schmidt with density threshold)"
      units: dimensionless
    - name: SfrEfficiency
      type: double
      description: "Star formation efficiency (epsilon_SF in SFR = epsilon_SF * M_cold / t_dyn)"
      units: dimensionless
    - name: EnergySNcode
      type: double
      description: "Supernova energy per event in code units"
      units: code_units
    - name: EtaSNcode
      type: double
      description: "Supernova rate per unit stellar mass formed"
      units: code_units
    - name: SupernovaRecipeOn
      type: int
      description: "Enable supernova feedback (0=off, 1=on)"
      units: dimensionless
    - name: FeedbackReheatingEpsilon
      type: double
      description: "Reheating efficiency - M_reheat = epsilon * M_stars"
      units: dimensionless
    - name: FeedbackEjectionEfficiency
      type: double
      description: "Ejection efficiency in energy-driven wind formula"
      units: dimensionless
    - name: RecycleFraction
      type: double
      description: "Fraction of stellar mass immediately recycled to ISM"
      units: dimensionless
    - name: Yield
      type: double
      description: "Metal yield per unit stellar mass formed"
      units: dimensionless
    - name: FracZleaveDisk
      type: double
      description: "Fraction of newly produced metals that leave the disk in winds"
      units: dimensionless
    - name: DiskInstabilityOn
      type: int
      description: "Enable disk instability physics (0=off, 1=on)"
      units: dimensionless

  # ===========================================================================
  # Testing
  # ===========================================================================

  tests:
    unit: tests/test_unit_sage_starformation_feedback.c
    integration: tests/test_integration_sage_starformation_feedback.py
    scientific: tests/test_scientific_sage_starformation_feedback_validation.py

  # ===========================================================================
  # Documentation
  # ===========================================================================

  docs:
    physics: src/modules/sage_starformation_feedback/README.md

  # ===========================================================================
  # Build Configuration
  # ===========================================================================

  compilation_requires: []
