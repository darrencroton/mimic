module:
  name: sage_add_infall
  display_name: "SAGE Add Infall"
  description: "Distributes infalling gas to hot reservoir over substeps with metallicity tracking"
  version: "1.0.0"
  author: "Mimic Team (ported from SAGE)"

  sources:
    - sage_add_infall.c

  headers:
    - sage_add_infall.h

  register_function: sage_add_infall_register

  supported_loop_modes: [once]

  dependencies:
    properties:
      - InfallingGas
      - HotGas
      - MetalsHotGas
      - EjectedMass
      - MetalsEjectedMass
    parameters: []

  tests:
    unit: tests/test_unit_sage_add_infall.c
    integration: tests/test_integration_sage_add_infall.py
    scientific: tests/test_scientific_sage_add_infall.py

  docs:
    physics: README.md
