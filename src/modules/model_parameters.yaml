# Mimic Model Parameters Metadata
#
# This file defines ALL physics model parameters used in Mimic.
# These parameters must be explicitly specified in the input YAML file.
# NO defaults are used - the input file defines the complete model.
#
# Current parameters: 21 (all SAGE physics parameters)
#
# For schema documentation, see:
#   docs/architecture/model-parameters-schema.md
#
# Vision Principle #4: Single Source of Truth
#   - This file defines parameter STRUCTURE (name, type, range, description)
#   - Modules declare parameter DEPENDENCIES in their module_info.yaml
#   - Input file (e.g., millennium.yaml) defines parameter VALUES
#   - No hardcoded defaults in source code

model_parameters:
- name: BaryonFrac
  type: double
  range:
  - 0.0
  - 1.0
  units: dimensionless
  description: Cosmic baryon fraction (Omega_b / Omega_m)
  recommended: 0.17
  references: Planck Collaboration 2018 (Planck 2018 results. VI. Cosmological parameters)
  scientific_notes: 'The ratio of baryonic matter density to total matter density.

    Planck 2018: Omega_b = 0.0486, Omega_m = 0.315, ratio ~0.154-0.17

    '
- name: RadioModeEfficiency
  type: double
  range:
  - 0.0
  - 1.0
  units: dimensionless
  description: Efficiency of radio-mode AGN feedback (fraction of accretion energy
    coupled to gas heating)
  recommended: 0.01
  references: Croton et al. 2006 (MNRAS, 365, 11)
  scientific_notes: 'Controls strength of AGN heating in massive halos.

    Critical for regulating cooling in groups and clusters.

    Typical values: 0.001 - 0.1

    '
- name: AGNrecipeOn
  type: int
  range:
  - 0
  - 3
  units: dimensionless
  description: AGN feedback mode (0=off, 1=empirical, 2=Bondi-Hoyle, 3=cold cloud
    accretion)
  recommended: 1
  references: Croton et al. 2006; Bower et al. 2006
  scientific_notes: 'Controls black hole accretion and feedback prescription.

    Mode 1 (empirical): Simple empirical relation, computationally efficient.

    Mode 2 (Bondi-Hoyle): Physical accretion from hot halo gas.

    Mode 3 (cold cloud): Accretion from cold gas clouds.

    '
- name: CoolFunctionsDir
  type: string
  range: null
  units: path
  description: Directory containing cooling function tables (metal-dependent cooling
    rates)
  recommended: input/CoolFunctions
  references: Sutherland & Dopita 1993 (ApJS, 88, 253)
  scientific_notes: 'Cooling tables provide temperature and metallicity-dependent
    cooling rates.

    Default tables from Sutherland & Dopita 1993.

    Required for accurate cooling physics at all metallicities.

    '
- name: SFprescription
  type: int
  range:
  - 0
  - 0
  units: dimensionless
  description: Star formation law (0=Kennicutt-Schmidt with density threshold, currently
    only option)
  recommended: 0
  references: Kennicutt 1998 (ApJ, 498, 541)
  scientific_notes: 'Currently only Kennicutt-Schmidt law implemented.

    Future: May add alternative SF laws (constant efficiency, etc.)

    '
- name: SfrEfficiency
  type: double
  range:
  - 0.0
  - 1.0
  units: dimensionless
  description: Star formation efficiency (epsilon_SF in SFR = epsilon_SF * M_cold
    / t_dyn)
  recommended: 0.02
  references: Kennicutt 1998; Springel & Hernquist 2003
  scientific_notes: 'Controls how efficiently cold gas forms stars.

    Typical values: 0.01 - 0.05

    Calibrated to match observed Kennicutt-Schmidt relation.

    '
- name: EnergySNcode
  type: double
  range:
  - 0.0
  - 100.0
  units: code_units
  description: Supernova energy per event in code units (E_SN)
  recommended: 1.0
  references: 10^51 erg per supernova (standard canonical value)
  scientific_notes: 'Energy released per core-collapse supernova.

    Value in code units depends on unit system.

    Physical value: ~10^51 erg

    '
- name: EtaSNcode
  type: double
  range:
  - 0.0
  - 10.0
  units: code_units
  description: Supernova rate per unit stellar mass formed (eta = SNe / M_stars)
  recommended: 0.5
  references: Standard IMF-averaged supernova rate
  scientific_notes: 'Number of supernovae per unit stellar mass formed.

    Depends on IMF (Initial Mass Function) assumptions.

    Typical: ~1 SN per 100 solar masses formed

    '
- name: SupernovaRecipeOn
  type: int
  range:
  - 0
  - 1
  units: dimensionless
  description: Enable supernova feedback (0=off, 1=on)
  recommended: 1
  references: Croton et al. 2006; Springel & Hernquist 2003
  scientific_notes: 'Master switch for supernova feedback physics.

    Includes reheating (cold -> hot) and ejection (hot -> ejected reservoir).

    Essential for regulating star formation in low-mass galaxies.

    '
- name: FeedbackReheatingEpsilon
  type: double
  range:
  - 0.0
  - 100.0
  units: dimensionless
  description: 'Reheating efficiency (epsilon_reheat): M_reheat = epsilon_reheat *
    M_stars'
  recommended: 3.0
  references: Croton et al. 2006; Springel & Hernquist 2003
  scientific_notes: 'Mass of cold gas reheated per unit stellar mass formed.

    Values > 1 indicate supernovae reheat more gas than forms stars.

    Critical for regulating star formation and maintaining cold gas reservoirs.

    Typical range: 1.0 - 5.0

    '
- name: FeedbackEjectionEfficiency
  type: double
  range:
  - 0.0
  - 100.0
  units: dimensionless
  description: Ejection efficiency (epsilon_eject) in energy-driven wind formula
  recommended: 0.3
  references: Croton et al. 2006; Springel & Hernquist 2003
  scientific_notes: 'Controls mass ejection rate in energy-driven outflow model.

    Lower values = less ejection, more gas retained in halo.

    Calibrated to match observed mass-metallicity relation.

    Typical range: 0.1 - 1.0

    '
- name: RecycleFraction
  type: double
  range:
  - 0.0
  - 1.0
  units: dimensionless
  description: Fraction of stellar mass immediately recycled to ISM (instantaneous
    recycling approximation)
  recommended: 0.43
  references: Instantaneous recycling approximation (Tinsley 1980)
  scientific_notes: 'Fraction of stellar mass returned to ISM via stellar winds and
    supernovae.

    Instantaneous recycling approximation: all recycling occurs immediately.

    Value depends on IMF. For Salpeter/Chabrier IMF: ~0.4-0.5

    Includes mass loss from all stellar evolution phases.

    '
- name: Yield
  type: double
  range:
  - 0.0
  - 1.0
  units: dimensionless
  description: Metal yield per unit stellar mass formed (new metals / M_stars)
  recommended: 0.03
  references: Chemical evolution models (Pagel 2009)
  scientific_notes: 'Mass of newly synthesized metals per unit stellar mass formed.

    Includes nucleosynthesis from core-collapse SNe and AGB stars.

    Solar metallicity Z_sun ~ 0.02, yield typically 1-2x solar.

    Critical for matching observed mass-metallicity relations.

    '
- name: FracZleaveDisk
  type: double
  range:
  - 0.0
  - 1.0
  units: dimensionless
  description: Fraction of newly produced metals that leave the disk in winds (Krumholz
    & Dekel 2011)
  recommended: 0.3
  references: Krumholz & Dekel 2011 (ApJ, 729, 36)
  scientific_notes: 'Controls metal loading of outflows.

    Higher values = more metal-enriched winds, lower disk metallicity.

    Important for matching observed wind metallicities and mass-metallicity relation.

    Typical range: 0.2 - 0.5

    '
- name: ReIncorporationFactor
  type: double
  range:
  - 0.0
  - 10.0
  units: dimensionless
  description: Multiplicative factor for reincorporation timescale (tau_reinc = factor
    * tau_dyn)
  recommended: 1.0
  references: Henriques et al. 2015 (MNRAS, 451, 2663)
  scientific_notes: 'Controls how quickly ejected gas returns to the hot halo.

    Reincorporation timescale: tau = factor * (V_vir / 220 km/s)^-alpha * t_dyn

    Lower values = faster return, higher star formation at late times.

    Calibrated to match observed star formation histories.

    '
- name: BlackHoleGrowthRate
  type: double
  range:
  - 0.0
  - 1.0
  units: dimensionless
  description: 'Black hole growth efficiency during mergers (f_BH: Delta M_BH = f_BH
    * M_cold)'
  recommended: 0.01
  references: Kauffmann & Haehnelt 2000 (MNRAS, 311, 576)
  scientific_notes: 'Fraction of cold gas accreted onto central black hole during
    merger.

    Controls BH mass growth and M_BH - M_bulge relation.

    Typical values: 0.001 - 0.1

    Lower values = less BH growth, weaker AGN feedback.

    '
- name: QuasarModeEfficiency
  type: double
  range:
  - 0.0
  - 1.0
  units: dimensionless
  description: Quasar-mode AGN feedback efficiency (energy coupling to gas during
    merger)
  recommended: 0.001
  references: Di Matteo et al. 2005 (Nature, 433, 604)
  scientific_notes: 'Efficiency of quasar-mode feedback during gas-rich mergers.

    Controls gas ejection and star formation quenching in mergers.

    Much lower than radio-mode efficiency (quasar mode less efficient).

    Typical range: 0.0001 - 0.01

    '
- name: ThreshMajorMerger
  type: double
  range:
  - 0.0
  - 1.0
  units: dimensionless
  description: Mass ratio threshold for major mergers (M_sat / M_central > threshold
    triggers disk destruction)
  recommended: 0.3
  references: Hopkins et al. 2010 (ApJ, 715, 202)
  scientific_notes: 'Mass ratio separating major mergers (spheroid formation) from
    minor mergers.

    Major mergers: destroy disk, form spheroid, trigger starburst.

    Minor mergers: grow disk/bulge without destruction.

    Standard threshold: 0.25 - 0.3 (1:4 to 1:3 mass ratio)

    '
- name: DiskInstabilityOn
  type: int
  range:
  - 0
  - 1
  units: dimensionless
  description: Enable disk instability physics (0=off, 1=on)
  recommended: 1
  references: Mo, Mao & White 1998 (MNRAS, 295, 319)
  scientific_notes: 'Master switch for disk stability checks and bulge formation.

    When enabled, unstable disks transfer mass to bulge component.

    Critical for realistic disk/bulge mass ratios and morphologies.

    Instability criterion: V_max / (G*M_disk/R_disk)^0.5 < threshold

    '
- name: DiskRadiusFactor
  type: double
  range:
  - 1.0
  - 10.0
  units: dimensionless
  description: Factor relating disk effective radius to scale radius (R_eff = factor
    * R_scale)
  recommended: 3.0
  references: Exponential disk profile (Freeman 1970)
  scientific_notes: 'Defines relationship between disk scale length and effective
    radius.

    For exponential disk: R_eff ~ 1.68 * R_scale (half-light radius)

    For stability: use factor ~ 3 (90% of mass within R_eff)

    Affects disk stability criterion and bulge formation rate.

    '
- name: TestFixtureDummyParameter
  type: double
  range:
  - 0.0
  - 1000.0
  units: dimensionless
  description: Test parameter for infrastructure testing only (no physical meaning)
  recommended: 1.0
  references: Infrastructure testing framework
  scientific_notes: 'This parameter has NO physical meaning.

    Used by test_fixture module to validate centralized parameter system.

    DO NOT USE IN PRODUCTION RUNS.

    '
- name: TestFixtureEnableLogging
  type: int
  range:
  - 0
  - 1
  units: dimensionless
  description: Enable verbose logging in test_fixture module (0=off, 1=on)
  recommended: 0
  references: Infrastructure testing framework
  scientific_notes: 'Controls logging verbosity for test infrastructure.

    Used to validate module initialization and processing steps.

    DO NOT USE IN PRODUCTION RUNS.

    '
