module:
  name: sage_update_star_formation_supernova
  description: "Applies calculated star formation and supernova feedback to galaxy properties with stellar recycling, metal enrichment, and gas-phase transfers; resets temporary properties"

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - dT
      - Mvir
      - ColdGas
      - MetalsColdGas
      - StellarMass
      - MetalsStellarMass
      - HotGas
      - MetalsHotGas
      - EjectedGas
      - MetalsEjectedGas
      - NewStellarMass
      - SupernovaReheatedMass
      - SupernovaEjectedMass
      - StarFormationRate
      - SupernovaOutflowRate
    parameters:
      - RecycleFraction
      - Yield
      - FracZleaveDisk

  tests:
    unit: _tests/test_unit_sage_update_star_formation_supernova.c
    integration: _tests/test_integration_sage_update_star_formation_supernova.py
    scientific: []
