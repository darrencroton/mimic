module:
  name: sage_disk_instability
  description: "Applies Mo, Mao & White (1998) disk stability criterion; transfers unstable stellar mass to bulge and sets UnstableDiskGasFraction trigger for downstream modules"

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - Type
      - Vmax
      - ColdGas
      - StellarMass
      - BulgeMass
      - MetalsStellarMass
      - MetalsBulgeMass
      - DiskScaleRadius
      - UnstableDiskGasFraction
    parameters:
      - StarFormingDiskFactor

  tests:
    unit: _tests/test_unit_sage_disk_instability.c
    integration: _tests/test_integration_sage_disk_instability.py
    scientific: []

  docs:
    physics: src/modules/sage_disk_instability/README.md
