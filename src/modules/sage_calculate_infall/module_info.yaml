module:
  name: sage_calculate_infall
  display_name: "SAGE Calculate Infall"
  description: "Cosmological gas infall onto central galaxies from SAGE model."
  version: "1.0.0"
  author: "Mimic Team (ported from SAGE)"

  sources:
    - sage_calculate_infall.c

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - HaloBaryonFraction
      - InfallingGas
      - StellarMass
      - BlackHoleMass
      - ColdGas
      - HotGas
      - EjectedMass
      - MetalsEjectedMass
      - ICS
      - MetalsICS

    parameters:
      - GlobalBaryonFraction

  tests:
    unit: tests/test_unit_sage_calculate_infall.c
    integration: tests/test_integration_sage_calculate_infall.py
    scientific: tests/test_scientific_sage_calculate_infall.py

  docs:
    physics: README.md
