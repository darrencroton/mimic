module:
  name: sage_calculate_infall
  description: "Calculates cosmological gas infall onto centrals and consolidates satellite ejected gas and ICS; stores result in InfallingGas"

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - Type
      - Mvir
      - HaloBaryonFraction
      - InfallingGas
      - StellarMass
      - BlackHoleMass
      - ColdGas
      - HotGas
      - MetalsHotGas
      - ICS
      - MetalsICS
      - EjectedGas
      - MetalsEjectedGas
    parameters:
      - GlobalBaryonFraction

  tests:
    unit: _tests/test_unit_sage_calculate_infall.c
    integration: _tests/test_integration_sage_calculate_infall.py
    scientific: []
