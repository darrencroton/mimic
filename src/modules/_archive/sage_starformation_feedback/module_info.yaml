module:
  name: sage_starformation_feedback
  display_name: "SAGE Star Formation & Feedback"
  description: "Star formation (Kennicutt-Schmidt law) and supernova feedback (reheating & ejection) from SAGE model."
  version: "1.0.0"
  author: "Mimic Team (ported from SAGE)"

  # sage_starformation_feedback.c is implicit (auto-included)
  # No additional_files needed for single-file module

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - HotGas
      - MetalsHotGas
      - EjectedMass
      - MetalsEjectedMass
      - ColdGas
      - MetalsColdGas
      - StellarMass
      - MetalsStellarMass
      - DiskScaleRadius
      - OutflowRate

    parameters:
      - SFprescription
      - SfrEfficiency
      - SupernovaRecipeOn
      - FeedbackReheatingEpsilon
      - FeedbackEjectionEfficiency
      - EnergySNcode
      - EtaSNcode
      - RecycleFraction
      - Yield
      - FracZleaveDisk
      - DiskInstabilityOn

  tests:
    unit: tests/test_unit_sage_starformation_feedback.c
    integration: tests/test_integration_sage_starformation_feedback.py
    scientific: tests/test_scientific_sage_starformation_feedback_validation.py

  docs:
    physics: src/modules/sage_starformation_feedback/README.md

  compilation_requires: []
