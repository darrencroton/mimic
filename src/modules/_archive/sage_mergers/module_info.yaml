# Module Metadata: sage_mergers
#
# Galaxy merger physics from the SAGE galaxy evolution model.
# Implements dynamical friction, merger-induced starbursts, black hole growth,
# quasar feedback, and morphological transformations.
#
# For schema documentation, see:
#   docs/developer/module-metadata-schema.md

module:
  # ===========================================================================
  # Core Metadata
  # ===========================================================================

  name: sage_mergers
  display_name: "SAGE Mergers"
  description: "Galaxy merger physics: dynamical friction, starbursts, BH growth, morphology from SAGE model."
  version: "1.0.0"
  author: "Mimic Team (ported from SAGE)"

  # ===========================================================================
  # Source Files
  # ===========================================================================

  sources:
    - sage_mergers.c

  headers:
    - sage_mergers.h

  register_function: sage_mergers_register

  # ===========================================================================
  # Dependencies
  # ===========================================================================

  dependencies:
    # All halo and galaxy properties read or written by this module
    properties:
      - ColdGas
      - StellarMass
      - HotGas
      - MetalsHotGas
      - MetalsColdGas
      - EjectedMass
      - MetalsEjectedMass
      - ICS
      - MetalsICS
      - BlackHoleMass
      - BulgeMass
      - MetalsBulgeMass
      - QuasarModeBHaccretionMass
      - TimeOfLastMajorMerger
      - TimeOfLastMinorMerger
      - MetalsStellarMass
      - OutflowRate
      - DiskScaleRadius

    # All model parameters accessed via model_get_*() functions
    parameters:
      - BlackHoleGrowthRate
      - QuasarModeEfficiency
      - ThreshMajorMerger
      - RecycleFraction
      - Yield
      - FracZleaveDisk
      - FeedbackReheatingEpsilon
      - FeedbackEjectionEfficiency
      - AGNrecipeOn
      - SupernovaRecipeOn
      - DiskInstabilityOn

  # ===========================================================================
  # Testing
  # ===========================================================================

  tests:
    unit: tests/test_unit_sage_mergers.c
    integration: tests/test_integration_sage_mergers.py
    scientific: tests/test_scientific_sage_mergers_validation.py

  # ===========================================================================
  # Documentation
  # ===========================================================================

  docs:
    physics: src/modules/sage_mergers/README.md

  # ===========================================================================
  # Build Configuration
  # ===========================================================================

  compilation_requires: []
