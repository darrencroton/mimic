module:
  name: sage_mergers
  display_name: "SAGE Mergers"
  description: "Galaxy merger physics: dynamical friction, starbursts, BH growth, morphology from SAGE model."
  version: "1.0.0"
  author: "Mimic Team (ported from SAGE)"

  # sage_mergers.c is implicit (auto-included)
  # No additional_files needed for single-file module

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - ColdGas
      - MetalsColdGas
      - StellarMass
      - MetalsStellarMass
      - HotGas
      - MetalsHotGas
      - EjectedMass
      - MetalsEjectedMass
      - ICS
      - MetalsICS
      - BlackHoleMass
      - BulgeMass
      - MetalsBulgeMass
      - QuasarModeBHaccretionMass
      - TimeOfLastMajorMerger
      - TimeOfLastMinorMerger
      - SupernovaOutflowRate
      - DiskScaleRadius

    parameters:
      - BlackHoleGrowthRate
      - QuasarModeEfficiency
      - ThreshMajorMerger
      - RecycleFraction
      - Yield

  tests:
    unit: tests/test_unit_sage_mergers.c
    integration: tests/test_integration_sage_mergers.py
    scientific: tests/test_scientific_sage_mergers.py

  docs:
    physics: src/modules/sage_mergers/README.md

  compilation_requires: []
