# PARTIAL IMPLEMENTATION - starburst triggering and BH growth deferred pending sage_mergers module

module:
  name: sage_disk_instability
  display_name: "SAGE Disk Instability"
  description: "Disk stability criterion and mass redistribution from SAGE model."
  version: "1.0.0"
  author: "Mimic Team (ported from SAGE)"

  # sage_disk_instability.c is implicit (auto-included)
  # No additional_files needed for single-file module

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - ColdGas
      - MetalsColdGas
      - StellarMass
      - MetalsStellarMass
      - Vmax
      - BulgeMass
      - MetalsBulgeMass
      - DiskScaleRadius

    parameters:
      - DiskInstabilityOn
      - StarFormingDiskFactor

  tests:
    unit: tests/test_unit_sage_disk_instability.c
    integration: tests/test_integration_sage_disk_instability.py
    scientific: tests/test_scientific_sage_disk_instability.py

  docs:
    physics: src/modules/sage_disk_instability/README.md

  compilation_requires: []
