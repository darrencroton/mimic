module:
  name: sage_reincorporation
  display_name: "SAGE Gas Reincorporation"
  description: "Gas reincorporation from ejected reservoir to hot halo from SAGE model."
  version: "1.0.0"
  author: "Mimic Team (ported from SAGE)"

  sources:
    - sage_reincorporation.c

  headers:
    - sage_reincorporation.h

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - EjectedMass
      - MetalsEjectedMass
      - HotGas
      - MetalsHotGas

    parameters:
      - ReIncorporationFactor

  tests:
    unit: tests/test_unit_sage_reincorporation.c
    integration: tests/test_integration_sage_reincorporation.py
    scientific: tests/test_scientific_sage_reincorporation_validation.py

  docs:
    physics: src/modules/sage_reincorporation/README.md

  compilation_requires: []
