module:
  name: sage_handle_mergers_immediate
  description: "Single-pass SAGE merger/disruption handler with immediate live-target mutation and merger event emission"

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - HaloNr
      - SnapNum
      - Type
      - Mvir
      - deltaMvir
      - dT
      - BlackHoleMass
      - BulgeMass
      - ColdGas
      - EjectedGas
      - HotGas
      - ICS
      - MergTime
      - MetalsBulgeMass
      - MetalsColdGas
      - MetalsEjectedGas
      - MetalsHotGas
      - MetalsICS
      - MetalsStellarMass
      - StellarMass
      - TimeOfLastMajorMerger
      - TimeOfLastMinorMerger
    parameters:
      - ThresholdMajorMerger
      - ThresholdSatDisruption

  tests:
    unit: _tests/test_unit_sage_merger_ordering_parity.c
    integration: _tests/test_integration_sage_merger_event_consumers.py
    scientific: []

  docs:
    physics: src/modules/sage_handle_mergers_immediate/README.md
