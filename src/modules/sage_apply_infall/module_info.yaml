module:
  name: sage_apply_infall
  description: "Distributes infalling gas to hot reservoir over substeps with metallicity tracking; acts on FOF central only"

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - Type
      - Mvir
      - InfallingGas
      - HotGas
      - MetalsHotGas
      - EjectedGas
      - MetalsEjectedGas
    parameters: []

  tests:
    unit: _tests/test_unit_sage_apply_infall.c
    integration: _tests/test_integration_sage_apply_infall.py
    scientific: []

  docs:
    physics: src/modules/sage_apply_infall/README.md
