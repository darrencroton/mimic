# Template module metadata - copy to your module directory as module_info.yaml and customize
#
# ULTRA-SIMPLIFIED FORMAT:
#   - Only 'name' and 'supported_processing_modes' are required
#   - {name}.c is always auto-included
#   - additional_files: Only needed for multi-file modules
#   - description: Optional
#   - dependencies: Optional (skip validation if absent)
#
# For simple modules, you can just create a standalone .c file with no module_info.yaml at all!

module:
  name: template_module
  description: "Brief description of module physics"

  # Required: How to execute this module
  supported_processing_modes: [process_by_galaxy, process_full_halo]

  # Optional - only needed for multi-file modules
  # {name}.c is ALWAYS auto-included, don't list it here!
  # additional_files:
  #   - helper.c
  #   - helper.h

  # Optional - validation helpers (recommended for production modules)
  dependencies:
    properties: []       # List all properties used by this module
    parameters: []       # List all parameters needed by this module

  # Optional - test files (for production modules with test coverage)
  tests:
    unit: tests/test_unit_template_module.c
    integration: tests/test_integration_template_module.py

  # Optional - documentation
  docs:
    physics: README.md

  # Optional - compilation features required (HDF5, MPI, GSL)
  compilation_requires: []
