# Module Metadata: sage_infall
#
# Cosmological gas infall and satellite stripping from the SAGE galaxy evolution model.
# This module handles the initial gas accretion onto dark matter halos and the
# redistribution of baryons in satellite galaxies.
#
# For schema documentation, see:
#   docs/developer/module-metadata-schema.md

module:
  # ===========================================================================
  # Core Metadata
  # ===========================================================================

  name: sage_infall
  display_name: "SAGE Infall"
  description: "Cosmological gas infall onto central galaxies from SAGE model."
  version: "1.0.0"
  author: "Mimic Team (ported from SAGE)"

  # ===========================================================================
  # Source Files
  # ===========================================================================

  sources:
    - sage_infall.c

  headers:
    - sage_infall.h

  register_function: sage_infall_register

  # ===========================================================================
  # Dependencies
  # ===========================================================================

  dependencies:
    # All halo and galaxy properties read or written by this module
    properties:
      - HotGas
      - MetalsHotGas
      - EjectedMass
      - MetalsEjectedMass
      - ICS
      - MetalsICS
      - TotalSatelliteBaryons
      - InfallingGas

    # All model parameters accessed via model_get_*() functions
    parameters:
      - BaryonFrac

  # ===========================================================================
  # Testing
  # ===========================================================================

  tests:
    unit: tests/test_unit_sage_infall.c
    integration: tests/test_integration_sage_infall.py
    scientific: tests/test_scientific_sage_infall.py

  # ===========================================================================
  # Documentation
  # ===========================================================================

  docs:
    physics: src/modules/sage_infall/README.md

  # ===========================================================================
  # Build Configuration
  # ===========================================================================

  compilation_requires: []
