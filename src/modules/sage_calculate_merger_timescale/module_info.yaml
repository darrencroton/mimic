module:
  name: sage_calculate_merger_timescale
  description: "Calculates dynamical friction merger timescales for satellites using Binney & Tremaine (1987) formula; sets MergTime once per satellite episode"

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - HaloNr
      - Type
      - Len
      - Mvir
      - Rvir
      - Vvir
      - MergTime
      - StellarMass
      - ColdGas
    parameters: []

  tests:
    unit: _tests/test_unit_sage_calculate_merger_timescale.c
    integration: _tests/test_integration_sage_calculate_merger_timescale.py
    scientific: []
