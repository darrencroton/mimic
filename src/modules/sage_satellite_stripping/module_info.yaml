# Module Metadata: sage_satellite_stripping
#
# Environmental gas stripping from satellite galaxies in the SAGE model.
# Handles transfer of hot gas from satellites to central galaxy due to
# environmental processes (ram pressure stripping, tidal stripping).
#
# For schema documentation, see:
#   docs/developer/module-metadata-schema.md

module:
  # ===========================================================================
  # Core Metadata
  # ===========================================================================

  name: sage_satellite_stripping
  display_name: "SAGE Satellite Stripping"
  description: "Environmental gas stripping from satellites to central galaxy."
  version: "1.0.0"
  author: "Mimic Team (extracted from SAGE)"

  # ===========================================================================
  # Source Files
  # ===========================================================================

  sources:
    - sage_satellite_stripping.c

  headers:
    - sage_satellite_stripping.h

  register_function: sage_satellite_stripping_register

  # ===========================================================================
  # Dependencies
  # ===========================================================================

  dependencies:
    # This module reads hot gas from satellites and modifies central galaxy
    # Note: Requires these properties to exist, but modules that create them
    # don't need to run first (e.g., sage_infall). If properties don't exist,
    # stripping simply won't occur.
    requires:
      properties:
        - HotGas
        - MetalsHotGas
      parameters:
        - BaryonFrac

    # This module modifies existing properties, doesn't create new ones
    provides: []

  # ===========================================================================
  # Testing
  # ===========================================================================

  tests:
    unit: test_unit_sage_satellite_stripping.c
    integration: test_integration_sage_satellite_stripping.py
    scientific: test_scientific_sage_satellite_stripping.py

  # ===========================================================================
  # Documentation
  # ===========================================================================

  docs:
    physics: src/modules/sage_satellite_stripping/README.md

  # ===========================================================================
  # Build Configuration
  # ===========================================================================

  compilation_requires: []
  default_enabled: true
