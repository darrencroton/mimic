# Mimic Core Properties Metadata
#
# This file defines the halo tracking properties required by Mimic's
# physics-agnostic processing model. DANGER ZONE! Don't touch!
#
# See: docs/DEVELOPER-GUIDE.md for complete schema documentation

reference_units:
  mass:
    label: 1e10 Msun/h
    dimension: mass
    in_cgs: 1.989e43
    h_convention: carried
  length:
    label: Mpc/h
    dimension: length
    in_cgs: 3.08568e24
    h_convention: carried
  velocity:
    label: km/s
    dimension: velocity
    in_cgs: 1.0e5
    h_convention: none
  time:
    label: code
    dimension: time
    derived_from: length/velocity
    h_convention: carried

required_inputs:
  - { name: Descendant, role: tree_link }
  - { name: FirstProgenitor, role: tree_link }
  - { name: NextProgenitor, role: tree_link }
  - { name: FirstHaloInFOFgroup, role: tree_link }
  - { name: NextHaloInFOFgroup, role: tree_link }
  - { name: SnapNum, role: index }
  - { name: Len, role: count }
  - { name: HaloMass, role: mass }

halo_properties:
  # ===========================================================================
  # METADATA PROPERTIES
  # ===========================================================================

  - name: SnapNum
    type: int
    dimension: dimensionless
    units: dimensionless
    description: Snapshot number (index in simulation output)
    output: true
    init_source: copy_from_tree
    output_source: copy_direct
    range: [0, 1000]  # Generous range to handle various simulations

  - name: Type
    type: int
    dimension: dimensionless
    units: dimensionless
    description: Halo type (0=central, 1=satellite, 2=orphan)
    output: true
    init_source: default
    init_value: 0
    output_source: copy_direct
    range: [0, 2]  # Output values only (Type=3 used internally but never output)

  - name: CentralHalo
    type: int
    dimension: dimensionless
    units: dimensionless
    description: Index of local Type 0/1 central halo for this subhalo slice (working variable, not output)
    output: false
    init_source: skip  # Set in build_model.c, not in init_halo()

  - name: HaloNr
    type: int
    dimension: dimensionless
    units: dimensionless
    description: Halo number in tree (internal index, not output)
    output: false
    init_source: skip  # Custom: set to halonr parameter directly

  - name: UniqueGalaxyID
    type: long long
    dimension: dimensionless
    units: dimensionless
    description: Persistent unique galaxy identifier across all snapshots (file*10^15 + tree*10^9 + creation_halonr)
    output: true
    init_source: default  # Initialized to 0, then set in init_halo() after auto-gen code
    init_value: 0
    output_source: copy_direct

  - name: UniqueCentralGalaxyID
    type: long long
    dimension: dimensionless
    units: dimensionless
    description: Persistent UniqueGalaxyID of FOF host Type 0 central galaxy (equals UniqueGalaxyID if Type=0)
    output: true
    init_source: default  # Initialized to 0, then set in process_halo_evolution()
    init_value: 0
    output_source: copy_direct

  - name: dT
    type: double  # Double precision: per-object substep dt derives from this, and float
                  # rounding of the interval perturbs every dt-scaled physics quantity
    dimension: time
    units: Myr/h
    description: Time elapsed since progenitor snapshot (lookback time difference)
    output: true
    init_source: default
    init_value: -1.0
    output_source: copy_direct
    output_convert: MimicConfig.UnitTime_in_s / SEC_PER_MEGAYEAR  # Convert seconds → Myr
    range: [0.0, 2000.0]  # Reasonable time between snapshots (in Myr)
    sentinels: [-1.0]  # -1 for unset/invalid (preserved, not converted)

  # ===========================================================================
  # PHYSICAL PROPERTIES (Masses and Scales)
  # ===========================================================================

  - name: Len
    type: int
    dimension: count
    units: particles
    description: Number of particles in halo
    output: true
    init_source: copy_from_tree
    output_source: copy_direct
    range: [20, 1000000000]  # Resolution limit (20 particles) to maximum
    sentinels: [0]  # Type 2 orphans

  - name: Mvir
    type: float
    dimension: mass
    units: 1e10 Msun/h
    description: Virial mass (M200c definition)
    output: true
    init_source: calculate
    init_function: get_virial_mass
    output_source: copy_direct
    range: [0.0, 1000000.0]  # up to 10^16 Msun/h

  - name: deltaMvir
    type: float
    dimension: mass
    units: 1e10 Msun/h
    description: Change in virial mass since last snapshot (internal, not output)
    output: true
    init_source: default
    init_value: 0.0
    output_source: copy_direct
    range: [-1000.0, 1000.0]  # plus/minus 10^13 Msun/h

  - name: CentralMvir
    type: float
    dimension: mass
    units: 1e10 Msun/h
    description: Virial mass of the FoF central halo stamped onto every workspace member
    output: true
    init_source: default
    init_value: 0.0
    output_source: copy_direct
    range: [0.0, 1000000.0]  # 0 for unresolved halos, up to 10^16 Msun/h
    sentinels: [0.0]  # Unresolved or below mass limit

  - name: Rvir
    type: float
    dimension: length
    units: Mpc/h
    description: Virial radius (radius at which density is 200 * critical density)
    output: true
    init_source: calculate
    init_function: get_virial_radius
    output_source: recalculate
    output_function: output_rvir_conditional
    output_function_arg: g
    range: [0.0, 10.0]  # 0 for zero-mass edge cases, up to 10 Mpc/h
    sentinels: [0.0]  # Valid for halos with catalog Mvir=0

  - name: Vvir
    type: float
    dimension: velocity
    units: km/s
    description: Virial velocity (circular velocity at virial radius)
    output: true
    init_source: calculate
    init_function: get_virial_velocity
    output_source: recalculate
    output_function: output_vvir_conditional
    output_function_arg: g
    range: [0.0, 5000.0]  # 0 for zero-mass edge cases, up to physical maximum
    sentinels: [0.0]  # Valid for halos with catalog Mvir=0

  # ===========================================================================
  # INFALL PROPERTIES (Satellites Only)
  # ===========================================================================

  - name: infallMvir
    type: float
    dimension: mass
    units: 1e10 Msun/h
    description: Virial mass at infall (satellites only, 0 for centrals)
    output: true
    init_source: default
    init_value: -1.0
    output_source: recalculate
    output_function: output_infall_property_or_zero
    output_function_arg: g, g->infallMvir
    range: [0.000001, 1000000.0]  # 10^4 Msun/h to 10^16 Msun/h
    sentinels: [0.0, -1.0]  # 0.0 for centrals, -1.0 for unset

  - name: infallVvir
    type: float
    dimension: velocity
    units: km/s
    description: Virial velocity at infall (satellites only, 0 for centrals)
    output: true
    init_source: default
    init_value: -1.0
    output_source: recalculate
    output_function: output_infall_property_or_zero
    output_function_arg: g, g->infallVvir
    range: [10.0, 5000.0]  # Same as Vvir
    sentinels: [0.0, -1.0]  # 0.0 for centrals, -1.0 for unset

  - name: infallVmax
    type: float
    dimension: velocity
    units: km/s
    description: Maximum circular velocity at infall (satellites only, 0 for centrals)
    output: true
    init_source: default
    init_value: -1.0
    output_source: recalculate
    output_function: output_infall_property_or_zero
    output_function_arg: g, g->infallVmax
    range: [10.0, 5000.0]  # Same as Vmax
    sentinels: [0.0, -1.0]  # 0.0 for centrals, -1.0 for unset
