# Module Metadata: test_rate_supply
#
# ⚠️  WARNING: This module is for TESTING INFRASTRUCTURE ONLY ⚠️
#
# DO NOT USE IN PRODUCTION RUNS
#
# Purpose: one of the four process_rates modules of the model-neutral rate
# fixture. It feeds the fixture's hot reservoir from outside on central rows,
# feeds the hot tracer from outside at a fixed fraction of that, and cools hot
# into cold. The laws are documented in README.md.
#
# For metadata schema documentation, see:
#   docs/DEVELOPER-GUIDE.md#module-metadata-schema

module:
  # ===========================================================================
  # Core Metadata
  # ===========================================================================

  name: test_rate_supply
  display_name: "Test Rate Supply Fixture"
  description: "Rate fixture: infall onto central rows and cooling. NOT FOR PRODUCTION."
  version: "1.0.0"
  author: "Mimic Development Team"

  # ===========================================================================
  # Processing Configuration
  # ===========================================================================

  # test_rate_supply.c is implicit (auto-included)

  supported_processing_modes: [process_rates]

  # One coefficient per transfer, in this order (the law's coefficient slots).
  rates:
    transfers:
      - name: infall          # source: absolute rate, on Type 0 rows only
        from: external
        to: RateFixtureHot
      - name: infall_tracer   # source into the hot tracer, a fixed fraction of infall
        from: external
        to: RateFixtureHotTracer
      - name: cooling         # internal: specific rate
        from: RateFixtureHot
        to: RateFixtureCold

  # ===========================================================================
  # Dependencies
  # ===========================================================================

  # The halo fields the law reads, and the reservoirs its transfers move.
  dependencies:
    properties:
      - Type
      - Mvir
      - RateFixtureHot
      - RateFixtureHotTracer
      - RateFixtureCold
    parameters:
      - TestRateSupplyInfallRate
      - TestRateSupplyTracerFraction
      - TestRateSupplyCoolingRate

  # ===========================================================================
  # Tests
  # ===========================================================================

  # Exercised by tests/unit/test_rate_transfer_tables.c and
  # tests/integration/test_rate_metadata.py, which the test registry discovers
  # directly.
  tests:
    unit: null
    integration: null
    scientific: null

  # ===========================================================================
  # Documentation
  # ===========================================================================

  docs:
    physics: README.md

  # ===========================================================================
  # Build Configuration
  # ===========================================================================

  compilation_requires: []
