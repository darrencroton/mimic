# Module Metadata: test_rate_feedback
#
# ⚠️  WARNING: This module is for TESTING INFRASTRUCTURE ONLY ⚠️
#
# DO NOT USE IN PRODUCTION RUNS
#
# Purpose: one of the four process_rates modules of the model-neutral rate
# fixture. It reheats cold into hot, and returns a yield into the cold tracer
# as a slaved source: a fixed multiple of test_rate_formation's star formation
# flux, so its master is declared by another module. The laws are documented in
# README.md.
#
# For metadata schema documentation, see:
#   docs/DEVELOPER-GUIDE.md#module-metadata-schema

module:
  # ===========================================================================
  # Core Metadata
  # ===========================================================================

  name: test_rate_feedback
  display_name: "Test Rate Feedback Fixture"
  description: "Rate fixture: reheating and a slaved yield. NOT FOR PRODUCTION."
  version: "1.0.0"
  author: "Mimic Development Team"

  # ===========================================================================
  # Processing Configuration
  # ===========================================================================

  # test_rate_feedback.c is implicit (auto-included)

  supported_processing_modes: [process_rates]

  # One coefficient per transfer, in this order (the law's coefficient slots).
  rates:
    transfers:
      - name: reheating       # internal: specific rate
        from: RateFixtureCold
        to: RateFixtureHot
      - name: yield           # slaved source: dimensionless multiple of the master's flux
        from: external
        to: RateFixtureColdTracer
        slaved_to: test_rate_formation.star_formation

  # ===========================================================================
  # Dependencies
  # ===========================================================================

  # The reservoirs and the tracer its transfers move (the law reads no property).
  dependencies:
    properties:
      - RateFixtureCold
      - RateFixtureHot
      - RateFixtureColdTracer
    parameters:
      - TestRateFeedbackReheatRate
      - TestRateFeedbackYield

  # ===========================================================================
  # Tests
  # ===========================================================================

  # Exercised by tests/unit/test_rate_transfer_tables.c and
  # tests/integration/test_rate_metadata.py, which the test registry discovers
  # directly.
  tests:
    unit: null
    integration: null
    scientific: null

  # ===========================================================================
  # Documentation
  # ===========================================================================

  docs:
    physics: README.md

  # ===========================================================================
  # Build Configuration
  # ===========================================================================

  compilation_requires: []
