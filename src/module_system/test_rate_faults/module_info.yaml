# Module Metadata: test_rate_faults
#
# ⚠️  WARNING: This module is for TESTING INFRASTRUCTURE ONLY ⚠️
#
# DO NOT USE IN PRODUCTION RUNS
#
# Purpose: the rate fixture's fault injector. It declares one sink out of the
# cold reservoir whose law a parameter selects: a well-behaved constant rate, a
# coefficient that diverges as the donor empties, NaN, a negative coefficient, or
# an impure law (one that reads a static counter). The laws are documented in
# README.md.
#
# For metadata schema documentation, see:
#   docs/DEVELOPER-GUIDE.md#module-metadata-schema

module:
  # ===========================================================================
  # Core Metadata
  # ===========================================================================

  name: test_rate_faults
  display_name: "Test Rate Faults Fixture"
  description: "Rate fixture: a cold sink whose law injects a chosen fault. NOT FOR PRODUCTION."
  version: "1.0.0"
  author: "Mimic Development Team"

  # ===========================================================================
  # Processing Configuration
  # ===========================================================================

  # test_rate_faults.c is implicit (auto-included)

  supported_processing_modes: [process_rates]

  # One coefficient per transfer, in this order (the law's coefficient slot).
  rates:
    transfers:
      - name: fault           # sink: specific rate, the law the parameter selects
        from: RateFixtureCold
        to: external

  # ===========================================================================
  # Dependencies
  # ===========================================================================

  # The reservoir the law reads and its transfer moves.
  dependencies:
    properties:
      - RateFixtureCold
    parameters:
      - TestRateFaultsLaw
      - TestRateFaultsRate

  # ===========================================================================
  # Tests
  # ===========================================================================

  # Exercised by tests/integration/test_rate_phase.py, which the test registry
  # discovers directly.
  tests:
    unit: null
    integration: null
    scientific: null

  # ===========================================================================
  # Documentation
  # ===========================================================================

  docs:
    physics: README.md

  # ===========================================================================
  # Build Configuration
  # ===========================================================================

  compilation_requires: []
