# Module Metadata: test_event_consumer_alpha
#
# WARNING: This module is for TESTING INFRASTRUCTURE ONLY
#
# Purpose: Subscribes to test_event_producer's test_event.
# Together with test_event_consumer_beta (which subscribes to test_event_alt),
# validates that selective routing delivers events only to the matching consumer.

module:
  name: test_event_consumer_alpha
  description: "First consumer in event routing integration tests. NOT FOR PRODUCTION."
  version: "1.0.0"
  author: "Mimic Development Team"

  supported_processing_modes: [process_per_event]

  events:
    consumes:
      - producer: test_event_producer
        event: test_event

  dependencies:
    properties: []
    parameters: []

  tests:
    unit: null
    integration: null

  docs:
    physics: README.md
