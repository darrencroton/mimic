# Shin-Uchuu Halo Catalog Properties — L-Halo binary format (cut dataset)
#
# The complete on-disk L-Halo record of the cut Shin-Uchuu merger trees, in file
# order. This list generates `struct RawHalo`, and the lhalo_binary reader reads
# each forest's records straight into it, so the record on disk is the compiled
# struct: fourteen fields, 88 bytes with the compiler's alignment (MostBoundID at
# offset 72, SnapNum at 80, four bytes of trailing padding). It is not the
# 104-byte SAGE L-Halo record. convert/mimic-convert/write_vertical_trees.py derives
# the same layout from this file when it writes the dataset.
#
# The values are the horizontal version 3 dataset's own (simulations/shin-uchuu/),
# copied without any unit, type or convention change: M_Crit200 is the stored
# float32 Consistent-Trees Mvir in Msun/h (the generated reference-unit accessor
# applies the x1e-10 conversion), positions are Mpc/h, Spin is the stored specific
# angular momentum, (Mpc/h)(km/s), and Len is the stored particle count. The five
# links are `int` forest-local indices: a halo's index is its position in its
# forest's records, which is the horizontal dataset's HaloRankInForest.
#
# Required core roles (src/core/core_properties.yaml required_inputs):
# Descendant, FirstProgenitor, NextProgenitor, FirstHaloInFOFgroup,
# NextHaloInFOFgroup, SnapNum, Len, HaloMass.
#
# Mirror maintenance: the fields, their order, types, units, h_convention, roles
# and ranges are those of simulations/shin-uchuu-ascii/halo_properties.yaml; keep
# them in sync. A change here changes the record on disk, so every converted
# dataset must be rewritten with the new layout.

halo_properties:
  # --- merger-tree topology links (consumed directly by the core driver) ---
  - name: Descendant
    type: int
    units: dimensionless
    description: Index of the descendant halo in this forest, or -1 if none
    provides_core_role: Descendant

  - name: FirstProgenitor
    type: int
    units: dimensionless
    description: Index of the first progenitor halo in this forest, or -1 if none
    provides_core_role: FirstProgenitor

  - name: NextProgenitor
    type: int
    units: dimensionless
    description: Index of the next progenitor linked to the same descendant, or -1 if none
    provides_core_role: NextProgenitor

  - name: FirstHaloInFOFgroup
    type: int
    units: dimensionless
    description: Index of the first halo in this FoF group
    provides_core_role: FirstHaloInFOFgroup

  - name: NextHaloInFOFgroup
    type: int
    units: dimensionless
    description: Index of the next halo in this FoF group, or -1 if none
    provides_core_role: NextHaloInFOFgroup

  # --- particle count (stored value) ---
  - name: Len
    type: int
    units: particles
    description: Stored particle count, round(Mvir * 1e-10 / particle_mass)
    provides_core_role: Len

  # --- catalog mass (stored float32 Msun/h; accessor converts to 1e10 Msun/h) ---
  - name: M_Crit200
    type: float
    units: Msun/h
    h_convention: carried
    description: Stored Rockstar/Consistent-Trees Mvir (M200c), in native Msun/h
    provides_core_role: HaloMass

  # --- phase-space properties ---
  - name: Pos
    type: vec3_float
    units: Mpc/h
    h_convention: carried
    description: 3D position vector (comoving coordinates)
    output: true
    init_source: copy_from_tree_array
    output_source: copy_direct_array
    range: [0.0, 140.0]

  - name: Vel
    type: vec3_float
    units: km/s
    h_convention: none
    description: 3D velocity vector (peculiar velocity)
    output: true
    init_source: copy_from_tree_array
    output_source: copy_direct_array
    range: [-5000.0, 5000.0]

  - name: Spin
    type: vec3_float
    units: Mpc/h km/s
    description: Stored specific angular momentum (J/Mvir; raw J for a zero-mass halo)
    output: true
    init_source: copy_from_tree_array
    output_source: copy_direct_array
    range: [-1000.0, 1000.0]

  - name: VelDisp
    type: float
    units: km/s
    h_convention: none
    description: Velocity dispersion
    output: true
    init_source: copy_from_tree
    output_source: copy_direct
    range: [0.0, 5000.0]

  - name: Vmax
    type: float
    units: km/s
    h_convention: none
    description: Maximum circular velocity
    output: true
    init_source: copy_from_tree
    output_source: copy_direct
    # Floor 0.0, not micro-Uchuu's 10.0: this box's 362x finer particle mass
    # resolves halos down to a measured 1.77 km/s at Len = 2, and Vmax is a speed.
    range: [0.0, 5000.0]

  # --- halo identity ---
  - name: MostBoundID
    type: long long
    units: dimensionless
    description: Rockstar/Consistent-Trees halo id (carried through as unique identifier)
    output: true
    init_source: copy_from_tree
    output_source: copy_direct

  # --- snapshot index (core required input) ---
  - name: SnapNum
    type: int
    units: dimensionless
    description: Snapshot number (index in simulation output)
    provides_core_role: SnapNum
