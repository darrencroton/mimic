# Shin-Uchuu Simulation Metadata — snapshot-ordered HDF5 format (rehearsal subset)
#
# `snapshots/` is a symlink to your local copy of the converted dataset
# directory: 70 `snapshot_NNN.h5` files plus the `forests.h5` sidecar, produced
# by scripts/convert/ per docs/dev/SNAPSHOT-HDF5-FORMAT.md from the SUBSET
# built for the Shin-Uchuu conversion rehearsal
# (docs/dev/SHIN-UCHUU-CONVERSION-PLAN.md), not yet the full production box.
# After the production conversion this symlink is re-pointed at the production
# dataset; nothing else in this package is expected to change.
#
# `tree_name` is the snapshot filename convention, not a general pattern: the
# format fixes it at `snapshot_%03d.h5` and the reader accepts no other value.
# It is declared because the configuration layer requires `input.tree_name`
# unconditionally. first_file/last_file are metadata only; the snapshot reader
# derives its file set from the snapshot list.

input:
  first_file: 0
  last_file: 0
  tree_name: snapshot_%03d.h5
  tree_type: snapshot_hdf5
  processing_order: snapshot_ordered
  simulation_dir: simulations/shin-uchuu/snapshots
  snapshot_list_file: simulations/shin-uchuu/shin-uchuu.a_list

simulation:
  # 10^10 from the start, not the framework default, so the rehearsal exercises
  # the production identity multiplier. The forest bound holds at production
  # scale (INT64_MAX / 10^10 - 1 = 922,337,202 against 166,547,771 measured
  # forests); the HaloRankInForest bound is confirmed from the production
  # conversion report before the production run. Must match shin-uchuu-ascii.
  unique_galaxy_id_multiplier: 10000000000
  cosmology:
    omega_matter: 0.3089
    omega_lambda: 0.6911
    hubble_h: 0.6774
  box_size:
    value: 140.0
    units: Mpc/h
    h_convention: carried
  particle_mass:
    # 8.97e5 Msun/h in the reference basis unit (1e10 Msun/h). Confirmed for
    # Shin-Uchuu specifically; keep in sync with the sibling package.
    value: 0.0000897
    units: 1e10 Msun/h
    h_convention: carried
