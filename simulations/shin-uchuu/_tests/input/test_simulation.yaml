# Test Shin-Uchuu horizontal HDF5 (format version 2) Simulation Metadata
#
# Points the generic test tiers at the committed contract fixture
# (_tests/data/, regenerated by _tests/data/regenerate.sh): the synthetic
# version 2 forests of simulations/micro-uchuu-ascii-horizontal/'s fixture (three
# forests over six snapshots with adjacent links, an empty snapshot 0 and a
# populated final snapshot), converted under this package's own metadata. The
# cosmology, box size, particle mass and identity multiplier are this
# package's own (simulation_info.yaml), which the fixture's headers carry and
# the reader checks at open; the fixture's snapshot list is the last six scale
# factors of this package's own list, renumbered from 0. This is test-sized synthetic data: it exercises this package's
# compiled schema and reader path, not the Shin-Uchuu halo population. No input
# file range is declared: the horizontal reader derives its file set from the
# snapshot list.

input:
  tree_name: snapshot_%03d.h5
  tree_type: horizontal_hdf5
  processing_order: horizontal
  simulation_dir: simulations/shin-uchuu/_tests/data
  snapshot_list_file: simulations/shin-uchuu/_tests/data/shin-uchuu-fixture.a_list

simulation:
  unique_galaxy_id_multiplier: 20000000000
  cosmology:
    omega_matter: 0.3089
    omega_lambda: 0.6911
    hubble_h: 0.6774
  box_size:
    value: 140.0
    units: Mpc/h
    h_convention: carried
  particle_mass:
    value: 0.0000897
    units: 1e10 Msun/h
    h_convention: carried
