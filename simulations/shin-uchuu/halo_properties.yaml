# Shin-Uchuu Halo Catalog Properties — snapshot-ordered HDF5 format
#
# Defines the RawHalo contract for the snapshot_hdf5 reader. Every entry below
# is a `/halos` dataset of docs/dev/SNAPSHOT-HDF5-FORMAT.md (format_version 1),
# whose Halo Datasets table makes dataset names and types normative: the
# generated reader-side code consumes the datasets by name, so property names
# and the on-disk names are the same strings and no `source:` mapping is needed.
#
# The shared fields mirror simulations/shin-uchuu-ascii/halo_properties.yaml
# exactly (key order, units, h_convention, range, output, init/output sources,
# and core-role bindings): the snapshot dataset is produced from that same
# Shin-Uchuu Consistent-Trees subset by scripts/convert/, which applies the
# same reference value conventions. M_Crit200 therefore carries the native
# ctrees Mvir in Msun/h, positions are Mpc/h, Spin is the specific angular
# momentum J/Mvir, (Mpc/h)(km/s), for non-zero Mvir -- the converter
# deliberately keeps raw J for zero-mass halos -- and Len is derived as
# round(Mvir * 1e-10 / particle_mass).
#
# ForestIndex and HaloRankInForest, the producer-owned UniqueGalaxyID identity
# components the on-disk format carries explicitly, are deliberately NOT
# declared here: they are snapshot-format identity metadata governed by
# docs/dev/SNAPSHOT-HDF5-FORMAT.md, not catalog halo properties, so they are
# read directly by src/io/snapshot/read_snapshot_hdf5.c into
# struct SnapshotSlab's reader-owned forest_index/halo_rank_in_forest arrays,
# never through this file or the generated RawHalo struct. This mirrors
# simulations/micro-uchuu-snapshot/halo_properties.yaml, which omits both for
# the same reason (docs/dev/SHIN-UCHUU-CONVERSION-PLAN.md, "Simulation package
# changes required").
#
# Required core roles (src/core/core_properties.yaml required_inputs):
# Descendant, FirstProgenitor, NextProgenitor, FirstHaloInFOFgroup,
# NextHaloInFOFgroup, SnapNum, Len, HaloMass.
#
# Mirror maintenance: the shared fields track simulations/shin-uchuu-ascii.
# Any change to a shared field must be made in both, and any change to a name
# or type here must first be made in the frozen format specification.

halo_properties:
  # --- merger-tree topology links (consumed directly by the core driver) ---
  - name: Descendant
    type: int
    units: dimensionless
    description: Index of the descendant halo in this forest, or -1 if none
    provides_core_role: Descendant

  - name: FirstProgenitor
    type: int
    units: dimensionless
    description: Index of the first progenitor halo in this forest, or -1 if none
    provides_core_role: FirstProgenitor

  - name: NextProgenitor
    type: int
    units: dimensionless
    description: Index of the next progenitor linked to the same descendant, or -1 if none
    provides_core_role: NextProgenitor

  - name: FirstHaloInFOFgroup
    type: int
    units: dimensionless
    description: Index of the first halo in this FoF group
    provides_core_role: FirstHaloInFOFgroup

  - name: NextHaloInFOFgroup
    type: int
    units: dimensionless
    description: Index of the next halo in this FoF group, or -1 if none
    provides_core_role: NextHaloInFOFgroup

  # --- particle count (derived by the producer from Mvir / particle_mass) ---
  - name: Len
    type: int
    units: particles
    description: Particle count estimated from round(Mvir * 1e-10 / particle_mass)
    provides_core_role: Len

  # --- catalog mass (ctrees native Msun/h; accessor converts to 1e10 Msun/h) ---
  - name: M_Crit200
    type: float
    units: Msun/h
    h_convention: carried
    description: Rockstar/Consistent-Trees Mvir (M200c), in native Msun/h
    provides_core_role: HaloMass

  # --- phase-space properties ---
  - name: Pos
    type: vec3_float
    units: Mpc/h
    h_convention: carried
    description: 3D position vector (comoving coordinates)
    output: true
    init_source: copy_from_tree_array
    output_source: copy_direct_array
    range: [0.0, 140.0]

  - name: Vel
    type: vec3_float
    units: km/s
    h_convention: none
    description: 3D velocity vector (peculiar velocity)
    output: true
    init_source: copy_from_tree_array
    output_source: copy_direct_array
    range: [-5000.0, 5000.0]

  - name: Spin
    type: vec3_float
    units: Mpc/h km/s
    description: Specific angular momentum (J/Mvir, applied by the producer before emission)
    output: true
    init_source: copy_from_tree_array
    output_source: copy_direct_array
    range: [-1000.0, 1000.0]

  - name: VelDisp
    type: float
    units: km/s
    h_convention: none
    description: Velocity dispersion
    output: true
    init_source: copy_from_tree
    output_source: copy_direct
    range: [0.0, 5000.0]

  - name: Vmax
    type: float
    units: km/s
    h_convention: none
    description: Maximum circular velocity
    output: true
    init_source: copy_from_tree
    output_source: copy_direct
    # Floor 0.0, not micro-Uchuu's 10.0: this box's 362x finer particle mass
    # resolves halos down to a measured 1.77 km/s at Len = 2, and Vmax is a speed.
    range: [0.0, 5000.0]

  # --- halo identity ---
  - name: MostBoundID
    type: long long
    units: dimensionless
    description: Rockstar/Consistent-Trees halo id (carried through as unique identifier)
    output: true
    init_source: copy_from_tree
    output_source: copy_direct

  # --- snapshot index (core required input) ---
  - name: SnapNum
    type: int
    units: dimensionless
    description: Snapshot number (index in simulation output)
    provides_core_role: SnapNum
