# micro-Uchuu Simulation Metadata — uchuutools forests-HDF5 format
#
# Data on NT at /fred/oz214/simulations/uchuu/U100/mergertrees/.
# `snapshots/` here is a symlink to that directory; see snapshots.txt.
# Both MicroUchuu_mergertree_info.h5 (1.2 KB index) and
# MicroUchuu_mergertree.h5 (13 GB data) must be present in that directory.
# The reader is pointed at the index file; HDF5 external links transparently
# resolve into the data file.

input:
  first_file: 0
  last_file: 0
  tree_name: MicroUchuu_mergertree_info.h5
  tree_type: consistent_trees_hdf5
  simulation_dir: simulations/micro-uchuu-hdf5/snapshots
  snapshot_list_file: simulations/micro-uchuu-hdf5/micro-uchuu.a_list
  forest_distribution_scheme: linear     # weight by ForestNhalos for MPI load balance

simulation:
  cosmology:
    omega_matter: 0.3089
    omega_lambda: 0.6911
    hubble_h: 0.6774
  box_size:
    value: 100.0
    units: Mpc/h
    h_convention: carried
  particle_mass:
    value: 0.0325
    units: 1e10 Msun/h
    h_convention: carried
