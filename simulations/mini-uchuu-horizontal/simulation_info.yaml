# mini-Uchuu Simulation Metadata — horizontal HDF5 format version 3
#
# Version 3 horizontal package for mini-Uchuu, converted from L-Halo binary.
# The cosmology, box size, particle mass and a_list are simulations/mini-uchuu/'s own,
# unchanged: the reader compares every file's five physical header values and
# scale factors against them at open.
#
# `tree_name` is the snapshot filename convention, not a general pattern: the
# format fixes it at `snapshot_%03d.h5` and the reader accepts no other value.
# first_file/last_file declare the FULL simulation extent,
# Uchuu400_Planck_lhalo_binary.0-.127, as simulations/mini-uchuu/ does; the
# horizontal reader ignores them and derives its file set from the snapshot list.
# mimic-plot uses this extent as the denominator of the volume fraction (files
# processed / files declared here), so it must be the whole simulation whatever
# subset was converted. The files processed are named by the run file's
# input.first_file/last_file.
# `snapshots/` is a gitignored local symlink to a converted dataset, never
# committed data.

input:
  first_file: 0
  last_file: 127
  tree_name: snapshot_%03d.h5
  tree_type: horizontal_hdf5
  processing_order: horizontal
  simulation_dir: simulations/mini-uchuu-horizontal/snapshots
  snapshot_list_file: simulations/mini-uchuu-horizontal/mini-uchuu.a_list

simulation:
  cosmology:
    omega_matter: 0.3089
    omega_lambda: 0.6911
    hubble_h: 0.6774
  box_size:
    value: 400.0
    units: Mpc/h
    h_convention: carried
  particle_mass:
    # 3.27e8 Msun/h (Ishiyama et al. 2021, arXiv:2007.14720), confirmed by the
    # box's own arithmetic: Omega_m * rho_crit * L^3 / N = 3.2704e8 Msun/h at
    # 2560^3 particles in a 400 Mpc/h box.
    value: 0.0327
    units: 1e10 Msun/h
    h_convention: carried
