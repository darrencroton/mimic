# Test mini-Uchuu horizontal HDF5 (format version 3) Simulation Metadata
#
# Points the generic test tiers at the committed worked_graph fixture
# (_tests/data/worked_graph/, regenerated by _tests/data/regenerate.sh): the
# simulation-neutral five-halo forest over five snapshots, with gapped
# Descendant links (links_adjacent = 0), a FoF satellite and an empty
# snapshot (3), converted under simulations/mini-uchuu/'s own metadata and
# profile. The cosmology, box size and particle mass are this package's own
# (simulation_info.yaml), which the fixture's headers carry and the reader
# checks at open; the fixture's snapshot list is the last five scale factors
# of this package's list, renumbered from 0. This is test-sized synthetic
# data: it exercises this package's compiled schema and reader path, not any
# mini-Uchuu halo population. No input file range is declared: the horizontal
# reader derives its file set from the snapshot list.

input:
  tree_name: snapshot_%03d.h5
  tree_type: horizontal_hdf5
  processing_order: horizontal
  simulation_dir: simulations/mini-uchuu-horizontal/_tests/data/worked_graph
  snapshot_list_file: simulations/mini-uchuu-horizontal/_tests/data/worked_graph/worked_graph.a_list

simulation:
  cosmology:
    omega_matter: 0.3089
    omega_lambda: 0.6911
    hubble_h: 0.6774
  box_size:
    value: 400.0
    units: Mpc/h
    h_convention: carried
  particle_mass:
    value: 0.0327
    units: 1e10 Msun/h
    h_convention: carried
