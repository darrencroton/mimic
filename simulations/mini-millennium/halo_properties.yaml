# mini-Millennium Halo Catalog Properties
#
# Single self-contained description of the simulation's on-disk halo catalog.
# Every field present in the catalog record is listed here, in on-disk order;
# this list is the source of truth for the generated `struct RawHalo` (binary
# layout) and the HDF5 tree reader.
#
# Per-entry keys:
#   name         Mimic-internal field name (the generated RawHalo member).
#   source       On-disk dataset/column name; defaults to `name`. Declare it
#                only when the on-disk name differs from `name`.
#   type         C type (must match the on-disk record for binary catalogs).
#   units        On-disk unit label (registry-resolved); for dimensioned fields.
#   h_convention On-disk little-h convention for dimensioned fields.
#
# A field that Mimic copies into a halo property and/or writes to output also
# declares `output`, `init_source`, `output_source`, `description`, and `range`.
# Fields with none of those (tree links, the virial-mass input, and unused
# accounting fields) are registered for a complete on-disk record but produce no
# halo property. `core_property_map` binds each core required-input role to a
# field below; see src/core/core_properties.yaml `required_inputs`.

core_property_map:
  Descendant: Descendant
  FirstProgenitor: FirstProgenitor
  NextProgenitor: NextProgenitor
  FirstHaloInFOFgroup: FirstHaloInFOFgroup
  NextHaloInFOFgroup: NextHaloInFOFgroup
  SnapNum: SnapNum
  Len: Len
  HaloMass: M_Crit200

halo_properties:
  # --- merger-tree topology links (consumed directly by the core driver) ---
  - name: Descendant
    type: int
    units: dimensionless

  - name: FirstProgenitor
    type: int
    units: dimensionless

  - name: NextProgenitor
    type: int
    units: dimensionless

  - name: FirstHaloInFOFgroup
    type: int
    units: dimensionless

  - name: NextHaloInFOFgroup
    type: int
    units: dimensionless

  # --- particle count (core required input) ---
  - name: Len
    type: int
    units: particles

  # --- catalog masses ---
  - name: M_Mean200
    source: M_mean200
    type: float
    units: 1e10 Msun/h
    h_convention: carried

  - name: M_Crit200
    source: Mvir
    type: float
    units: 1e10 Msun/h
    h_convention: carried

  - name: M_TopHat
    type: float
    units: 1e10 Msun/h
    h_convention: carried

  # --- output halo properties (copied from the tree) ---
  - name: Pos
    type: vec3_float
    units: Mpc/h
    h_convention: carried
    description: 3D position vector (comoving coordinates)
    output: true
    init_source: copy_from_tree_array
    output_source: copy_direct_array
    range: [0.0, 10000.0]

  - name: Vel
    type: vec3_float
    units: km/s
    h_convention: none
    description: 3D velocity vector (peculiar velocity)
    output: true
    init_source: copy_from_tree_array
    output_source: copy_direct_array
    range: [-5000.0, 5000.0]

  - name: VelDisp
    type: float
    units: km/s
    h_convention: none
    description: Velocity dispersion
    output: true
    init_source: copy_from_tree
    output_source: copy_direct
    range: [0.0, 5000.0]

  - name: Vmax
    type: float
    units: km/s
    h_convention: none
    description: Maximum circular velocity
    output: true
    init_source: copy_from_tree
    output_source: copy_direct
    range: [10.0, 5000.0]

  - name: Spin
    type: vec3_float
    units: dimensionless
    description: Dimensionless spin parameter (Bullock definition)
    output: true
    init_source: copy_from_tree_array
    output_source: copy_direct_array
    range: [-20.0, 20.0]

  - name: MostBoundID
    type: long long
    units: dimensionless
    description: ID of most bound particle (original simulation halo ID)
    output: true
    init_source: copy_from_tree
    output_source: copy_direct

  # --- snapshot index (core required input; core owns the halo property) ---
  - name: SnapNum
    type: int
    units: dimensionless

  # --- catalog bookkeeping fields (registered for a complete on-disk record) ---
  - name: FileNr
    source: Filenr
    type: int
    units: dimensionless

  - name: SubhaloIndex
    source: SubHaloIndex
    type: int
    units: dimensionless

  - name: SubHalfMass
    type: float
    units: 1e10 Msun/h
    h_convention: carried
