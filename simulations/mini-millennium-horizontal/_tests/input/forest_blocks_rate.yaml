# Mimic halos-only rate fixtures on the forest_blocks fixture Run Configuration - rate battery
#
# The committed forest_blocks fixture (_tests/data/forest_blocks/, six forests over
# seven gapped mini-Millennium snapshots, snapshot 3 empty; regenerated by
# _tests/data/regenerate.sh) with the four process_rates fixtures in one rate phase and the
# discrete jump after it, run by tests/manual/run_rate_battery.py (make tests-rate). The
# battery varies this file's scheme, time-stepping, module order, record creation, task count
# and chunk count, and takes its module list and parameters from it for the real-data legs, so
# the fixture's laws are set here once. Derived from forest_blocks_halos-only.yaml; the output
# directory is overridden per run.
#
# The rate fixtures and test_rate_jump are compiled in test builds only: build
# MODEL=halos-only SIMULATION=mini-millennium-horizontal TEST_BUILD=yes and run it from the
# repository root. No modules.rate_integration section is given, so every default applies.

model:
  name: halos-only

simulation:
  name: mini-millennium-horizontal

input:
  simulation_dir: simulations/mini-millennium-horizontal/_tests/data/forest_blocks
  snapshot_list_file: simulations/mini-millennium-horizontal/_tests/data/forest_blocks/forest_blocks.a_list

output:
  output_filename: halos
  output_directory: output/rate-battery/forest-blocks
  output_format: hdf5
  snapshot_list: [6, 5, 4, 2]                       # the final two snapshots and two before them

SubSteps: 1

modules:
  phases:
    rates:
      - test_rate_supply: process_rates
      - test_rate_formation: process_rates
      - test_rate_feedback: process_rates
      - test_rate_stripping: process_rates
    jumps:
      - test_rate_jump: process_full_halo
  parameters:
    TestRateSupplyInfallRate: 0.5
    TestRateSupplyTracerFraction: 0.1
    TestRateSupplyCoolingRate: 5.0
    TestRateFormationEfficiency: 5.0
    TestRateFormationThreshold: 1.0e-7
    TestRateFeedbackReheatRate: 1.0
    TestRateFeedbackYield: 0.02
    TestRateStrippingRate: 3.0
    TestRateStrippingEjectionRate: 0.5
    TestRateJumpStarsThreshold: 1.0e-9
    TestRateJumpLossFraction: 0.1
