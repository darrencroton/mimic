# Mimic sham on the forest_blocks fixture Run Configuration - distributed identity gate
#
# The committed forest_blocks fixture (_tests/data/forest_blocks/, six forests over
# seven gapped mini-Millennium snapshots, snapshot 3 empty; regenerated by
# _tests/data/regenerate.sh), run by tests/manual/test_distributed_identity.py
# (make tests-distributed) serially and under mpirun. Derived from
# models/sham/input/sham_micro-uchuu-horizontal.yaml (this model has no
# mini-Millennium horizontal run file): the simulation name and the fixture's
# input paths substituted, the output snapshots narrowed to the fixture's 6, 5,
# 4 and 2, the output directory moved (the gate overrides it per run), and
# ShamTargetLogMassFloor raised so the serial SHAM audit line shows both
# assigned and masked ranks (the gate parses it and requires both >= 1).
# Build MODEL=sham SIMULATION=mini-millennium-horizontal and run it from the
# repository root.

model:
  name: sham

simulation:
  name: mini-millennium-horizontal

input:
  simulation_dir: simulations/mini-millennium-horizontal/_tests/data/forest_blocks
  snapshot_list_file: simulations/mini-millennium-horizontal/_tests/data/forest_blocks/forest_blocks.a_list

output:
  output_filename: sham
  output_directory: output/distributed-identity/sham
  output_format: hdf5                               # Horizontal runs write HDF5 only
  snapshot_list: [6, 5, 4, 2]                       # the final two snapshots and two before them

SubSteps: 1

modules:

  # Retirement, peak tracking and the non-member reset, before any other module.
  pre_timestep:
    - sham_rank_match: process_full_halo

  # The whole-snapshot rank match on each output snapshot.
  post_snapshot:
    - sham_rank_match: process_snapshot

  parameters:
    # Baldry et al. (2012) GAMA z < 0.06 double Schechter (physical Msun, Mpc^-3 at h = 0.7)
    ShamTargetLogMstar: 10.66      # log10 Ms [Msun]
    ShamTargetPhi1: 3.96e-3        # phi1 [Mpc^-3]
    ShamTargetAlpha1: -0.35        # alpha1 [dimensionless]
    ShamTargetPhi2: 0.79e-3        # phi2 [Mpc^-3]
    ShamTargetAlpha2: -1.47        # alpha2 [dimensionless]
    ShamTargetHubble: 0.7          # h of the published fit
    ShamTargetLogMassFloor: 11.4   # log10 lowest assignable mass [Msun at the simulation's h]
                                   # (8.0 upstream; raised so the fixture's 7 candidates split
                                   # into 4 assigned and 3 masked, which the gate requires)
    ShamTargetRedshiftMax: 0.1     # largest output redshift (the target's z < 0.06, with margin)
    ShamMinVpeak: 80               # candidate completeness floor on ShamVpeak [km/s]
