# Test mini-Millennium horizontal HDF5 (format version 3) Simulation Metadata
#
# Points the generic test tiers at the committed worked_graph fixture
# (_tests/data/worked_graph/, regenerated by _tests/data/regenerate.sh): one
# forest of five halos over five snapshots, with gapped Descendant links
# (links_adjacent = 0), a FoF satellite and an empty snapshot (3), so the
# generic tier exercises the version 3 retention path on committed data. The
# cosmology, box size and particle mass are mini-Millennium's own, which the
# fixture's headers carry and the reader checks at open; the fixture's
# snapshot list is the last five mini-Millennium scale factors, renumbered
# from 0. No input file range is declared: the horizontal reader derives its
# file set from the snapshot list.

input:
  tree_name: snapshot_%03d.h5
  tree_type: horizontal_hdf5
  processing_order: horizontal
  simulation_dir: simulations/mini-millennium-horizontal/_tests/data/worked_graph
  snapshot_list_file: simulations/mini-millennium-horizontal/_tests/data/worked_graph/worked_graph.a_list

simulation:
  cosmology:
    omega_matter: 0.25
    omega_lambda: 0.75
    hubble_h: 0.73
  box_size:
    value: 62.5
    units: Mpc/h
    h_convention: carried
  particle_mass:
    value: 0.0860657
    units: 1e10 Msun/h
    h_convention: carried
