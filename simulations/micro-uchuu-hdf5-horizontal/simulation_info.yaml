# micro-Uchuu (from forests-HDF5) Simulation Metadata — horizontal HDF5 format version 3
#
# Runtime plan Slice 7 package. The cosmology, box size, particle mass and
# a_list are simulations/micro-uchuu-hdf5/'s own, unchanged: the reader compares
# every file's five physical header values and scale factors against them at
# open.
#
# `tree_name` is the snapshot filename convention, not a general pattern: the
# format fixes it at `snapshot_%03d.h5` and the reader accepts no other value.
# first_file/last_file are metadata only; the horizontal reader derives its file
# set from the snapshot list. They name the
# converted source, the vertical package's single FileN group (files 0-0):
# its complete inventory.
# `snapshots/` is a gitignored local symlink to a converted dataset, never
# committed data.

input:
  first_file: 0
  last_file: 0
  tree_name: snapshot_%03d.h5
  tree_type: horizontal_hdf5
  processing_order: horizontal
  simulation_dir: simulations/micro-uchuu-hdf5-horizontal/snapshots
  snapshot_list_file: simulations/micro-uchuu-hdf5-horizontal/micro-uchuu.a_list

simulation:
  cosmology:
    omega_matter: 0.3089
    omega_lambda: 0.6911
    hubble_h: 0.6774
  box_size:
    value: 100.0
    units: Mpc/h
    h_convention: carried
  particle_mass:
    # 3.27e8 Msun/h (Ishiyama et al. 2021, arXiv:2007.14720), confirmed by the
    # box's own arithmetic: Omega_m * rho_crit * L^3 / N = 3.2704e8 Msun/h at
    # 640^3 particles in a 100 Mpc/h box.
    value: 0.0327
    units: 1e10 Msun/h
    h_convention: carried
