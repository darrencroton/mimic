# micro-Uchuu Simulation Metadata — Consistent-Trees ASCII format
#
# Data on NT at /fred/oz214/simulations/uchuu/U100/mergertrees/ascii_trees/.
# `snapshots/` here is a symlink to that directory; see snapshots.txt.
# The ASCII reader uses forests.list, locations.dat, and tree_0_0_0.dat
# from that directory (the last two are symlinks to MicroUchuu.* files).
# first_file/last_file are metadata only for ASCII; the reader follows
# locations.dat regardless.

input:
  first_file: 0
  last_file: 0
  tree_name: tree_0_0_0.dat
  tree_type: consistent_trees_ascii
  simulation_dir: simulations/micro-uchuu-ascii/snapshots
  snapshot_list_file: simulations/micro-uchuu-ascii/micro-uchuu.a_list

simulation:
  cosmology:
    omega_matter: 0.3089
    omega_lambda: 0.6911
    hubble_h: 0.6774
  box_size:
    value: 100.0
    units: Mpc/h
    h_convention: carried
  particle_mass:
    value: 0.0325
    units: 1e10 Msun/h
    h_convention: carried
