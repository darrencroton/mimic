# micro-Uchuu Simulation Metadata — L-Halo binary format
#
# `snapshots/` is a symlink to your local copy of the tree data directory.
# Files: Uchuu100_Planck_lhalo_binary.{0..3} (4 files, ~2.2 GB total).
# These were converted from the Consistent-Trees ASCII trees by sage-model
# and contain the same 440,651 forests and 22,580,924 halos as the ctrees
# datasets. The 26-field L-Halo struct layout is identical to mini-Millennium.

input:
  first_file: 0
  last_file: 3
  tree_name: Uchuu100_Planck_lhalo_binary
  tree_type: lhalo_binary
  simulation_dir: simulations/micro-uchuu/snapshots
  snapshot_list_file: simulations/micro-uchuu/micro-uchuu.a_list

simulation:
  cosmology:
    omega_matter: 0.3089
    omega_lambda: 0.6911
    hubble_h: 0.6774
  box_size:
    value: 100.0
    units: Mpc/h
    h_convention: carried
  particle_mass:
    # 3.27e8 Msun/h (Ishiyama et al. 2021, arXiv:2007.14720), confirmed by the
    # box's own arithmetic: Omega_m * rho_crit * L^3 / N = 3.2704e8 Msun/h at
    # 640^3 particles in a 100 Mpc/h box.
    value: 0.0327
    units: 1e10 Msun/h
    h_convention: carried
