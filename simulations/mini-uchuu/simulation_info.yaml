# mini-Uchuu Simulation Metadata — L-Halo binary format
#
# `snapshots/` is a symlink to your local copy of the tree data directory.
# Files: Uchuu400_Planck_lhalo_binary.{0..127} (128 files, ~92 GB total).
# Converted from the Consistent-Trees ASCII trees by sage-model. The 26-field
# L-Halo struct layout is identical to micro-uchuu and mini-Millennium.

input:
  first_file: 0
  last_file: 127
  tree_name: Uchuu400_Planck_lhalo_binary
  tree_type: lhalo_binary
  simulation_dir: simulations/mini-uchuu/snapshots
  snapshot_list_file: simulations/mini-uchuu/mini-uchuu.a_list

simulation:
  cosmology:
    omega_matter: 0.3089
    omega_lambda: 0.6911
    hubble_h: 0.6774
  box_size:
    value: 400.0
    units: Mpc/h
    h_convention: carried
  particle_mass:
    # 3.27e8 Msun/h (Ishiyama et al. 2021, arXiv:2007.14720), confirmed by the
    # box's own arithmetic: Omega_m * rho_crit * L^3 / N = 3.2704e8 Msun/h at
    # 2560^3 particles in a 400 Mpc/h box.
    value: 0.0327
    units: 1e10 Msun/h
    h_convention: carried
