# Millennium converter profile -- L-Halo binary, for scripts/convert/convert_trees.py.
#
# Route: --source-format lhalo_binary, validated against the ordered
# simulations/millennium/halo_properties.yaml (pass it as --halo-properties).
# Inventory: trees_063.<N>; simulation_info.yaml declares files 0-511, of
# which only 0-15 are present locally -- name the range you hold.
#
# Checked against the package's source metadata: halo_properties.yaml declares
# the shipped 19-field, 104-byte record in the order and at the offsets below.
# The roles select exactly the fields this package's vertical run consumes;
# the record's other five fields (M_Mean200, M_TopHat, FileNr, SubhaloIndex,
# SubHalfMass) are declared there as "unused catalog field, read only to
# preserve the on-disk record layout", so they are not selected here. They are
# still covered by binary_layout.offsets, which validates the whole stride.
#
# To carry any of them into the output, add entries to extra_fields; the
# grammar and a worked example are in scripts/convert/profiles/README.md and
# scripts/convert/profiles/lhalo_binary_extras_example.yaml. That changes this
# profile's column_mapping_sha256, which is the point: the digest identifies
# the selection.
#
# Byte order is the file's, not this machine's. Every shipped L-Halo dataset
# inspected in Slice 1 is little-endian.
#
# This profile only selects source fields and describes the source layout. It
# does not change a run YAML, halo_properties.yaml or the snapshots symlink.

schema_version: 1
source_format: lhalo_binary

required_columns:
  Descendant: [Descendant]
  FirstProgenitor: [FirstProgenitor]
  NextProgenitor: [NextProgenitor]
  FirstHaloInFOFgroup: [FirstHaloInFOFgroup]
  NextHaloInFOFgroup: [NextHaloInFOFgroup]
  Len: [Len]
  M_Crit200: [M_Crit200]
  Pos: [Pos]
  Vel: [Vel]
  Spin: [Spin]
  VelDisp: [VelDisp]
  Vmax: [Vmax]
  MostBoundID: [MostBoundID]
  SnapNum: [SnapNum]

extra_fields: []

# Every field of the record, selected or not: an unselected field still
# occupies its bytes, and the stride a reader steps is a property of the
# source, not of the selection.
binary_layout:
  byte_order: little
  itemsize: 104
  offsets:
    Descendant: 0
    FirstProgenitor: 4
    NextProgenitor: 8
    FirstHaloInFOFgroup: 12
    NextHaloInFOFgroup: 16
    Len: 20
    M_Mean200: 24
    M_Crit200: 28
    M_TopHat: 32
    Pos: 36
    Vel: 48
    VelDisp: 60
    Vmax: 64
    Spin: 68
    MostBoundID: 80
    SnapNum: 88
    FileNr: 92
    SubhaloIndex: 96
    SubHalfMass: 100
