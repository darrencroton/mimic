# Millennium fast-tier fixture: compiles against simulations/millennium/halo_properties.yaml
# but deliberately reuses the shared mini-Millennium tree data from tests/data/input/.
# This keeps CI fast without requiring production Millennium catalog access.
# What it tests: the Millennium-compiled binary can load LHalo trees and complete the pipeline.
# What it does NOT test: Millennium-specific halo property values or production-scale behavior.

input:
  first_file: 0
  last_file: 0
  tree_name: trees_063
  tree_type: lhalo_binary
  simulation_dir: ./tests/data/input/
  snapshot_list_file: ./tests/data/input/mini-millennium.a_list

simulation:
  cosmology:
    omega_matter: 0.25
    omega_lambda: 0.75
    hubble_h: 0.73
  box_size:
    value: 62.5
    units: Mpc/h
    h_convention: carried
  particle_mass:
    value: 0.0860657
    units: 1e10 Msun/h
    h_convention: carried
