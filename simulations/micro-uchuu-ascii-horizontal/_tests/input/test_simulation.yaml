# Test micro-Uchuu horizontal HDF5 (format version 3) Simulation Metadata
#
# Points the generic test tiers at the committed worked_ascii fixture
# (_tests/data/worked_ascii/, rebuilt by _tests/data/regenerate.sh): three
# synthetic Consistent-Trees ASCII forests over six snapshots (_tests/data/source/),
# with adjacent links, an empty snapshot 0 and a populated final snapshot,
# converted by convert/mimic-convert/convert_trees.py at the last six scale
# factors of this package's own snapshot list, so its timesteps have the
# package's real spacing. The cosmology, box size, particle mass and identity
# multiplier are this package's own (simulation_info.yaml), which the fixture's
# headers carry and the reader checks at open. No input file range is declared:
# the horizontal reader derives its file set from the snapshot list.

input:
  tree_name: snapshot_%03d.h5
  tree_type: horizontal_hdf5
  processing_order: horizontal
  simulation_dir: simulations/micro-uchuu-ascii-horizontal/_tests/data/worked_ascii
  snapshot_list_file: simulations/micro-uchuu-ascii-horizontal/_tests/data/worked_ascii/worked_ascii.a_list

simulation:
  unique_galaxy_id_multiplier: 1000000000
  cosmology:
    omega_matter: 0.3089
    omega_lambda: 0.6911
    hubble_h: 0.6774
  box_size:
    value: 100.0
    units: Mpc/h
    h_convention: carried
  particle_mass:
    value: 0.0327
    units: 1e10 Msun/h
    h_convention: carried
