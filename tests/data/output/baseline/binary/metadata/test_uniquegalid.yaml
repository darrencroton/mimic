#=============================================================================
# Mimic Test Parameter File - UniqueGalaxyID Validation
#=============================================================================
# This configuration outputs snapshots 62 and 63 for UniqueGalaxyID persistence testing.
# Used specifically by: tests/integration/test_unique_galaxy_id.py
#
# To run manually:
#   ./mimic tests/data/test_uniquegalid.yaml
#
# Output location:
#   tests/data/output/binary/
#=============================================================================

#-----------------------------------------------------------------------------
# Output Configuration
#-----------------------------------------------------------------------------
output:
  output_filename: model_uniquegalid
  output_directory: ./tests/data/output/binary/
  snapshot_count: 2  # Two snapshots for persistence testing
  output_format: binary
  snapshot_list:
  - 62
  - 63

#-----------------------------------------------------------------------------
# Input Files
#-----------------------------------------------------------------------------
input:
  first_file: 0
  last_file: 0  # Process only trees_063.0 for fast testing
  tree_name: trees_063
  tree_type: lhalo_binary
  simulation_dir: ./tests/data/input/
  snapshot_list_file: ./tests/data/input/millennium.a_list
  last_snapshot: 63

#-----------------------------------------------------------------------------
# Simulation Properties
#-----------------------------------------------------------------------------
simulation:
  cosmology:
    omega_matter: 0.25
    omega_lambda: 0.75
    hubble_h: 0.73
  box_size: 62.5  # Mpc/h
  particle_mass: 0.0860657
  units:
    length_in_cm: 3.08568e+24  # Mpc/h
    mass_in_g: 1.989e+43       # 10^10 Msun
    velocity_in_cm_per_s: 100000  # km/s

#-----------------------------------------------------------------------------
# Physics Modules
#-----------------------------------------------------------------------------
# Physics modules disabled for UniqueGalaxyID validation testing
# Tests operate in physics-free mode to validate core property tracking
modules:
  enabled: []
  parameters: {}
