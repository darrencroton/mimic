#=============================================================================
# Mimic Test Parameter File (HDF5 Output)
#=============================================================================
# This is a minimal configuration for fast automated testing.
# It processes only a single tree file (trees_063.0) and outputs
# only snapshot 63 to keep test runtime under 10 seconds.
#
# Used by: tests/unit/, tests/integration/, tests/scientific/
#
# To run manually:
#   ./mimic tests/data/test_hdf5.yaml
#
# Output location:
#   tests/data/output/hdf5/  (test output, compared against baseline/)
#
# Directory structure:
#   baseline/ - Static reference data (NEVER regenerated, committed to git)
#   binary/   - Test output from binary format runs (gitignored)
#   hdf5/     - Test output from HDF5 format runs (gitignored)
#=============================================================================

#-----------------------------------------------------------------------------
# Output Configuration
#-----------------------------------------------------------------------------
output:
  file_base_name: model
  directory: ./tests/data/output/hdf5/
  snapshot_count: 1  # Single snapshot for fast testing
  format: hdf5
  snapshot_list:
  - 63

#-----------------------------------------------------------------------------
# Input Files
#-----------------------------------------------------------------------------
input:
  first_file: 0
  last_file: 0  # Process only trees_063.0 for fast testing
  tree_name: trees_063
  tree_type: lhalo_binary
  simulation_dir: ./tests/data/input/
  snapshot_list_file: ./tests/data/input/millennium.a_list
  last_snapshot: 63
  num_tree_files: 1  # Only one file for testing

#-----------------------------------------------------------------------------
# Simulation Properties
#-----------------------------------------------------------------------------
simulation:
  cosmology:
    omega_matter: 0.25
    omega_lambda: 0.75
    hubble_h: 0.73
  box_size: 62.5  # Mpc/h
  particle_mass: 0.0860657

#-----------------------------------------------------------------------------
# Units
#-----------------------------------------------------------------------------
units:
  length_in_cm: 3.08568e+24  # Mpc/h
  mass_in_g: 1.989e+43       # 10^10 Msun
  velocity_in_cm_per_s: 100000  # km/s

#-----------------------------------------------------------------------------
# Model Parameters (REQUIRED - Phase 4.4)
#-----------------------------------------------------------------------------
# These parameters define the fundamental physics of the galaxy evolution model.
# ALL must be explicitly specified - no defaults are used.
# For parameter descriptions, see: src/modules/model_parameters.yaml
#
# Note: These parameters are REQUIRED even when no physics modules are enabled.
# This ensures input files are complete and ready for physics module activation.

model_parameters:
  # Cosmological Parameters
  BaryonFrac: 0.17                    # Cosmic baryon fraction (Planck 2018)

  # Cooling & AGN Feedback
  RadioModeEfficiency: 0.01           # Radio-mode AGN feedback efficiency
  AGNrecipeOn: 1                      # AGN feedback mode (0=off, 1=empirical, 2=Bondi, 3=cold cloud)
  CoolFunctionsDir: "src/modules/sage_cooling/CoolFunctions"  # Cooling function tables directory

  # Star Formation
  SFprescription: 0                   # SF law (0=Kennicutt-Schmidt, only option)
  SfrEfficiency: 0.02                 # Star formation efficiency
  EnergySNcode: 1.0                   # Supernova energy (code units)
  EtaSNcode: 0.5                      # Supernova rate per unit stellar mass

  # Stellar Feedback
  SupernovaRecipeOn: 1                # Enable supernova feedback (0=off, 1=on)
  FeedbackReheatingEpsilon: 3.0       # Reheating efficiency
  FeedbackEjectionEfficiency: 0.3     # Ejection efficiency

  # Stellar Evolution
  RecycleFraction: 0.43               # Instantaneous recycling fraction
  Yield: 0.03                         # Metal yield per unit stellar mass
  FracZleaveDisk: 0.3                 # Fraction of metals leaving disk

  # Gas Reincorporation
  ReIncorporationFactor: 1.0          # Reincorporation timescale factor

  # Galaxy Mergers
  BlackHoleGrowthRate: 0.01           # BH growth efficiency during mergers
  QuasarModeEfficiency: 0.001         # Quasar-mode AGN feedback efficiency
  ThreshMajorMerger: 0.3              # Mass ratio threshold for major mergers

  # Disk Instability
  DiskInstabilityOn: 1                # Enable disk instability (0=off, 1=on)
  DiskRadiusFactor: 3.0               # Disk effective radius factor

#-----------------------------------------------------------------------------
# Physics Modules
#-----------------------------------------------------------------------------
# Physics modules currently disabled for baseline testing
# Mimic operates as a physics-agnostic framework for halo tracking
modules:
  enabled: []
  parameters: {}
