module:
  name: sage_apply_metal_enrichment
  description: >-
    Applies the instantaneous-recycling disk-SF metal yield after the disk-instability chain (SAGE
    ordering parity)

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - Type
      - Mvir
      - ColdGas
      - MetalsColdGas
      - MetalsHotGas
      - NewStellarMass
    parameters:
      - Yield
      - FracZleaveDisk

  tests:
    unit: _tests/test_unit_sage_apply_metal_enrichment.c
    integration: _tests/test_integration_sage_apply_metal_enrichment.py
    scientific: []

  docs:
    physics: README.md
