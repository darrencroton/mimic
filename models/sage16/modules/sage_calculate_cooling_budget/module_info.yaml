module:
  name: sage_calculate_cooling_budget
  description: >-
    Calculates cooling budget from hot halo using metallicity-dependent cooling functions

  additional_files:
    - cooling_tables.c
    - cooling_tables.h

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - HaloNr
      - SnapNum
      - dT
      - HotGas
      - MetalsHotGas
      - CoolingGas
      - CoolingLambda
      - Rcool
      - Vvir
      - Rvir
    parameters: []

  tests:
    unit: _tests/test_unit_sage_calculate_cooling_budget.c
    integration: _tests/test_integration_sage_calculate_cooling_budget.py
    scientific: []

  docs:
    physics: README.md
