module:
  name: sage_prepare_infall_budget
  description: "Prepares the per-halo infall budget: consolidates satellite ejected gas and ICS to the central, then computes cosmological gas infall; stores result in InfallingGas"

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - Type
      - Mvir
      - HaloBaryonFraction
      - InfallingGas
      - StellarMass
      - BlackHoleMass
      - ColdGas
      - HotGas
      - ICS
      - MetalsICS
      - EjectedGas
      - MetalsEjectedGas
    parameters:
      - GlobalBaryonFraction

  tests:
    unit: _tests/test_unit_sage_prepare_infall_budget.c
    integration: _tests/test_integration_sage_prepare_infall_budget.py
    scientific: []

  docs:
    physics: README.md
