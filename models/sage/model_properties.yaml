# Mimic Galaxy Properties Metadata
#
# This file defines galaxy baryonic physics properties used in Mimic.
# These properties are created and modified by physics modules.
#
# See: docs/DEVELOPER-GUIDE.md for complete schema documentation

galaxy_properties:

  # =============================================================================
  # FUNDAMENTAL PROPERTIES
  # =============================================================================

  - name: HaloBaryonFraction
    type: float
    units: dimensionless
    description: Local baryon fraction for this halo
    output: true
    init_source: default
    init_value: -1.0  # Initialise with GlobalBaryonFraction when first used
    output_source: galaxy_property
    range: [0.0, 1.0]  # Must be physical fraction
    sentinels: [-1.0]  # No special sentinels - should always be set by reionization module

  # =============================================================================
  # GAS COMPONENTS
  # =============================================================================

  - name: InfallingGas
    type: float
    units: 1e10 Msun/h
    description: Cosmological gas infalling onto galaxy this snapshot
    role: transport  # Written by sage_prepare_infall_budget (pre_timestep); read by sage_apply_infall (phase_1)
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true
    range: [-100000.0, 100000.0]  # Can be negative for mass loss
    sentinels: [0.0]  # Can be zero if no infall (e.g., satellites)

  - name: CoolingGas
    type: float
    units: 1e10 Msun/h
    description: Gas mass cooling from hot to cold this substep
    role: transport  # Written by sage_calculate_cooling_budget; read/modified by sage_radio_mode_heating; consumed by sage_apply_cooling
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h (cannot be negative)
    sentinels: [0.0]  # Can legitimately be zero (no cooling)

  - name: ColdGas
    type: float
    units: 1e10 Msun/h
    description: Cold gas mass available for star formation
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h (generous upper bound)
    sentinels: [0.0]  # Legitimate to have no cold gas

  - name: HotGas
    type: float
    units: 1e10 Msun/h
    description: Hot gas mass in halo atmosphere
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Can legitimately be zero (all gas cooled or ejected)

  - name: EjectedGas
    type: float
    units: 1e10 Msun/h
    description: Mass of gas ejected from galaxy by feedback
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Can be zero if no feedback has occurred

  # =============================================================================
  # STELLAR COMPONENTS
  # =============================================================================

  - name: StellarMass
    type: float
    units: 1e10 Msun/h
    description: Total stellar mass
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h (generous upper bound)
    sentinels: [0.0]  # Legitimate to have no stars yet

  - name: BulgeMass
    type: float
    units: 1e10 Msun/h
    description: Stellar mass in bulge component
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= StellarMass
    sentinels: [0.0]  # Can be zero for pure disk galaxies

  - name: ICS
    type: float
    units: 1e10 Msun/h
    description: Intracluster stellar mass
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Zero if no satellites have been disrupted

  - name: NewStellarMass
    type: float
    units: 1e10 Msun/h
    description: New stars formed this timestep
    role: transport  # Written by sage_calculate_star_formation; read by sage_calculate_supernova_feedback and sage_apply_star_formation_supernova
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Zero when no star formation occurring

  - name: StarFormationRate
    type: float
    units: Msun/yr
    description: Average star formation rate over snapshot (total stars formed / dT)
    output: true
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    output_source: galaxy_property
    output_convert: UnitMass_in_g / UnitTime_in_s * SEC_PER_YEAR / SOLAR_MASS
    range: [0.0, 10000.0]  # Up to 10^4 Msun/yr (extreme starbursts)
    sentinels: [0.0]  # Zero when no star formation

  # =============================================================================
  # CHEMICAL COMPOSITION
  # =============================================================================

  - name: MetalsStellarMass
    type: float
    units: 1e10 Msun/h
    description: Metal mass in stellar component
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= StellarMass
    sentinels: [0.0]  # Primordial stars (Pop III) would have zero metals

  - name: MetalsBulgeMass
    type: float
    units: 1e10 Msun/h
    description: Metal mass in bulge component
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= BulgeMass
    sentinels: [0.0]  # Can be zero

  - name: MetalsColdGas
    type: float
    units: 1e10 Msun/h
    description: Metal mass in cold gas reservoir
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= ColdGas
    sentinels: [0.0]  # Primordial gas has zero metals

  - name: MetalsHotGas
    type: float
    units: 1e10 Msun/h
    description: Metal mass in hot gas reservoir
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= HotGas
    sentinels: [0.0]  # Primordial gas has zero metals

  - name: MetalsICS
    type: float
    units: 1e10 Msun/h
    description: Metal mass in intracluster stars
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= ICS
    sentinels: [0.0]  # Can be zero

  - name: MetalsEjectedGas
    type: float
    units: 1e10 Msun/h
    description: Metal mass in ejected gas reservoir
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= EjectedGas
    sentinels: [0.0]  # Can be zero

  # =============================================================================
  # BLACK HOLES
  # =============================================================================

  - name: BlackHoleMass
    type: float
    units: 1e10 Msun/h
    description: Central supermassive black hole mass
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 1.0]  # 0 to 10^10 Msun/h (BH masses are typically much smaller than galaxy masses)
    sentinels: [0.0]  # Can legitimately be zero (no BH seeding yet)

  - name: QuasarModeBHaccretionMass
    type: float
    units: 1e10 Msun/h
    description: Current timestep black hole accretion mass in quasar mode
    output: true
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    output_source: galaxy_property
    range: [0.0, 1.0]  # Typically << galaxy mass
    sentinels: [0.0]  # Zero if no quasar-mode accretion

  # =============================================================================
  # ENERGY & FEEDBACK
  # =============================================================================

  - name: SupernovaReheatedMass
    type: float
    units: 1e10 Msun/h
    description: Gas mass to be reheated by supernova feedback this timestep
    role: transport  # Written by sage_calculate_supernova_feedback; consumed by sage_apply_star_formation_supernova
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Zero when no feedback occurring

  - name: SupernovaEjectedMass
    type: float
    units: 1e10 Msun/h
    description: Gas mass to be ejected by supernova feedback this timestep
    role: transport  # Written by sage_calculate_supernova_feedback; consumed by sage_apply_star_formation_supernova
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Zero when no feedback occurring

  - name: Cooling
    type: double  # Note: double precision for energy accumulation over time
    units: log10(erg/s)
    description: Cumulative cooling energy (0.5 * m * V_vir^2), converted to erg/s and log10-transformed
    output: true
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    output_source: galaxy_property
    output_convert: UnitEnergy_in_cgs / UnitTime_in_s  # Convert from code units to erg/s
    output_transform: log10  # Apply log10 transform (sentinel 0.0 is skipped)
    range: [0.0, 1000000.0]  # Energy can accumulate to very large values
    sentinels: [0.0]  # Can be zero if no cooling has occurred

  - name: Heating
    type: double  # Note: double precision for energy accumulation over time
    units: log10(erg/s)
    description: Cumulative AGN heating energy (0.5 * m * V_vir^2), converted to erg/s and log10-transformed
    output: true
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    output_source: galaxy_property
    output_convert: UnitEnergy_in_cgs / UnitTime_in_s  # Convert from code units to erg/s
    output_transform: log10  # Apply log10 transform (sentinel 0.0 is skipped)
    range: [0.0, 1000000.0]  # Energy can accumulate to very large values
    sentinels: [0.0]  # Can be zero if no AGN heating has occurred

  - name: Rcool
    type: float
    units: Mpc/h
    description: Cooling radius calculated this substep
    role: transport  # Written by sage_calculate_cooling_budget; read by sage_apply_cooling
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true
    range: [0.0, 10.0]  # 0 to 10 Mpc/h (cannot be negative)
    sentinels: [0.0]  # Can be zero if no cooling

  - name: CoolingLambda
    type: float
    units: erg cm^3/s
    description: Metallicity-dependent cooling function Lambda(T,Z) from Sutherland & Dopita (1993)
    role: transport  # Written by sage_calculate_cooling_budget; diagnostic output only (output: false)
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true
    range: [0.0, 1.0e-20]  # Cooling function range (cannot be negative)
    sentinels: [0.0]  # Can be zero if no cooling or primordial gas

  - name: Rheat
    type: float
    units: Mpc/h
    description: Heating radius from past AGN feedback events
    output: false
    init_source: default
    init_value: 0.0
    range: [0.0, 10.0]  # Comparable to virial radius
    sentinels: [0.0]  # Can be zero if no AGN heating has occurred

  - name: SupernovaOutflowRate
    type: float
    units: Msun/yr
    description: Current gas outflow rate from supernova feedback
    output: true
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    output_source: galaxy_property
    output_convert: UnitMass_in_g / UnitTime_in_s * SEC_PER_YEAR / SOLAR_MASS
    range: [0.0, 10000.0]  # Up to 10^4 Msun/yr (extreme starbursts)
    sentinels: [0.0]  # Zero when no star formation/feedback occurring

  # =============================================================================
  # STRUCTURE
  # =============================================================================

  - name: DiskScaleRadius
    type: float
    units: Mpc/h
    description: Disk scale radius (exponential disk scale length)
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 10.0]  # Comparable to virial radius
    sentinels: [0.0]  # Can be zero for galaxies without formed disks

  # =============================================================================
  # MERGER HISTORY
  # =============================================================================

  - name: MergTime
    type: float
    units: Internal
    description: Merger timescale (internal, not output)
    output: false
    init_source: default
    init_value: 999.9
    range: [0.0, 1000.0]

  - name: TimeOfLastMajorMerger
    type: float
    units: Gyr/h
    description: Cosmic time of last major merger (mass ratio > threshold)
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    output_convert: UnitTime_in_s / SEC_PER_MEGAYEAR / 1000.0
    range: [0.0, 14.0]  # Age of universe
    sentinels: [0.0]  # Zero if no major merger occurred

  - name: TimeOfLastMinorMerger
    type: float
    units: Gyr/h
    description: Cosmic time of last minor merger (mass ratio > 0.1)
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    output_convert: UnitTime_in_s / SEC_PER_MEGAYEAR / 1000.0
    range: [0.0, 14.0]  # Age of universe
    sentinels: [0.0]  # Zero if no minor merger occurred

  # =============================================================================
  # DISK INSTABILITY & MERGER TRIGGERS
  # =============================================================================

  - name: UnstableDiskGasFraction
    type: float
    units: dimensionless
    description: Fraction of cold gas that is unstable (0.0-1.0)
    role: transport  # Written by sage_disk_instability; read by sage_quasar_mode and sage_starburst_feedback; reset to 0.0 each substep (init_repeat)
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    range: [0.0, 1.0]
    sentinels: [0.0]
