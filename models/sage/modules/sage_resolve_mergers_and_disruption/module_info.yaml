module:
  name: sage_resolve_mergers_and_disruption
  description: "Single-pass SAGE merger/disruption handler with immediate live-target mutation and merger event emission"

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - HaloNr
      - SnapNum
      - Type
      - CentralHalo
      - Mvir
      - deltaMvir
      - dT
      - BlackHoleMass
      - BulgeMass
      - ColdGas
      - EjectedGas
      - HotGas
      - ICS
      - MergTime
      - MetalsBulgeMass
      - MetalsColdGas
      - MetalsEjectedGas
      - MetalsHotGas
      - MetalsICS
      - MetalsStellarMass
      - StellarMass
      - TimeOfLastMajorMerger
      - TimeOfLastMinorMerger
    parameters:
      - ThresholdMajorMerger
      - ThresholdSatDisruption

  events:
    emits:
      - name: merger
        description: "Emitted after live-target merger transfer completes; payload: value0=baryonic mass ratio, value1=source substep dt"

  tests:
    unit: _tests/test_unit_sage_merger_ordering_parity.c
    integration: _tests/test_integration_sage_merger_event_consumers.py
    scientific: []

  docs:
    physics: models/sage/modules/sage_resolve_mergers_and_disruption/README.md
