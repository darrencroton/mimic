module:
  name: sage_calculate_star_formation
  description: "Swappable SF rate prescription: computes stellar mass formed this substep via Kennicutt-Schmidt efficiency with critical threshold; stores result in NewStellarMass transport field"

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - Type
      - HaloNr
      - SnapNum
      - dT
      - Vvir
      - ColdGas
      - DiskScaleRadius
      - NewStellarMass
    parameters:
      - SfrEfficiency
      - StarFormingDiskFactor

  tests:
    unit: _tests/test_unit_sage_calculate_star_formation.c
    integration: _tests/test_integration_sage_calculate_star_formation.py
    scientific: []

  docs:
    physics: models/sage/modules/sage_calculate_star_formation/README.md
