module:
  name: sham_assign_stellar_mass
  description: "Tracks Mpeak/Vpeak and assigns stellar mass from a monotonic SHAM-style stellar-to-halo mass relation with deterministic scatter."
  supported_processing_modes:
    - process_full_halo

  dependencies:
    properties:
      - Type
      - dT
      - Mvir
      - Vmax
      - StellarMass
      - BulgeMass
      - MetalsStellarMass
      - MetalsBulgeMass
      - StarFormationRate
      - ShamMpeak
      - ShamVpeak
      - ShamStellarMassNoScatter
      - ShamScatterDex
      - ShamOrphanAge
    parameters:
      - ShamLogM1
      - ShamN
      - ShamBeta
      - ShamGamma
      - ShamScatterDex
      - ShamMinMpeak
      - ShamMinVpeak
      - ShamMaxStellarBaryonFraction
      - ShamOrphanMaxAgeMyr
      - ShamUseScatter

  tests:
    unit: []
    integration: []
    scientific: []

  docs:
    physics: README.md

