# SHAM figure profile: the stellar mass function against its configured target, the
# stellar-to-halo relations, the satellite fraction and the stellar-mass-threshold correlation
# function, plus four halo diagnostics. The shipped run writes one epoch, so there are no
# evolution figures. Axis keys are set per simulation in <simulation>_plot_profile.yaml; every
# figure carries its own defaults.

mode: exploration

plots:
  snapshot:
    - halo_mass_function
    - spin_distribution
    - velocity_distribution
    - spatial_distribution
    - stellar_mass_function
    - sham_stellar_halo_relation
    - sham_satellite_fraction
    - sham_correlation_function
  evolution: []
