# Mimic SHAM on mini-Millennium Run Configuration

model:
  name: sham

simulation:
  name: mini-millennium

output:
  output_filename: sham
  output_directory: output/sham-mini-millennium
  output_format: hdf5                               # Select binary or hdf5
  snapshot_list: [63, 37, 32, 27, 23, 20, 18, 16]   # Leave empty for all snapshots

SubSteps: 1

modules:

  pre_timestep:

  # SHAM has no per-substep middle phases; abundance matching runs once in
  # post_timestep. A 'phases:' block would be added here if a model needed one.

  post_timestep:
    - sham_assign_stellar_mass: process_full_halo

  parameters:
    # Moster et al. (2013) z=0 double-power-law SMHM parameters.
    ShamLogM1: 11.590
    ShamN: 0.0351
    ShamBeta: 1.376
    ShamGamma: 0.608

    # Reddick et al.-style SHAM scatter scale; deterministic per galaxy ID.
    ShamUseScatter: 1
    ShamScatterDex: 0.20

    # mini-Millennium tree resolution and conservative orphan treatment.
    ShamMinMpeak: 0.10
    ShamMinVpeak: 80.0
    ShamMaxStellarBaryonFraction: 0.17
    ShamOrphanMaxAgeMyr: 3000.0
