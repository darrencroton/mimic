# Mimic SHAM global rank on the micro-Uchuu horizontal fixture Run Configuration
#
# A framework demonstration of whole-snapshot abundance matching, not a science run.
# sham_global_rank ranks every Type 0/1/2 galaxy of each snapshot by peak Vmax
# (ShamVpeak, ties by ascending UniqueGalaxyID) and gives zero-based rank r the mass
# at which n(>M) = n0 (M / M0)^(-alpha) equals (r + 0.5) / BoxSize^3.
#
# The target is uncalibrated: the parameters below were chosen only to keep every
# mass inside the module's (0, 100000] range and carry no observational claim. With
# BoxSize = 100 Mpc/h, n0 * BoxSize^3 = 1, so rank r receives 8 / (r + 0.5) in units
# of 1e10 Msun/h (rank 0: exactly 16). The population is the committed synthetic
# fixture of three forests over six snapshots, which is not a complete cosmological
# volume. Run it from the repository root (simulation.config is repository-relative)
# with a build of MODEL=sham SIMULATION=micro-uchuu-ascii-horizontal.

model:
  name: sham

simulation:
  name: micro-uchuu-ascii-horizontal
  config: simulations/micro-uchuu-ascii-horizontal/_tests/input/test_simulation.yaml

output:
  output_filename: sham_global
  output_directory: output/sham-global-micro-uchuu-ascii-horizontal
  output_format: hdf5                               # Horizontal runs write HDF5 only
  snapshot_list: []                                 # Every fixture snapshot

SubSteps: 1

modules:

  # No FoF-phase physics: the stellar mass comes only from the snapshot-wide ranking,
  # which runs once per snapshot after every FoF group has been processed.
  post_snapshot:
    - sham_global_rank: process_snapshot

  parameters:
    ShamGlobalMassScale: 8.0         # M0 [1e10 Msun/h]
    ShamGlobalNumberDensity: 1.0e-6  # n0 [(Mpc/h)^-3]
    ShamGlobalSlope: 1.0             # alpha [dimensionless]
