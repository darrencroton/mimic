# Mimic SHAM Galaxy Properties Metadata
#
# The subhalo abundance matching package declares the stellar mass it assigns,
# the two peak proxies it accumulates along each resolved branch, and the flag
# that marks rows outside the matched sample. Every other output field
# (positions, velocities, masses, identities) is core or simulation catalogue
# data.

galaxy_properties:

  # =============================================================================
  # STELLAR MASS
  # =============================================================================

  - name: StellarMass
    type: float
    units: 1e10 Msun/h
    description: Total stellar mass
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h (generous upper bound)
    sentinels: [0.0]  # Legitimate to have no stars yet

  # =============================================================================
  # SHAM PROXIES AND SAMPLE FLAG
  # =============================================================================

  - name: ShamMpeak
    type: float
    units: 1e10 Msun/h
    description: Peak virial mass along the tracked galaxy branch used by SHAM
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    # Tracks the catalogue Mvir range: the peak ratchets up from Mvir, so it cannot exceed it.
    range: [0.0, 1000000.0]
    sentinels: [0.0]

  - name: ShamVpeak
    type: float
    units: km/s
    description: Peak maximum circular velocity along the tracked galaxy branch used by SHAM
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    # Tracks the catalogue Vmax range: the peak ratchets up from Vmax, so it cannot exceed it.
    range: [0.0, 5000.0]
    sentinels: [0.0]

  - name: ShamGhost
    type: int
    units: dimensionless
    description: SHAM sample flag (1 = not a sample member, StellarMass 0; 0 = rank-matched member)
    output: true
    init_source: default
    init_value: 0
    output_source: galaxy_property
    range: [0, 1]
    notes: >-
      sham_rank_match sets 1 on every row in pre_timestep, then 0 on each candidate it assigns a
      stellar mass at an output snapshot. Rows below the ShamMinVpeak completeness floor, masked
      candidates below the target's mass floor, and every row of a non-output snapshot keep 1.
      Consumers select the sample with ShamGhost == 0; the other rows stay in output so halo
      catalogues remain complete.
