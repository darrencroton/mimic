# Mimic halos-only Millennium - horizontal HDF5 version 3
#
# Identical to halos-only_millennium.yaml except for simulation.name,
# output.output_directory and input.last_file. This run covers the whole simulation
# (files 0-511); the vertical file reads files 0-15 to stay quick to run. The
# package's parity gate runs the vertical side over 0-511 in a scratch copy and
# checks that these are the only differences.

model:
  name: halos-only

simulation:
  name: millennium-horizontal

input:
  first_file: 0
  last_file: 511

output:
  output_filename: halos
  output_directory: output/halos-only-millennium-horizontal
  output_format: hdf5
  snapshot_list: [63, 37, 32, 27, 23, 20, 18, 16]

SubSteps: 1

modules:
  parameters: {}
