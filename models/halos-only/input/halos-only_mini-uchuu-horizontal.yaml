# Mimic halos-only mini-Uchuu - horizontal HDF5 version 3
#
# Identical to halos-only_mini-uchuu.yaml except for simulation.name,
# output.output_directory and input.last_file. This run covers the whole simulation
# (files 0-127); the vertical file reads files 0-3 to stay quick to run. The
# package's parity gate runs the vertical side over 0-127 in a scratch copy and
# checks that these are the only differences.

model:
  name: halos-only

simulation:
  name: mini-uchuu-horizontal

input:
  first_file: 0
  last_file: 127

output:
  output_filename: halos
  output_directory: output/halos-only-mini-uchuu-horizontal
  output_format: hdf5
  snapshot_list: [49, 28, 23, 16, 12, 10, 8, 7]

SubSteps: 1

modules:
  parameters: {}
