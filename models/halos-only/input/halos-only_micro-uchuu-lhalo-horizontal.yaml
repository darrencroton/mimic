# Mimic halos-only micro-Uchuu (horizontal HDF5 version 3, from L-Halo binary) Run Configuration
#
# Identical to halos-only_micro-uchuu.yaml except for simulation.name and
# output.output_directory; the package's parity gate checks exactly that.

model:
  name: halos-only

simulation:
  name: micro-uchuu-lhalo-horizontal

output:
  output_filename: halos
  output_directory: output/halos-only-micro-uchuu-lhalo-horizontal
  output_format: hdf5
  snapshot_list: [49, 28, 23, 16, 12, 10, 8, 7]

SubSteps: 1

modules:
  parameters: {}
