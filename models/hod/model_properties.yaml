# Mimic HOD Galaxy Properties Metadata
#
# The halo occupation distribution package declares exactly one galaxy
# property. A threshold HOD assigns membership of a luminosity-threshold
# sample, not a stellar mass, so no stellar or gas reservoir is declared. Every
# other output field (positions, velocities, masses, identities) is core or
# simulation catalogue data.

galaxy_properties:

  - name: HODGhost
    type: int
    units: dimensionless
    description: HOD sample flag (1 = scaffold row outside the sample, 0 = sample member)
    output: true
    init_source: default
    init_value: 0
    output_source: galaxy_property
    range: [0, 1]
    notes: >-
      hod_populate sets 1 on every row of each FoF group, then 0 on a Type 0 host whose central
      is drawn present and on every satellite it creates. Consumers select the sample with
      HODGhost == 0; the scaffold rows stay in output so halo catalogues remain complete.
