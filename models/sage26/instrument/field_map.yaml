# SAGE26 -> Mimic field map for the T1 parity instrument (compare_sage26.py).
#
# One entry per dataset SAGE26 writes in each Snap_<N> group of its HDF5 output
# (81 datasets, SAGE26's output order from src/io/save_gals_hdf5_fields.h).
# Each entry is either a mapping or `uncompared` with its reason. A mapping gives:
#   kind         float or int: which comparison rule applies (rules 6 and 8)
#   mimic        the Mimic output property (the Galaxies compound field name)
#   component    for Pos, Vel and Spin only: the index into Mimic's 3-element array
#   source       which metadata file declares the Mimic property:
#                model      = models/sage26/model_properties.yaml
#                core       = src/core/core_properties.yaml
#                simulation = simulations/mini-millennium/halo_properties.yaml
#   sage26_type  the SAGE26 dataset's storage type
#   mimic_type   the Mimic property's storage type (per element for a vector)
#   factor       multiplies the Mimic value before comparison (rule 6); exactly 1
#                for every model property (campaign decision D5)
#   unit_check   core and simulation mappings: SAGE26's written unit checked
#                against Mimic's output unit from source, with lines. SAGE26
#                paths are relative to the staged reference source; Mimic paths
#                are relative to the repository root.
# A factor other than 1 would also need `factor_citation` (the SAGE26 writer line
# and the Mimic metadata or code line that establish the conversion); no entry
# has one, because every core and simulation unit check found the units equal.
# No entry remaps a sentinel or applies an offset.
#
# Format: the strict YAML subset compare_sage26.py parses without a YAML library.
# Full-line comments only; two-space indentation; each value a bare token or a
# double-quoted JSON string.

format: 1
fields:
  SnapNum:
    kind: int
    mimic: SnapNum
    source: core
    sage26_type: int32
    mimic_type: int32
    factor: 1
    unit_check: "Unitless on both sides. SAGE26 writes g->SnapNum unconverted (src/io/save_gals_hdf5.c:861; field list src/io/save_gals_hdf5_fields.h:21-23, Unitless). Mimic core SnapNum is dimensionless, copy_from_tree and copy_direct (src/core/core_properties.yaml:47-54). Factor 1."
  Type:
    kind: int
    mimic: Type
    source: core
    sage26_type: int32
    mimic_type: int32
    factor: 1
    unit_check: "Unitless on both sides. SAGE26 writes g->Type unconverted (src/io/save_gals_hdf5.c:867; src/io/save_gals_hdf5_fields.h:24-26). Mimic core Type is dimensionless, copy_direct (src/core/core_properties.yaml:56-64). Factor 1."
  GalaxyIndex:
    uncompared: "SAGE26 identity encodings; Mimic's `UniqueGalaxyID` and `UniqueCentralGalaxyID` encode identity differently by design, and matching uses the physical key of rule 4"
  CentralGalaxyIndex:
    uncompared: "SAGE26 identity encodings; Mimic's `UniqueGalaxyID` and `UniqueCentralGalaxyID` encode identity differently by design, and matching uses the physical key of rule 4"
  SAGEHaloIndex:
    uncompared: "SAGE26's forest-local halo and tree numbering, which Mimic's core does not reproduce"
  SAGETreeIndex:
    uncompared: "SAGE26's forest-local halo and tree numbering, which Mimic's core does not reproduce"
  SimulationHaloIndex:
    kind: int
    mimic: MostBoundID
    source: simulation
    sage26_type: int64
    mimic_type: int64
    factor: 1
    unit_check: "Unitless on both sides. SAGE26 writes llabs(halos[g->HaloNr].MostBoundID) (src/io/save_gals_hdf5.c:878; src/io/save_gals_hdf5_fields.h:39-41, 'Most bound particle ID from the tree files'; halo member long long MostBoundID at src/core_simulation.h:39). Mimic MostBoundID is the catalogue long long, copy_from_tree and copy_direct with no transformation (simulations/mini-millennium/halo_properties.yaml:137-143). Factor 1. Mimic does not take the absolute value; the two agree for non-negative catalogue IDs, and the T1 reference holds no negative SimulationHaloIndex at T1's eight snapshots (checked at Snap_63, Snap_37, Snap_16)."
  mergeType:
    uncompared: "SAGE26 writes them by backpatching a galaxy's earlier output record after it merges in the following step; Mimic writes each record once and a merged galaxy leaves the output, so no counterpart exists"
  mergeIntoID:
    uncompared: "SAGE26 writes them by backpatching a galaxy's earlier output record after it merges in the following step; Mimic writes each record once and a merged galaxy leaves the output, so no counterpart exists"
  mergeIntoSnapNum:
    uncompared: "SAGE26 writes them by backpatching a galaxy's earlier output record after it merges in the following step; Mimic writes each record once and a merged galaxy leaves the output, so no counterpart exists"
  dT:
    kind: float
    mimic: dT
    source: core
    sage26_type: float32
    mimic_type: float64
    factor: 1
    unit_check: "Same unit, Myr computed from code time by the same expression. SAGE26 writes g->dT * UnitTime_in_s / SEC_PER_MEGAYEAR (src/io/save_gals_hdf5.c:884), dT in code time (src/core_allvars.h:122), UnitTime_in_s = UnitLength_in_cm / UnitVelocity_in_cm_per_s (src/core_init.c:94), SEC_PER_MEGAYEAR 3.155e13 (src/macros.h:36); label Myr (src/io/save_gals_hdf5_fields.h:51-53). Mimic core dT has output_convert MimicConfig.UnitTime_in_s / SEC_PER_MEGAYEAR (src/core/core_properties.yaml:99-110, label Myr/h, the h carried by code time that SAGE26's label omits), UnitTime_in_s = UnitLength_in_cm / UnitVelocity_in_cm_per_s (src/core/init.c:84), SEC_PER_MEGAYEAR 3.155e13 (src/module_system/physical_constants.h:25). Code units are equal on both sides: the reference's Header/Runtime attributes, written at SAGE26 src/io/save_gals_hdf5.c:1351-1353, are UnitLength_in_cm 3.08568e24, UnitMass_in_g 1.989e43 and UnitVelocity_in_cm_per_s 1e5, the reference_units of src/core/core_properties.yaml:10-31. Factor 1. Mimic keeps the -1 sentinel unconverted (src/core/core_properties.yaml:110) where SAGE26 would convert it; no remapping is applied, and the T1 reference has no dT < 0 at Snap_63, Snap_37 or Snap_16."
  Posx:
    kind: float
    mimic: Pos
    component: 0
    source: simulation
    sage26_type: float32
    mimic_type: float32
    factor: 1
    unit_check: "Same unit, Mpc/h, the catalogue value copied unconverted. SAGE26 copies halos[halonr].Pos into float Pos[3] [Mpc/h] (src/core_allvars.h:126; src/model_misc.c:108; src/core_build_model.c:257) and writes g->Pos[0] (src/io/save_gals_hdf5.c:886; src/io/save_gals_hdf5_fields.h:54-62, Mpc/h). Mimic Pos is vec3_float, Mpc/h, copy_from_tree_array and copy_direct_array (simulations/mini-millennium/halo_properties.yaml:82-90). Factor 1."
  Posy:
    kind: float
    mimic: Pos
    component: 1
    source: simulation
    sage26_type: float32
    mimic_type: float32
    factor: 1
    unit_check: "Same unit, Mpc/h, the catalogue value copied unconverted. SAGE26 copies halos[halonr].Pos into float Pos[3] [Mpc/h] (src/core_allvars.h:126; src/model_misc.c:108; src/core_build_model.c:257) and writes g->Pos[1] (src/io/save_gals_hdf5.c:887; src/io/save_gals_hdf5_fields.h:54-62, Mpc/h). Mimic Pos is vec3_float, Mpc/h, copy_from_tree_array and copy_direct_array (simulations/mini-millennium/halo_properties.yaml:82-90). Factor 1."
  Posz:
    kind: float
    mimic: Pos
    component: 2
    source: simulation
    sage26_type: float32
    mimic_type: float32
    factor: 1
    unit_check: "Same unit, Mpc/h, the catalogue value copied unconverted. SAGE26 copies halos[halonr].Pos into float Pos[3] [Mpc/h] (src/core_allvars.h:126; src/model_misc.c:108; src/core_build_model.c:257) and writes g->Pos[2] (src/io/save_gals_hdf5.c:888; src/io/save_gals_hdf5_fields.h:54-62, Mpc/h). Mimic Pos is vec3_float, Mpc/h, copy_from_tree_array and copy_direct_array (simulations/mini-millennium/halo_properties.yaml:82-90). Factor 1."
  Velx:
    kind: float
    mimic: Vel
    component: 0
    source: simulation
    sage26_type: float32
    mimic_type: float32
    factor: 1
    unit_check: "Same unit, km/s, the catalogue value copied unconverted. SAGE26 copies halos[halonr].Vel into float Vel[3] [km/s] (src/core_allvars.h:127; src/model_misc.c:109; src/core_build_model.c:258) and writes g->Vel[0] (src/io/save_gals_hdf5.c:890; src/io/save_gals_hdf5_fields.h:63-71, km/s). Mimic Vel is vec3_float, km/s, copy_from_tree_array and copy_direct_array (simulations/mini-millennium/halo_properties.yaml:92-100). Factor 1."
  Vely:
    kind: float
    mimic: Vel
    component: 1
    source: simulation
    sage26_type: float32
    mimic_type: float32
    factor: 1
    unit_check: "Same unit, km/s, the catalogue value copied unconverted. SAGE26 copies halos[halonr].Vel into float Vel[3] [km/s] (src/core_allvars.h:127; src/model_misc.c:109; src/core_build_model.c:258) and writes g->Vel[1] (src/io/save_gals_hdf5.c:891; src/io/save_gals_hdf5_fields.h:63-71, km/s). Mimic Vel is vec3_float, km/s, copy_from_tree_array and copy_direct_array (simulations/mini-millennium/halo_properties.yaml:92-100). Factor 1."
  Velz:
    kind: float
    mimic: Vel
    component: 2
    source: simulation
    sage26_type: float32
    mimic_type: float32
    factor: 1
    unit_check: "Same unit, km/s, the catalogue value copied unconverted. SAGE26 copies halos[halonr].Vel into float Vel[3] [km/s] (src/core_allvars.h:127; src/model_misc.c:109; src/core_build_model.c:258) and writes g->Vel[2] (src/io/save_gals_hdf5.c:892; src/io/save_gals_hdf5_fields.h:63-71, km/s). Mimic Vel is vec3_float, km/s, copy_from_tree_array and copy_direct_array (simulations/mini-millennium/halo_properties.yaml:92-100). Factor 1."
  Spinx:
    kind: float
    mimic: Spin
    component: 0
    source: simulation
    sage26_type: float32
    mimic_type: float32
    factor: 1
    unit_check: "Same quantity, the catalogue specific angular momentum copied unconverted. SAGE26 writes halos[g->HaloNr].Spin[0] (src/io/save_gals_hdf5.c:894) from the halo member float Spin[3] [Mpc/h km/s] (src/core_simulation.h:38); its field-list label 'Mpc * km/s' (src/io/save_gals_hdf5_fields.h:72-80) omits the h of the value it writes. Mimic Spin is vec3_float, Mpc/h km/s, copy_from_tree_array and copy_direct_array (simulations/mini-millennium/halo_properties.yaml:122-135). Factor 1."
  Spiny:
    kind: float
    mimic: Spin
    component: 1
    source: simulation
    sage26_type: float32
    mimic_type: float32
    factor: 1
    unit_check: "Same quantity, the catalogue specific angular momentum copied unconverted. SAGE26 writes halos[g->HaloNr].Spin[1] (src/io/save_gals_hdf5.c:895) from the halo member float Spin[3] [Mpc/h km/s] (src/core_simulation.h:38); its field-list label 'Mpc * km/s' (src/io/save_gals_hdf5_fields.h:72-80) omits the h of the value it writes. Mimic Spin is vec3_float, Mpc/h km/s, copy_from_tree_array and copy_direct_array (simulations/mini-millennium/halo_properties.yaml:122-135). Factor 1."
  Spinz:
    kind: float
    mimic: Spin
    component: 2
    source: simulation
    sage26_type: float32
    mimic_type: float32
    factor: 1
    unit_check: "Same quantity, the catalogue specific angular momentum copied unconverted. SAGE26 writes halos[g->HaloNr].Spin[2] (src/io/save_gals_hdf5.c:896) from the halo member float Spin[3] [Mpc/h km/s] (src/core_simulation.h:38); its field-list label 'Mpc * km/s' (src/io/save_gals_hdf5_fields.h:72-80) omits the h of the value it writes. Mimic Spin is vec3_float, Mpc/h km/s, copy_from_tree_array and copy_direct_array (simulations/mini-millennium/halo_properties.yaml:122-135). Factor 1."
  Len:
    kind: int
    mimic: Len
    source: core
    sage26_type: int32
    mimic_type: int32
    factor: 1
    unit_check: "Same unit, particles. SAGE26 sets g->Len = halos[halonr].Len (src/model_misc.c:112; src/core_build_model.c:261) and writes it unconverted (src/io/save_gals_hdf5.c:898; src/io/save_gals_hdf5_fields.h:81-83). Mimic core Len is particles, copy_from_tree and copy_direct (src/core/core_properties.yaml:116-124), from the catalogue Len (simulations/mini-millennium/halo_properties.yaml:52-56). Factor 1. Orphan Len differs by design (Mimic writes 0 for Type 2, src/core/core_properties.yaml:123-124), which is why Len is compared, not keyed (rule 4)."
  Mvir:
    kind: float
    mimic: Mvir
    source: core
    sage26_type: float32
    mimic_type: float64
    factor: 1
    unit_check: "Same unit, 1e10 Msun/h, the same definition. SAGE26 sets g->Mvir from get_virial_mass (src/model_misc.c:115; src/core_build_model.c:271), the catalogue Mvir for a FoF central with Mvir >= 0 and Len * PartMass otherwise (src/model_halo_properties.c:31-37), written unconverted (src/io/save_gals_hdf5.c:899; src/io/save_gals_hdf5_fields.h:84-86, 1.0e10 Msun/h). Mimic core Mvir is 1e10 Msun/h, copy_direct (src/core/core_properties.yaml:126-134), from get_virial_mass with the same rule (src/core/virial.c:47-54) on the catalogue M_Crit200 (simulations/mini-millennium/halo_properties.yaml:66-73). Factor 1."
  CentralMvir:
    kind: float
    mimic: CentralMvir
    source: core
    sage26_type: float32
    mimic_type: float64
    factor: 1
    unit_check: "Same unit, 1e10 Msun/h, the same definition. SAGE26 writes get_virial_mass(halos[g->HaloNr].FirstHaloInFOFgroup) (src/io/save_gals_hdf5.c:900; src/model_halo_properties.c:31-37; src/io/save_gals_hdf5_fields.h:87-89). Mimic core CentralMvir is 1e10 Msun/h, copy_direct (src/core/core_properties.yaml:151-160), set to get_virial_mass of the source halo's FirstHaloInFOFgroup (src/core/halo_evolution.c:93-97). Factor 1."
  Rvir:
    kind: float
    mimic: Rvir
    source: core
    sage26_type: float32
    mimic_type: float64
    factor: 1
    unit_check: "Same unit, Mpc/h. SAGE26 writes get_virial_radius(g->HaloNr) (src/io/save_gals_hdf5.c:901; src/model_halo_properties.c:63-85; src/io/save_gals_hdf5_fields.h:90-92, Mpc/h), in code length. Mimic core Rvir is Mpc/h (src/core/core_properties.yaml:162-173), written through output_rvir_conditional (src/module_system/output_helpers.h:65-69), which is get_virial_radius (src/core/virial.c:105-112) for Type 0 and 1 and the preserved value for Type 2. Code units are equal on both sides: the reference's Header/Runtime attributes, written at SAGE26 src/io/save_gals_hdf5.c:1351-1353, are UnitLength_in_cm 3.08568e24, UnitMass_in_g 1.989e43 and UnitVelocity_in_cm_per_s 1e5, the reference_units of src/core/core_properties.yaml:10-31. Factor 1."
  Vvir:
    kind: float
    mimic: Vvir
    source: core
    sage26_type: float32
    mimic_type: float64
    factor: 1
    unit_check: "Same unit, km/s. SAGE26 writes get_virial_velocity(g->HaloNr) (src/io/save_gals_hdf5.c:902; src/model_halo_properties.c:40-50, sqrt(G Mvir / Rvir); src/io/save_gals_hdf5_fields.h:93-95, km/s). Mimic core Vvir is km/s (src/core/core_properties.yaml:175-186), written through output_vvir_conditional (src/module_system/output_helpers.h:79-83), which is get_virial_velocity, sqrt(G Mvir / Rvir) (src/core/virial.c:72-82), for Type 0 and 1 and the preserved value for Type 2. Code units are equal on both sides: the reference's Header/Runtime attributes, written at SAGE26 src/io/save_gals_hdf5.c:1351-1353, are UnitLength_in_cm 3.08568e24, UnitMass_in_g 1.989e43 and UnitVelocity_in_cm_per_s 1e5, the reference_units of src/core/core_properties.yaml:10-31. Factor 1."
  Vmax:
    kind: float
    mimic: Vmax
    source: simulation
    sage26_type: float32
    mimic_type: float32
    factor: 1
    unit_check: "Same unit, km/s, the catalogue value copied unconverted. SAGE26 sets g->Vmax = halos[halonr].Vmax (src/model_misc.c:113; src/core_build_model.c:262), float Vmax [km/s] (src/core_allvars.h:133), written unconverted (src/io/save_gals_hdf5.c:903; src/io/save_gals_hdf5_fields.h:96-98). Mimic Vmax is float km/s, copy_from_tree and copy_direct (simulations/mini-millennium/halo_properties.yaml:112-120). Factor 1."
  VelDisp:
