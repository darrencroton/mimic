    notes: Package-private history element; sage26_apply_star_formation_supernova adds stars / dt on every disk star-formation call (src/model_starformation_and_feedback.c:1058). Read by sage26_finalize_sfr_histories through shared/sage_sfr_history.h. Never written to output
    output: false
