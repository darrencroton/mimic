    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created as 0.0 at src/model_misc.c:183; written verbatim at src/io/save_gals_hdf5.c:914. Assigned from eta_reheat only when SupernovaRecipeOn == 1 (default 1, src/core_read_parameter_file.c:94) and FIREmodeOn == 1 (default 1, src/core_read_parameter_file.c:103), at src/model_starformation_and_feedback.c:759-764 and, at the second site, only when fire_scaling_valid is set (src/model_starformation_and_feedback.c:928-932); otherwise it keeps its previous value (0 at creation, or stale). The HDF5 text calls it the ratio of outflow rate to star formation rate. In the package, with FIREmodeOn 1, the run files' value (SAGE26's R3, kept through R6), sage26_calculate_supernova_feedback writes it on the disk path of every row that is not FFBRegime 1, as the capped reheating loading narrowed to float before the cold-gas renormalisation, also when no stars form (src/model_starformation_and_feedback.c:762-764). It writes nothing on a row in the first-snapshot boundary state (SnapNum < 0 and dT <= 0, MIMIC_OBJECT_TIME_SKIP_INITIAL in shared/time_parity.h), where SAGE26 would read ZZ[-1] (src/model_starformation_and_feedback.c:745) and the module returns before the loading, so such a row keeps the value it had. No burst writes it (src/model_mergers.c:707-710), and with FIREmodeOn 0 (R0-R2) it keeps its creation value 0. The second (FFB) site is sage26_ffb_star_formation's, reached only with EnhancedStarFormationOn 1 (SAGE26's default, src/core_read_parameter_file.c:106, and SAGE26's R6, the run files' value) on an FFBRegime 1 row that is outside the same boundary state and has a FoF central. It writes the capped loading narrowed to float, before the renormalisation, only when the FIRE scaling is valid (the row's own Vvir > 0 and the redshift of its stored snapshot >= 0, src/model_starformation_and_feedback.c:917, :929-933); with an invalid scaling it leaves MassLoading as it was (stale), and forms no reheated mass. Inherited, not a snapshot accumulator
    output: true
    init_source: default
    init_value: 0.0

  # -----------------------------------------------------------------------------
  # Bulge structure
  # -----------------------------------------------------------------------------

  - name: BulgeRadius
    type: float
    units: Mpc/h
    description: Effective (half-mass) radius of the bulge, 0 for a galaxy with no bulge mass
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created through get_bulge_radius (src/model_misc.c:173, 239-326). SAGE26's default BulgeSizeOn=3 (src/core_read_parameter_file.c:107) takes the zero path when MergerBulgeMass + InstabilityBulgeMass <= 0 (src/model_misc.c:316-326), not the BulgeMass test of modes 1 and 2 (src/model_misc.c:253,279), and mode 0 zeroes it outright (src/model_misc.c:242-247). At creation those masses are zeroed at src/model_misc.c:123-124 before the :173 call, so the creation value 0 holds in every mode; written verbatim at src/io/save_gals_hdf5.c:972. With BulgeSizeOn 3, the package's run files' value (SAGE26's R1, kept through R6), each get_bulge_radius (shared/sage_bulge_size_physics.h) stores the MergerBulgeMass- and InstabilityBulgeMass-weighted average of the two component radii (src/model_misc.c:317-369), 0 when their sum is not positive. It is called in the FoF central's synchronisation after its disk radius (sage26_set_disk_scale_radius, src/core_build_model.c:297-298), after every instability-radius update (src/model_misc.c:423) and in the merger transaction after the burst and after the remnant assignment (sage26_resolve_mergers_and_disruption, src/model_mergers.c:293-330). With BulgeSizeOn 0 each of those calls zeroes it
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10.0]  # Comparable to virial radius

  - name: MergerBulgeRadius
    type: float
    units: Mpc/h
    description: Half-mass radius of the merger-built (classical) bulge, 0 for a galaxy with no bulge mass
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created through get_bulge_radius (src/model_misc.c:173, 239-326). SAGE26's default BulgeSizeOn=3 (src/core_read_parameter_file.c:107) takes the zero path when MergerBulgeMass + InstabilityBulgeMass <= 0 (src/model_misc.c:316-326), not the BulgeMass test of modes 1 and 2 (src/model_misc.c:253,279), and mode 0 zeroes it outright (src/model_misc.c:242-247). At creation those masses are zeroed at src/model_misc.c:123-124 before the :173 call, so the creation value 0 holds in every mode; written verbatim at src/io/save_gals_hdf5.c:973. With BulgeSizeOn 3, the package's run files' value (SAGE26's R1, kept through R6), get_bulge_radius (shared/sage_bulge_size_physics.h) zeroes it when MergerBulgeMass is exactly 0 and gives a positive MergerBulgeMass with a non-positive radius the Shen et al. (2003) fallback (src/model_misc.c:332-348); a major merger, and a minor merger onto a target that was spheroid-dominated before the addition, store into it the energy-conservation remnant radius of the post-burst target and the satellite (src/model_mergers.c:135-212, :297-330; sage26_resolve_mergers_and_disruption through shared/sage_merger_physics.h), a minor merger onto a disk-dominated target discarding it. With BulgeSizeOn 0 every get_bulge_radius zeroes it
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10.0]  # Comparable to virial radius

  - name: InstabilityBulgeRadius
    type: float
    units: Mpc/h
    description: Half-mass radius of the disk-instability-built (pseudo) bulge, 0 for a galaxy with no bulge mass
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created through get_bulge_radius (src/model_misc.c:173, 239-326). SAGE26's default BulgeSizeOn=3 (src/core_read_parameter_file.c:107) takes the zero path when MergerBulgeMass + InstabilityBulgeMass <= 0 (src/model_misc.c:316-326), not the BulgeMass test of modes 1 and 2 (src/model_misc.c:253,279), and mode 0 zeroes it outright (src/model_misc.c:242-247). At creation those masses are zeroed at src/model_misc.c:123-124 before the :173 call, so the creation value 0 holds in every mode; written verbatim at src/io/save_gals_hdf5.c:974. With BulgeSizeOn 3, the package's run files' value (SAGE26's R1, kept through R6), update_instability_bulge_radius (shared/sage_bulge_size_physics.h) sets it after each transfer into the instability channel to the mass-weighted average of its old value and 0.2 times the disk radius saved before the transfer, or that contribution alone for the first (src/model_misc.c:385-424), in each of the three channels, the disk instability (src/model_disk_instability.c:83), the satellite disk stars of a merger onto a disk-dominated target (src/model_mergers.c:516-522) and the instability-channel burst (src/model_mergers.c:779-784); get_bulge_radius zeroes it when InstabilityBulgeMass is exactly 0 and gives a positive InstabilityBulgeMass with a non-positive radius 0.2 times DiskScaleRadius, or the Shen et al. (2003) fallback when that is not positive (src/model_misc.c:351-363). With BulgeSizeOn 0 every get_bulge_radius zeroes it and the update leaves it as it is (src/model_misc.c:395)
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10.0]  # Comparable to virial radius

  - name: MergerBulgeMass
    type: float
    units: 1e10 Msun/h
    description: Stellar mass of the bulge built through mergers
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created as 0.0 at src/model_misc.c:123; written verbatim at src/io/save_gals_hdf5.c:975. Written only in a merger, in the run files' satellite_mergers phase of a substep, in the order of SAGE26's deal_with_galaxy_merger. First sage26_resolve_mergers_and_disruption's add_galaxies_together (shared/sage_merger_physics.h) adds the satellite's MergerBulgeMass and, when the target's disk fraction after the addition is at most 0.5, the satellite's disk stars (src/model_mergers.c:505, :523-525). Then, inside the merger event that module emits, sage26_starburst_feedback's merger consumer runs the shared burst transaction mimic_apply_collisional_starburst (shared/sage_starburst_physics.h), which adds the burst's double recycled_stars to it when the merger selects the merger channel, a major merger or a minor one onto a target that was spheroid-dominated before the addition (src/model_mergers.c:266-282, :775-777), read from the event's target (MergerDiskDominated). Last, a major merger's make_bulge_from_burst sets it to StellarMass (src/model_mergers.c:557), again in sage26_resolve_mergers_and_disruption through shared/sage_merger_physics.h. A disk-instability burst, the post-merger recheck's included, credits the instability channel and never this one, and a disruption leaves it as it is. With BulgeSizeOn 3 it weights MergerBulgeRadius in BulgeRadius (src/model_misc.c:366)
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= BulgeMass

  - name: InstabilityBulgeMass
    type: float
    units: 1e10 Msun/h
    description: Stellar mass of the bulge built through disk instabilities (the instability channel of BulgeMass)
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created as 0.0 at src/model_misc.c:124; written verbatim at src/io/save_gals_hdf5.c:976. Each disk instability adds its double unstable_stars to it, as to BulgeMass, with no cap (src/model_disk_instability.c:77-78), in every BulgeSizeOn mode, BulgeSizeOn 0 included, which leaves the bulge radii untouched (src/model_misc.c:395). Two package writers do this through the shared instability transaction (shared/sage_disk_instability_physics.h), namely sage26_disk_instability, in the run files' galaxy_physics phase of every substep for each galaxy that is not FFBRegime 1, and the post-minor-merger instability recheck inside the shared burst transaction (SAGE26's check_disk_instability call at src/model_mergers.c:807-809), which also runs on an FFBRegime 1 target. Every instability-channel burst then adds its double recycled_stars to it (src/model_mergers.c:779-781) through the shared burst transaction mimic_apply_collisional_starburst (shared/sage_starburst_physics.h), run by sage26_starburst_feedback; its by-galaxy entry bursts an unstable disk (mode 1, after sage26_quasar_mode's black-hole growth), the recheck's burst follows the recheck, and its merger consumer bursts into this channel for a minor merger onto a target that was disk-dominated before the addition (src/model_mergers.c:266-282). Not reset at the first-occupied update (src/core_build_model.c:273-281), so inherited as SAGE26 does. In a merger, in the run files' satellite_mergers phase of a substep, sage26_resolve_mergers_and_disruption's add_galaxies_together adds the satellite's InstabilityBulgeMass and, when the target's disk fraction after the addition exceeds 0.5, the satellite's disk stars (src/model_mergers.c:504, :516-518), before the burst, and after the burst a major merger's make_bulge_from_burst zeroes it (src/model_mergers.c:558), both through shared/sage_merger_physics.h; a disruption leaves it as it is. With BulgeSizeOn 3 update_instability_bulge_radius (src/model_misc.c:385-424) follows the disk instability's transfer (src/model_disk_instability.c:83), the satellite's disk stars on a disk-dominated target (src/model_mergers.c:516-522) and the instability-channel burst (src/model_mergers.c:779-784), but not the addition of the satellite's own InstabilityBulgeMass (src/model_mergers.c:504), which raises the mass without updating InstabilityBulgeRadius (a later get_bulge_radius changes that radius only by its zero-mass and fallback rules, src/model_misc.c:335-363); it weights InstabilityBulgeRadius in BulgeRadius (src/model_misc.c:366)
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= BulgeMass

  # -----------------------------------------------------------------------------
  # Intracluster stars (ICS) assembly
  # -----------------------------------------------------------------------------

  - name: ICS_disrupt
    type: float
    units: 1e10 Msun/h
    description: In-situ ICS, the cumulative satellite stellar mass stripped directly into this halo's ICS reservoir
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). It is the channel of last transfer, not of origin. Created as 0.0 at src/model_misc.c:162; written verbatim at src/io/save_gals_hdf5.c:1000. SAGE26 states ICS_disrupt + ICS_accrete == ICS as an invariant of the struct (src/core_allvars.h:175-176) and, in its HDF5 text, as holding by construction (src/io/save_gals_hdf5_fields.h:250). sage26_resolve_mergers_and_disruption writes it in the run files' satellite_mergers phase of a substep through shared/sage_merger_physics.h; a disruption adds the satellite's stellar mass to the target's when that mass is positive (disrupt_satellite_to_ICS, src/model_mergers.c:869-870) and zeroes the satellite's (:896), and a merger zeroes the satellite's (add_galaxies_together, :492). sage26_prepare_infall_budget, once per FoF group in pre_timestep, zeroes the ICS_disrupt of a satellite that carries ICS, whose ICS it books to the central's ICS_accrete (src/model_infall.c:96-107)
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= ICS

  - name: ICS_accrete
    type: float
    units: 1e10 Msun/h
    description: Ex-situ ICS, the cumulative already-formed ICS brought into this halo by infalling or merging satellites
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). It is the channel of last transfer, not of origin. Created as 0.0 at src/model_misc.c:163; written verbatim at src/io/save_gals_hdf5.c:1001. SAGE26 states ICS_disrupt + ICS_accrete == ICS as an invariant of the struct (src/core_allvars.h:175-176) and, in its HDF5 text, as holding by construction (src/io/save_gals_hdf5_fields.h:250). sage26_prepare_infall_budget writes it once per FoF group in pre_timestep, as SAGE26's infall_recipe does every snapshot; a satellite that carries ICS adds that ICS to the FoF central's ICS_accrete and has its own ICS_disrupt, ICS_accrete and ICS_sum_mt zeroed (src/model_infall.c:96-107), so ICS a progenitor group built in situ is re-booked as accreted once it falls in. sage26_resolve_mergers_and_disruption writes it in the run files' satellite_mergers phase of a substep through shared/sage_merger_physics.h; a merger adds a positive satellite ICS to the target's (add_galaxies_together, src/model_mergers.c:479-480), a disruption does the same (disrupt_satellite_to_ICS, :881-882), and each zeroes the satellite's (:492, :896)
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= ICS

  - name: ICS_sum_mt
    type: float
    units: Internal
    description: Mass-weighted sum of m*t at ICS deposition, in 1e10 Msun/h times code time; divide by ICS_disrupt + ICS_accrete for the mean assembly lookback
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created as 0.0 at src/model_misc.c:164; written verbatim at src/io/save_gals_hdf5.c:1002; HDF5 label is 1.0e10 Msun/h * code_time. Unit is Internal because the registry has no mass-times-time label. Written with the two channels. sage26_prepare_infall_budget, once per FoF group in pre_timestep, adds a satellite's ICS_sum_mt to the FoF central's when the satellite carries ICS and zeroes the satellite's (src/model_infall.c:103, :107). In the run files' satellite_mergers phase of a substep sage26_resolve_mergers_and_disruption, through shared/sage_merger_physics.h, adds the satellite's ICS_sum_mt to the target's when the satellite's ICS is positive, in a merger (src/model_mergers.c:479, :484) and in a disruption (:881, :886); a disruption also adds the satellite's positive stellar mass times the event time, a lookback time in code units (src/core_build_model.c:549), as one fused multiply-add written as fma() (src/model_mergers.c:871); each zeroes the satellite's (src/model_mergers.c:492, :897)
    output: true
    init_source: default
    init_value: 0.0

  # -----------------------------------------------------------------------------
  # Satellite infall history
  # -----------------------------------------------------------------------------

  - name: infallStellarMass
    type: float
    units: 1e10 Msun/h
    description: Stellar mass of the galaxy when it became a satellite; SAGE26 writes 0 for centrals (Type 0)
    notes: The written value of SAGE26's float member infallStellarMass (src/core_allvars.h:201). SAGE26's writer stores the member for Type != 0 and 0.0 for Type 0 (src/io/save_gals_hdf5.c:1004-1017) while the member itself keeps its value. The package keeps the member in infallStellarMassState and sage26_record_transition_state, the last post_timestep module, sets this output from it for every galaxy row - 0.0 for Type 0, the state otherwise. The creation value -1 (src/model_misc.c:192) remains only on a row that module has not processed.
    output: true
    init_source: default
    init_value: -1.0
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [-1.0]  # -1.0 = never a satellite

  - name: TimeOfInfall
    type: float
    units: index
    description: Snapshot number at which the galaxy last became a satellite (not a time); -1 = never; SAGE26 writes 0 for centrals (Type 0)
    notes: The written value of SAGE26's float member TimeOfInfall (src/core_allvars.h:202), a snapshot number stored as float (src/core_build_model.c:311). SAGE26's HDF5 label says Myr and the text says a time, but the writer stores the member unconverted (src/io/save_gals_hdf5.c:1010), so it holds a snapshot number. The writer stores the member for Type != 0 and 0.0 for Type 0 (src/io/save_gals_hdf5.c:1004-1017) while the member itself keeps its value. The package keeps the member in TimeOfInfallState and sage26_record_transition_state, the last post_timestep module, sets this output from it for every galaxy row - 0.0 for Type 0, the state otherwise. The creation value -1 (src/model_misc.c:193) remains only on a row that module has not processed.
    output: true
    init_source: default
    init_value: -1.0
    sentinels: [-1.0]  # -1.0 = never a satellite

  # -----------------------------------------------------------------------------
  # Halo structure
  # -----------------------------------------------------------------------------

  - name: Concentration
    type: float
    units: dimensionless
    description: NFW halo concentration, set at joining for a new FoF central that was a Type 0 or 1, by SAGE26's Vmax/Vvir inversion (ConcentrationOn 3, R5; a former satellite's infall pair), 0 if (Vmax/Vvir)^2 < 1; 0 throughout with ConcentrationOn 0 (R0-R4)
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:134). Created as 0.0 at src/model_misc.c:93 and assigned (float)get_halo_concentration(...) only when ConcentrationOn > 0, and only at src/core_build_model.c:290-294, inside the FoF-central branch (halonr == FirstHaloInFOFgroup, :284) of a galaxy that was a Type 0 or 1 (:240), before Type is set to 0 at :300; a galaxy created by init_galaxy (:347-351) keeps 0 at its birth snapshot. In the package sage26_set_halo_concentration makes that write in pre_timestep for each row whose new Type is 0 and whose PreviousType is 0 or 1, with the core's Vmax, Vvir, infallVmax and infallVvir narrowed to SAGE26's floats (shared/sage_halo_concentration.h). Satellites (Type 1 or 2) therefore never recompute it and keep the value from their last central snapshot, and the Type != 0 branch of get_halo_concentration (src/model_halo_properties.c:339-350, using infallVmax/infallVvir) fires only for a former satellite at the snapshot it becomes a FoF central again, using its stale infall values. Written verbatim at src/io/save_gals_hdf5.c:871. The package supports ConcentrationOn 0 (no call; SAGE26's R0-R4) and 3 (SAGE26's R5 and R6, the run files' value; SAGE26's default, src/core_read_parameter_file.c:105, as input/millennium.par:57 sets it); modes 1 (the Ishiyama+21 lookup table in Mvir and redshift) and 2 (Vmax/Vvir for all galaxy types) are not ported and are refused. Mode 3 inverts the Vmax/Vvir pair through the NFW relation (Vmax/Vvir)^2 = 0.21621 c / mu(c), mu(c) = ln(1+c) - c/(1+c), by exactly 60 bisection steps on c in [1, 200] with the strict test f_mid < ratio_sq, giving 0 when a velocity is not positive or (Vmax/Vvir)^2 < 1, and saturating at 200 for a ratio beyond f(200) (concentration_from_vmax_vvir, src/model_halo_properties.c:288-318). 0.21621 c / mu(c) is not monotonic on [1, about 2.16] (about 1.119 at c = 1, a minimum of about 0.99997 near 2.1626), although the source comment says it is monotonic. The bisection therefore returns exactly 1.0 for (Vmax/Vvir)^2 from 1 up to f(2.5546875), about 1.00503, and 2.5546875 or more above it, and no concentration strictly between 1 and 2.5546875 is produced. SAGE26's HDF5 text says NFW halo concentration parameter from Ishiyama+21 c-M relation (src/io/save_gals_hdf5_fields.h:237-238), which describes mode 1 only
    output: true
    init_source: default
    init_value: 0.0
