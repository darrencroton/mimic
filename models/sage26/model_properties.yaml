  - name: MassLoading
    type: float
    units: dimensionless
    description: Supernova mass-loading factor eta, the ratio of reheated gas mass to stars formed in the current star formation episode
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created as 0.0 at src/model_misc.c:183; written verbatim at src/io/save_gals_hdf5.c:914. Assigned from eta_reheat only when SupernovaRecipeOn == 1 (default 1, src/core_read_parameter_file.c:94) and FIREmodeOn == 1 (default 1, src/core_read_parameter_file.c:103), at src/model_starformation_and_feedback.c:759-764 and, at the second site, only when fire_scaling_valid is set (src/model_starformation_and_feedback.c:928-932); otherwise it keeps its previous value (0 at creation, or stale). The HDF5 text calls it the ratio of outflow rate to star formation rate. In the package, sage26_calculate_supernova_feedback writes it on the disk path with FIREmodeOn 1, the run files' value (SAGE26's R3), as the capped reheating loading narrowed to float before the cold-gas renormalisation, also when no stars form (src/model_starformation_and_feedback.c:762-764); no burst writes it (src/model_mergers.c:707-710), and with FIREmodeOn 0 (R0-R2) it keeps its creation value 0. The second (FFB) site is unreachable on R3 (EnhancedStarFormationOn 0) and not ported. Inherited, not a snapshot accumulator.
    output: true
    init_source: default
    init_value: 0.0

  # -----------------------------------------------------------------------------
  # Bulge structure
  # -----------------------------------------------------------------------------

  - name: BulgeRadius
    type: float
    units: Mpc/h
    description: Effective (half-mass) radius of the bulge, 0 for a galaxy with no bulge mass
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created through get_bulge_radius (src/model_misc.c:173, 239-326). SAGE26's default BulgeSizeOn=3 (src/core_read_parameter_file.c:107) takes the zero path when MergerBulgeMass + InstabilityBulgeMass <= 0 (src/model_misc.c:316-326), not the BulgeMass test of modes 1 and 2 (src/model_misc.c:253,279), and mode 0 zeroes it outright (src/model_misc.c:242-247). At creation those masses are zeroed at src/model_misc.c:123-124 before the :173 call, so the creation value 0 holds in every mode; written verbatim at src/io/save_gals_hdf5.c:972. With BulgeSizeOn 3, the package's run files' value (SAGE26's R1, R1.par:109), each get_bulge_radius (shared/sage_bulge_size_physics.h) stores the MergerBulgeMass- and InstabilityBulgeMass-weighted average of the two component radii (src/model_misc.c:317-369), 0 when their sum is not positive. It is called in the FoF central's synchronisation after its disk radius (sage26_set_disk_scale_radius, src/core_build_model.c:297-298), after every instability-radius update (src/model_misc.c:423) and in the merger transaction after the burst and after the remnant assignment (sage26_resolve_mergers_and_disruption, src/model_mergers.c:293-330). With BulgeSizeOn 0 each of those calls zeroes it.
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10.0]  # Comparable to virial radius

  - name: MergerBulgeRadius
    type: float
    units: Mpc/h
    description: Half-mass radius of the merger-built (classical) bulge, 0 for a galaxy with no bulge mass
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created through get_bulge_radius (src/model_misc.c:173, 239-326). SAGE26's default BulgeSizeOn=3 (src/core_read_parameter_file.c:107) takes the zero path when MergerBulgeMass + InstabilityBulgeMass <= 0 (src/model_misc.c:316-326), not the BulgeMass test of modes 1 and 2 (src/model_misc.c:253,279), and mode 0 zeroes it outright (src/model_misc.c:242-247). At creation those masses are zeroed at src/model_misc.c:123-124 before the :173 call, so the creation value 0 holds in every mode; written verbatim at src/io/save_gals_hdf5.c:973. With BulgeSizeOn 3, the package's run files' value (SAGE26's R1, R1.par:109), get_bulge_radius (shared/sage_bulge_size_physics.h) zeroes it when MergerBulgeMass is exactly 0 and gives a positive MergerBulgeMass with a non-positive radius the Shen et al. (2003) fallback (src/model_misc.c:332-348); a major merger, and a minor merger onto a target that was spheroid-dominated before the addition, store into it the energy-conservation remnant radius of the post-burst target and the satellite (src/model_mergers.c:135-212, :297-330; sage26_resolve_mergers_and_disruption through shared/sage_merger_physics.h), a minor merger onto a disk-dominated target discarding it. With BulgeSizeOn 0 every get_bulge_radius zeroes it.
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10.0]  # Comparable to virial radius

  - name: InstabilityBulgeRadius
    type: float
    units: Mpc/h
    description: Half-mass radius of the disk-instability-built (pseudo) bulge, 0 for a galaxy with no bulge mass
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created through get_bulge_radius (src/model_misc.c:173, 239-326). SAGE26's default BulgeSizeOn=3 (src/core_read_parameter_file.c:107) takes the zero path when MergerBulgeMass + InstabilityBulgeMass <= 0 (src/model_misc.c:316-326), not the BulgeMass test of modes 1 and 2 (src/model_misc.c:253,279), and mode 0 zeroes it outright (src/model_misc.c:242-247). At creation those masses are zeroed at src/model_misc.c:123-124 before the :173 call, so the creation value 0 holds in every mode; written verbatim at src/io/save_gals_hdf5.c:974. With BulgeSizeOn 3, the package's run files' value (SAGE26's R1, R1.par:109), update_instability_bulge_radius (shared/sage_bulge_size_physics.h) sets it after each transfer into the instability channel to the mass-weighted average of its old value and 0.2 times the disk radius saved before the transfer, or that contribution alone for the first (src/model_misc.c:385-424), in each of the three channels, the disk instability (src/model_disk_instability.c:83), the satellite disk stars of a merger onto a disk-dominated target (src/model_mergers.c:516-522) and the instability-channel burst (src/model_mergers.c:779-784); get_bulge_radius zeroes it when InstabilityBulgeMass is exactly 0 and gives a positive InstabilityBulgeMass with a non-positive radius 0.2 times DiskScaleRadius, or the Shen et al. (2003) fallback when that is not positive (src/model_misc.c:351-363). With BulgeSizeOn 0 every get_bulge_radius zeroes it and the update leaves it as it is (src/model_misc.c:395).
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10.0]  # Comparable to virial radius

  - name: MergerBulgeMass
    type: float
    units: 1e10 Msun/h
    description: Stellar mass of the bulge built through mergers
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created as 0.0 at src/model_misc.c:123; written verbatim at src/io/save_gals_hdf5.c:975. A merger burst adds its double recycled_stars to it when the merger selects the merger channel, a major merger or a minor one onto a target that was spheroid-dominated before the addition (src/model_mergers.c:266-282, :775-777), through the shared burst transaction mimic_apply_collisional_starburst (sage26_starburst_feedback), which reads that pre-transfer choice from the merger event's target (MergerDiskDominated). In a merger add_galaxies_together adds the satellite's MergerBulgeMass and, when the target's disk fraction after the addition is at most 0.5, the satellite's disk stars (src/model_mergers.c:505, :523-525), and a major merger's make_bulge_from_burst sets it to StellarMass (src/model_mergers.c:557), both through shared/sage_merger_physics.h (sage26_resolve_mergers_and_disruption). With BulgeSizeOn 3 it weights MergerBulgeRadius in BulgeRadius (src/model_misc.c:366).
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= BulgeMass

  - name: InstabilityBulgeMass
    type: float
    units: 1e10 Msun/h
    description: Stellar mass of the bulge built through disk instabilities (the instability channel of BulgeMass)
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created as 0.0 at src/model_misc.c:124; written verbatim at src/io/save_gals_hdf5.c:976. On R0 each disk instability adds its double unstable_stars to it, as to BulgeMass, with no cap (src/model_disk_instability.c:77-78), even though BulgeSizeOn 0 leaves the bulge radii untouched (src/model_misc.c:395). Two package writers do this through the shared helper mimic_sage_check_disk_instability, namely sage26_disk_instability on every disk star-formation substep and the burst transaction's post-minor-merger instability recheck (SAGE26's check_disk_instability call at src/model_mergers.c:807-809). Every instability burst (mode 1) then adds its double recycled_stars to it (src/model_mergers.c:779-781) through the shared burst transaction mimic_apply_collisional_starburst (sage26_starburst_feedback). Not reset at the first-occupied update (src/core_build_model.c:273-281), so inherited as SAGE26 does. In a merger add_galaxies_together adds the satellite's InstabilityBulgeMass and, when the target's disk fraction after the addition exceeds 0.5, the satellite's disk stars (src/model_mergers.c:504, :516-518), and a major merger's make_bulge_from_burst zeroes it (src/model_mergers.c:558), both through shared/sage_merger_physics.h (sage26_resolve_mergers_and_disruption). With BulgeSizeOn 3 update_instability_bulge_radius (src/model_misc.c:385-424) follows the disk instability's transfer (src/model_disk_instability.c:83), the satellite's disk stars on a disk-dominated target (src/model_mergers.c:516-522) and the instability-channel burst (src/model_mergers.c:779-784), but not the addition of the satellite's own InstabilityBulgeMass (src/model_mergers.c:504), which raises the mass without updating InstabilityBulgeRadius (a later get_bulge_radius changes that radius only by its zero-mass and fallback rules, src/model_misc.c:335-363); it weights InstabilityBulgeRadius in BulgeRadius (src/model_misc.c:366).
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= BulgeMass

  # -----------------------------------------------------------------------------
  # Intracluster stars (ICS) assembly
  # -----------------------------------------------------------------------------

  - name: ICS_disrupt
    type: float
    units: 1e10 Msun/h
    description: In-situ ICS, the cumulative satellite stellar mass stripped directly into this halo's ICS reservoir
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). It is the channel of last transfer, not of origin. Created as 0.0 at src/model_misc.c:162; written verbatim at src/io/save_gals_hdf5.c:1000. ICS_disrupt + ICS_accrete equals ICS in SAGE26 by construction. Scaffold, holds 0 until a physics node fills it.
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= ICS

  - name: ICS_accrete
    type: float
    units: 1e10 Msun/h
    description: Ex-situ ICS, the cumulative already-formed ICS brought into this halo by infalling or merging satellites
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). It is the channel of last transfer, not of origin. Created as 0.0 at src/model_misc.c:163; written verbatim at src/io/save_gals_hdf5.c:1001. ICS_disrupt + ICS_accrete equals ICS in SAGE26 by construction. Scaffold, holds 0 until a physics node fills it.
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= ICS

  - name: ICS_sum_mt
    type: float
    units: Internal
    description: Mass-weighted sum of m*t at ICS deposition, in 1e10 Msun/h times code time; divide by ICS_disrupt + ICS_accrete for the mean assembly lookback
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created as 0.0 at src/model_misc.c:164; written verbatim at src/io/save_gals_hdf5.c:1002; HDF5 label is 1.0e10 Msun/h * code_time. Unit is Internal because the registry has no mass-times-time label. Scaffold, holds 0 until a physics node fills it.
    output: true
    init_source: default
    init_value: 0.0

  # -----------------------------------------------------------------------------
  # Satellite infall history
  # -----------------------------------------------------------------------------

  - name: infallStellarMass
    type: float
    units: 1e10 Msun/h
    description: Stellar mass of the galaxy when it became a satellite; SAGE26 writes 0 for centrals (Type 0)
    notes: The written value of SAGE26's float member infallStellarMass (src/core_allvars.h:201). SAGE26's writer stores the member for Type != 0 and 0.0 for Type 0 (src/io/save_gals_hdf5.c:1004-1017) while the member itself keeps its value. The package keeps the member in infallStellarMassState and sage26_record_transition_state, the last post_timestep module, sets this output from it for every galaxy row - 0.0 for Type 0, the state otherwise. The creation value -1 (src/model_misc.c:192) remains only on a row that module has not processed.
    output: true
    init_source: default
    init_value: -1.0
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [-1.0]  # -1.0 = never a satellite

  - name: TimeOfInfall
    type: float
    units: index
    description: Snapshot number at which the galaxy last became a satellite (not a time); -1 = never; SAGE26 writes 0 for centrals (Type 0)
    notes: The written value of SAGE26's float member TimeOfInfall (src/core_allvars.h:202), a snapshot number stored as float (src/core_build_model.c:311). SAGE26's HDF5 label says Myr and the text says a time, but the writer stores the member unconverted (src/io/save_gals_hdf5.c:1010), so it holds a snapshot number. The writer stores the member for Type != 0 and 0.0 for Type 0 (src/io/save_gals_hdf5.c:1004-1017) while the member itself keeps its value. The package keeps the member in TimeOfInfallState and sage26_record_transition_state, the last post_timestep module, sets this output from it for every galaxy row - 0.0 for Type 0, the state otherwise. The creation value -1 (src/model_misc.c:193) remains only on a row that module has not processed.
    output: true
    init_source: default
    init_value: -1.0
    sentinels: [-1.0]  # -1.0 = never a satellite

  # -----------------------------------------------------------------------------
  # Halo structure
  # -----------------------------------------------------------------------------

  - name: Concentration
    type: float
    units: dimensionless
    description: NFW halo concentration. Default path (ConcentrationOn=3) inverts the NFW Vmax/Vvir relation, computed only while the galaxy is a FoF central (satellites keep the last value), 0 if Vmax/Vvir < 1. SAGE26's HDF5 text says Ishiyama+21 (mode 1 only)
    notes: SAGE26 scalar float member of struct GALAXY (src/core_allvars.h:106-221). Created as 0.0 at src/model_misc.c:93 and assigned from get_halo_concentration only when ConcentrationOn > 0, and only at src/core_build_model.c:290-294, inside the FoF-central branch (halonr == FirstHaloInFOFgroup, :283) and before Type is set to 0 at :300. Satellites (Type 1 or 2) therefore never recompute it and keep the value from their last central snapshot, which equals the infall-frozen Vmax/Vvir ratio, and the Type != 0 branch of get_halo_concentration (src/model_halo_properties.c:339-350, using infallVmax/infallVvir) fires only for a former satellite at the snapshot it becomes a FoF central again, using its stale infall values. Written verbatim at src/io/save_gals_hdf5.c:871. The value depends on ConcentrationOn (src/model_halo_properties.c:327-352). SAGE26 defaults it to 3 (src/core_read_parameter_file.c:105, input/millennium.par:57), where the Vmax/Vvir pair is inverted through the NFW relation (Vmax/Vvir)^2 = 0.2162 c / mu(c) by bisection with c in [1, 200], giving 0 when Vmax/Vvir < 1 (concentration_from_vmax_vvir, src/model_halo_properties.c:288-306). Mode 0 gives 0, mode 1 uses the Ishiyama+21 lookup table in Mvir and redshift, mode 2 uses Vmax/Vvir for all galaxy types. SAGE26's HDF5 text says NFW halo concentration parameter from Ishiyama+21 c-M relation (src/io/save_gals_hdf5_fields.h:237-238), which describes mode 1 only, not the default path. Scaffold, holds 0 until a physics node fills it.
    output: true
    init_source: default
    init_value: 0.0
