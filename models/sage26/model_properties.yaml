    units: dimensionless
    description: Supernova mass-loading factor eta, the ratio of reheated gas mass to stars formed in the current star formation episode
    notes: With FIREmodeOn 1 (the run files' value) sage26_calculate_supernova_feedback writes the capped reheating loading, before the cold-gas renormalisation, on the disk path of every row that is not FFBRegime 1, also when no stars form; with EnhancedStarFormationOn 1 sage26_ffb_star_formation writes it on an FFBRegime 1 row with a FoF central only when the FIRE scaling is valid (Vvir > 0 and a non-negative redshift), and otherwise leaves it stale. Neither writes a row in the first-snapshot boundary state (SnapNum < 0 and dT <= 0, shared/time_parity.h), no burst writes it, and with FIREmodeOn 0 it keeps its creation value 0. Inherited, not a snapshot accumulator
    output: true
    init_source: default
    init_value: 0.0

  # -----------------------------------------------------------------------------
  # Bulge structure
  # -----------------------------------------------------------------------------

  - name: BulgeRadius
    type: float
    units: Mpc/h
    description: Effective (half-mass) radius of the bulge, 0 for a galaxy with no bulge mass
    notes: With BulgeSizeOn 3 (SAGE26's default and the run files' value) each get_bulge_radius (shared/sage_bulge_size_physics.h) stores the MergerBulgeMass- and InstabilityBulgeMass-weighted average of the two component radii, 0 when their sum is not positive. It is called in the FoF central's synchronisation after sage26_set_disk_scale_radius, after every instability-radius update, and in sage26_resolve_mergers_and_disruption's merger transaction after the burst and after the remnant assignment. With BulgeSizeOn 0 each of those calls zeroes it
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10.0]  # Comparable to virial radius

  - name: MergerBulgeRadius
    type: float
    units: Mpc/h
    description: Half-mass radius of the merger-built (classical) bulge, 0 for a galaxy with no bulge mass
    notes: With BulgeSizeOn 3 (SAGE26's default and the run files' value) a major merger, and a minor merger onto a target that was spheroid-dominated before the addition, store the energy-conservation remnant radius of the post-burst target and the satellite (sage26_resolve_mergers_and_disruption through shared/sage_merger_physics.h). get_bulge_radius (shared/sage_bulge_size_physics.h) zeroes it when MergerBulgeMass is exactly 0 and gives a positive MergerBulgeMass with a non-positive radius the Shen et al. (2003) fallback. With BulgeSizeOn 0 every get_bulge_radius zeroes it
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10.0]  # Comparable to virial radius

  - name: InstabilityBulgeRadius
    type: float
    units: Mpc/h
    description: Half-mass radius of the disk-instability-built (pseudo) bulge, 0 for a galaxy with no bulge mass
    notes: With BulgeSizeOn 3 (SAGE26's default and the run files' value) update_instability_bulge_radius (shared/sage_bulge_size_physics.h) sets it after each transfer into the instability channel (a disk instability, the satellite disk stars of a merger onto a disk-dominated target, an instability-channel burst) to the mass-weighted average of its old value and 0.2 times the disk radius saved before the transfer. get_bulge_radius zeroes it when InstabilityBulgeMass is exactly 0 and gives a positive InstabilityBulgeMass with a non-positive radius 0.2 times DiskScaleRadius, or the Shen et al. (2003) fallback when that is not positive. With BulgeSizeOn 0 every get_bulge_radius zeroes it and the update leaves it as it is
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10.0]  # Comparable to virial radius

  - name: MergerBulgeMass
    type: float
    units: 1e10 Msun/h
    description: Stellar mass of the bulge built through mergers
    notes: Written only in a merger, in the satellite_mergers phase, in the order of SAGE26's deal_with_galaxy_merger - sage26_resolve_mergers_and_disruption adds the satellite's MergerBulgeMass and, when the target's disk fraction after the addition is at most 0.5, the satellite's disk stars; sage26_starburst_feedback's merger consumer adds the burst's recycled stars when the merger selects the merger channel (a major merger, or a minor one onto a target that was spheroid-dominated before the addition, read from MergerDiskDominated); and a major merger then sets it to StellarMass. Disk-instability bursts and disruptions leave it unchanged. With BulgeSizeOn 3 it weights MergerBulgeRadius in BulgeRadius
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= BulgeMass

  - name: InstabilityBulgeMass
    type: float
    units: 1e10 Msun/h
    description: Stellar mass of the bulge built through disk instabilities (the instability channel of BulgeMass)
    notes: Each disk instability adds its unstable stars, uncapped and in every BulgeSizeOn mode, through the shared instability transaction (shared/sage_disk_instability_physics.h), run by sage26_disk_instability for every galaxy that is not FFBRegime 1 and by the post-minor-merger recheck inside the burst transaction; every instability-channel burst of sage26_starburst_feedback (an unstable disk, the recheck, or a minor merger onto a disk-dominated target) adds its recycled stars. In a merger sage26_resolve_mergers_and_disruption adds the satellite's InstabilityBulgeMass and, when the target's disk fraction after the addition exceeds 0.5, the satellite's disk stars, and a major merger zeroes it after the burst; disruptions leave it unchanged and it is inherited between snapshots. With BulgeSizeOn 3 it weights InstabilityBulgeRadius in BulgeRadius, though adding the satellite's own InstabilityBulgeMass raises the mass without updating that radius
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= BulgeMass

  # -----------------------------------------------------------------------------
  # Intracluster stars (ICS) assembly
  # -----------------------------------------------------------------------------

  - name: ICS_disrupt
    type: float
    units: 1e10 Msun/h
    description: In-situ ICS, the cumulative satellite stellar mass stripped directly into this halo's ICS reservoir
    notes: The channel of last transfer, not of origin; SAGE26 states ICS_disrupt + ICS_accrete == ICS as an invariant. In the satellite_mergers phase sage26_resolve_mergers_and_disruption (through shared/sage_merger_physics.h) adds a disrupted satellite's positive stellar mass to the target's, and a disruption or merger zeroes the satellite's. Once per FoF group in pre_timestep sage26_prepare_infall_budget zeroes the ICS_disrupt of a satellite that carries ICS, booking that ICS to the central's ICS_accrete
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= ICS

  - name: ICS_accrete
    type: float
    units: 1e10 Msun/h
    description: Ex-situ ICS, the cumulative already-formed ICS brought into this halo by infalling or merging satellites
    notes: The channel of last transfer, not of origin; SAGE26 states ICS_disrupt + ICS_accrete == ICS as an invariant. Once per FoF group in pre_timestep sage26_prepare_infall_budget adds each ICS-carrying satellite's ICS to the central's ICS_accrete and zeroes that satellite's ICS_disrupt, ICS_accrete and ICS_sum_mt, so ICS a progenitor group built in situ is re-booked as accreted once it falls in. In the satellite_mergers phase sage26_resolve_mergers_and_disruption (through shared/sage_merger_physics.h) adds a positive satellite ICS to the target's in a merger or disruption and zeroes the satellite's
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= ICS

  - name: ICS_sum_mt
    type: float
    units: Internal
    description: Mass-weighted sum of m*t at ICS deposition, in 1e10 Msun/h times code time; divide by ICS_disrupt + ICS_accrete for the mean assembly lookback
    notes: Unit is Internal because the registry has no mass-times-time label. Once per FoF group in pre_timestep sage26_prepare_infall_budget moves an ICS-carrying satellite's ICS_sum_mt to the FoF central. In the satellite_mergers phase sage26_resolve_mergers_and_disruption (through shared/sage_merger_physics.h) moves the satellite's ICS_sum_mt to the target when the satellite's ICS is positive, in a merger or disruption, and a disruption also adds the satellite's positive stellar mass times the event's lookback time in code units
    output: true
    init_source: default
    init_value: 0.0

  # -----------------------------------------------------------------------------
  # Satellite infall history
  # -----------------------------------------------------------------------------

  - name: infallStellarMass
    type: float
    units: 1e10 Msun/h
    description: Stellar mass of the galaxy when it became a satellite; SAGE26 writes 0 for centrals (Type 0)
    notes: Output form of infallStellarMassState - sage26_record_transition_state, the last post_timestep module, writes 0.0 for Type 0 rows and the state otherwise, as SAGE26's writer does. The creation value -1 remains only on a row that module has not processed.
    output: true
    init_source: default
    init_value: -1.0
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [-1.0]  # -1.0 = never a satellite

  - name: TimeOfInfall
    type: float
    units: index
    description: Snapshot number at which the galaxy last became a satellite (not a time); -1 = never; SAGE26 writes 0 for centrals (Type 0)
    notes: Output form of TimeOfInfallState, a snapshot number stored as float although SAGE26's HDF5 label says Myr. sage26_record_transition_state, the last post_timestep module, writes 0.0 for Type 0 rows and the state otherwise, as SAGE26's writer does; the creation value -1 remains only on a row that module has not processed.
    output: true
    init_source: default
    init_value: -1.0
    sentinels: [-1.0]  # -1.0 = never a satellite

  # -----------------------------------------------------------------------------
  # Halo structure
  # -----------------------------------------------------------------------------

  - name: Concentration
    type: float
    units: dimensionless
    description: NFW halo concentration, set at joining for a new FoF central that was a Type 0 or 1 by SAGE26's Vmax/Vvir inversion (ConcentrationOn 3; a former satellite's infall pair), 0 if (Vmax/Vvir)^2 < 1; 0 throughout with ConcentrationOn 0
    notes: With ConcentrationOn 3 (SAGE26's default and the run files' value) sage26_set_halo_concentration writes it in pre_timestep for each row whose new Type is 0 and whose PreviousType is 0 or 1, from Vmax and Vvir (for a former satellite, its stale infallVmax and infallVvir) narrowed to float (shared/sage_halo_concentration.h); satellites keep the value from their last central snapshot, a new galaxy keeps 0, and ConcentrationOn 0 writes nothing. Mode 3 inverts (Vmax/Vvir)^2 = 0.21621 c / mu(c) by 60 bisection steps on c in [1, 200], giving 0 when a velocity is not positive or the ratio is below 1 and saturating at 200; because the relation is not monotonic near c = 2, no concentration strictly between 1 and 2.5546875 is produced. Modes 1 (the Ishiyama et al. 2021 table) and 2 are not supported; refused at initialisation
    output: true
    init_source: default
    init_value: 0.0
