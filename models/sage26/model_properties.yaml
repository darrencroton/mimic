    units: Internal
    description: SAGE26 SfrDisk[2], the disk star formation rate stars / dt summed over the substeps mapped to this bin, in 1e10 Msun/h per code time
    notes: Package-private history element; sage26_apply_star_formation_supernova adds stars / dt on every disk star-formation call (src/model_starformation_and_feedback.c:1058). Read by sage26_finalize_sfr_histories through shared/sage_sfr_history.h. Never written to output
    output: false
    init_source: default
    init_value: 0.0

  - name: SfrDiskBin3
    type: float  # SAGE parity: element 3 of SAGE26's float SfrDisk[STEPS] (src/core_allvars.h:158)
    units: Internal
    description: SAGE26 SfrDisk[3], the disk star formation rate stars / dt summed over the substeps mapped to this bin, in 1e10 Msun/h per code time
    notes: Package-private history element; sage26_apply_star_formation_supernova adds stars / dt on every disk star-formation call (src/model_starformation_and_feedback.c:1058). Read by sage26_finalize_sfr_histories through shared/sage_sfr_history.h. Never written to output
    output: false
