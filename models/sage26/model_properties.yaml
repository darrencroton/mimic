# Mimic Galaxy Properties Metadata
#
# This file defines galaxy baryonic physics properties used in Mimic.
# These properties are created and modified by physics modules.
#
# Reservoir fields (HotGas, ColdGas, EjectedGas, StellarMass, Metals*,
# BlackHoleMass, BulgeMass, ICS) are `float` only for bit-for-bit parity with
# SAGE26's struct GALAXY (see docs/DEVELOPER-GUIDE.md#property-precision). New
# models without that constraint should prefer `double`.
#
# See: docs/DEVELOPER-GUIDE.md for complete schema documentation

galaxy_properties:

  # =============================================================================
  # FUNDAMENTAL PROPERTIES
  # =============================================================================

  - name: HaloBaryonFraction
    type: double  # SAGE parity: reionization modifier is a double local in SAGE
    units: dimensionless
    description: Local baryon fraction for this halo
    output: true
    init_source: default
    init_value: -1.0  # Initialise with GlobalBaryonFraction when first used
    output_source: galaxy_property
    range: [0.0, 1.0]  # Must be physical fraction
    sentinels: [-1.0]  # -1.0 = not yet set; replaced with GlobalBaryonFraction (or the reionization-modified value) on first use

  # =============================================================================
  # GAS COMPONENTS
  # =============================================================================

  - name: InfallingGas
    type: double  # SAGE parity: infallingGas is a double local in SAGE's evolve loop
    units: 1e10 Msun/h
    description: Cosmological gas infalling onto galaxy this snapshot
    notes: Transport scratch buffer written by sage26_prepare_infall_budget (pre_timestep); read by sage26_apply_infall (galaxy_physics)
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true
    range: [-100000.0, 100000.0]  # Can be negative for mass loss
    sentinels: [0.0]  # Can be zero if no infall (e.g., satellites)

  - name: CoolingGas
    type: double  # SAGE parity: coolingGas is a double local through SAGE's cooling chain
    units: 1e10 Msun/h
    description: Gas mass cooling from hot to cold this substep
    notes: Transport scratch buffer carrying SAGE26's coolingGas. sage26_calculate_cooling_budget writes the capped, pre-suppression mass on every call; sage26_radio_mode_heating overwrites it with the AGN-suppressed mass; sage26_apply_cooling consumes it
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h (cannot be negative)
    sentinels: [0.0]  # Can legitimately be zero (no cooling)

  - name: ColdGas
    type: float
    units: 1e10 Msun/h
    description: Cold gas mass available for star formation
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h (generous upper bound)
    sentinels: [0.0]  # Legitimate to have no cold gas

  - name: HotGas
    type: float
    units: 1e10 Msun/h
    description: Hot gas mass in halo atmosphere
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Can legitimately be zero (all gas cooled or ejected)

  - name: EjectedGas
    type: float
    units: 1e10 Msun/h
    description: Mass of gas ejected from galaxy by feedback
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Can be zero if no feedback has occurred

  # =============================================================================
  # STELLAR COMPONENTS
  # =============================================================================

  - name: StellarMass
    type: float
    units: 1e10 Msun/h
    description: Total stellar mass
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h (generous upper bound)
    sentinels: [0.0]  # Legitimate to have no stars yet

  - name: BulgeMass
    type: float
    units: 1e10 Msun/h
    description: Stellar mass in bulge component
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= StellarMass
    sentinels: [0.0]  # Can be zero for pure disk galaxies

  - name: ICS
    type: float
    units: 1e10 Msun/h
    description: Intracluster stellar mass
    notes: sage26_prepare_infall_budget gathers each FoF group's ICS and MetalsICS onto the central once per snapshot in pre_timestep (satellites' values zeroed, MetalsICS capped at ICS, negatives zeroed), as SAGE26's infall_recipe does. In the satellite_mergers phase sage26_resolve_mergers_and_disruption adds a merging satellite's ICS to the target, and a disruption adds the satellite's ICS and stellar mass and zeroes its ICS; ICS_disrupt and ICS_accrete book each transfer by channel
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Zero if no satellites have been disrupted

  - name: NewStellarMass
    type: double  # SAGE parity: stars is a double local in SAGE
    units: 1e10 Msun/h
    description: New stars formed this timestep
    notes: Transport scratch buffer written by sage26_calculate_star_formation; read by sage26_calculate_supernova_feedback and sage26_apply_star_formation_supernova
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Zero when no star formation occurring

  - name: StarFormationRate
    type: float
    units: Msun/yr
    description: Average star formation rate over snapshot (total stars formed / dT)
    notes: The package's snapshot-averaged diagnostic, not a SAGE26 output (SAGE26's rates are SfrDisk and SfrBulge). Reset each snapshot and accumulated over the snapshot interval dT by sage26_apply_star_formation_supernova (disk star formation), the collisional-burst transaction (shared/sage_starburst_physics.h) and, with EnhancedStarFormationOn 1, sage26_ffb_star_formation on an FFBRegime 1 row (the stars formed before feedback renormalises them).
    output: true
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    output_source: galaxy_property
    output_convert: MimicConfig.UnitMass_in_g / MimicConfig.UnitTime_in_s * SEC_PER_YEAR / SOLAR_MASS
    range: [0.0, 10000.0]  # Up to 10^4 Msun/yr (extreme starbursts)
    sentinels: [0.0]  # Zero when no star formation

  # =============================================================================
  # CHEMICAL COMPOSITION
  # =============================================================================

  - name: MetalsStellarMass
    type: float
    units: 1e10 Msun/h
    description: Metal mass in stellar component
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= StellarMass
    sentinels: [0.0]  # Primordial stars (Pop III) would have zero metals

  - name: MetalsBulgeMass
    type: float
    units: 1e10 Msun/h
    description: Metal mass in bulge component
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= BulgeMass
    sentinels: [0.0]  # Can be zero

  - name: MetalsColdGas
    type: float
    units: 1e10 Msun/h
    description: Metal mass in cold gas reservoir
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= ColdGas
    sentinels: [0.0]  # Primordial gas has zero metals

  - name: MetalsHotGas
    type: float
    units: 1e10 Msun/h
    description: Metal mass in hot gas reservoir
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= HotGas
    sentinels: [0.0]  # Primordial gas has zero metals

  - name: MetalsICS
    type: float
    units: 1e10 Msun/h
    description: Metal mass in intracluster stars
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= ICS
    sentinels: [0.0]  # Can be zero

  - name: MetalsEjectedGas
    type: float
    units: 1e10 Msun/h
    description: Metal mass in ejected gas reservoir
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 100000.0]  # Must be <= EjectedGas
    sentinels: [0.0]  # Can be zero

  # =============================================================================
  # BLACK HOLES
  # =============================================================================

  - name: BlackHoleMass
    type: float
    units: 1e10 Msun/h
    description: Central supermassive black hole mass
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 1.0]  # 0 to 10^10 Msun/h (BH masses are typically much smaller than galaxy masses)
    sentinels: [0.0]  # Can legitimately be zero (no BH seeding yet)

  - name: QuasarModeBHaccretionMass
    type: float
    units: 1e10 Msun/h
    description: Current timestep black hole accretion mass in quasar mode
    output: true
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    output_source: galaxy_property
    range: [0.0, 1.0]  # Typically << galaxy mass
    sentinels: [0.0]  # Zero if no quasar-mode accretion

  # =============================================================================
  # ENERGY & FEEDBACK
  # =============================================================================

  - name: SupernovaReheatedMass
    type: double  # SAGE parity: reheated_mass is a double local in SAGE
    units: 1e10 Msun/h
    description: Gas mass to be reheated by supernova feedback this timestep
    notes: Transport scratch buffer written by sage26_calculate_supernova_feedback; consumed by sage26_apply_star_formation_supernova
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Zero when no feedback occurring

  - name: SupernovaEjectedMass
    type: double  # SAGE parity: ejected_mass is a double local in SAGE
    units: 1e10 Msun/h
    description: Gas mass to be ejected by supernova feedback this timestep
    notes: Transport scratch buffer written by sage26_calculate_supernova_feedback; consumed by sage26_apply_star_formation_supernova
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h
    sentinels: [0.0]  # Zero when no feedback occurring

  - name: Cooling
    type: double  # Note: double precision for energy accumulation over time
    units: log10(erg/s)
    description: Cumulative cooling energy (0.5 * m * V_vir^2), converted to erg/s and log10-transformed
    output: true
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    output_source: galaxy_property
    output_convert: MimicConfig.UnitEnergy_in_cgs / MimicConfig.UnitTime_in_s  # Convert from code units to erg/s
    output_transform: log10  # Apply log10 transform (sentinel 0.0 is skipped)
    range: [0.0, 1000000.0]  # Energy can accumulate to very large values
    sentinels: [0.0]  # Can be zero if no cooling has occurred

  - name: Heating
    type: double  # Note: double precision for energy accumulation over time
    units: log10(erg/s)
    description: Cumulative AGN heating energy (0.5 * m * V_vir^2), converted to erg/s and log10-transformed
    output: true
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    output_source: galaxy_property
    output_convert: MimicConfig.UnitEnergy_in_cgs / MimicConfig.UnitTime_in_s  # Convert from code units to erg/s
    output_transform: log10  # Apply log10 transform (sentinel 0.0 is skipped)
    range: [0.0, 1000000.0]  # Energy can accumulate to very large values
    sentinels: [0.0]  # Can be zero if no AGN heating has occurred

  - name: Rcool
    type: double  # SAGE parity: rcool is a double local passed into do_AGN_heating
    units: Mpc/h
    description: Cooling radius calculated this substep
    notes: Transport state carrying SAGE26's rcool from the hot cooling recipe. Written by sage26_calculate_cooling_budget on every call (0 where the recipe returns before forming it); read by sage26_radio_mode_heating for the AGN heating
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true
    range: [0.0, 10.0]  # 0 to 10 Mpc/h (cannot be negative)
    sentinels: [0.0]  # Can be zero if no cooling

  - name: CoolingX
    type: double  # SAGE parity: x is a double local passed into do_AGN_heating
    units: Internal
    description: SAGE26's cooling quantity x = m_p k_B T_vir / Lambda(T, Z) in code units (s g/cm^3 over UnitDensity_in_cgs * UnitTime_in_s) from the last cooling call
    notes: Transport state carrying SAGE26's x from the hot cooling recipe, carried exactly rather than recomputed from Lambda. Written by sage26_calculate_cooling_budget on every call (0 where the recipe returns before forming it); read by sage26_radio_mode_heating for the Bondi accretion rate. Never written to output
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true
    sentinels: [0.0]  # 0 = not formed this call

  - name: CoolingReturnPath
    type: int
    units: dimensionless
    description: Return path of SAGE26's hot cooling on the last call - -1 not evaluated (no positive interval), 0 the normal tail, 1 the HotGas/Vvir outer guard, 2 the lambda <= 0 early return, 3 the rho_rcool <= 0 early return
    notes: Transport state marking where the hot cooling recipe returned. Written by sage26_calculate_cooling_budget on every call; read by sage26_apply_cooling, which updates Cooling and CoolingRate only on paths 0 and 1, as SAGE26's early returns skip that tail. Used only with CGMrecipeOn 0; with CGMrecipeOn 1 the budget writes -1 (and 0 to CoolingGas, CoolingX and Rcool), the radio and apply modules write nothing, and sage26_regime_aware_cooling runs the whole regime-aware recipe without this marker. Never written to output
    output: false
    init_source: default
    init_value: 0
    init_repeat: true
    range: [-1, 3]

  - name: Rheat
    type: float
    units: Mpc/h
    description: Heating radius from past AGN feedback events
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10.0]  # Comparable to virial radius
    sentinels: [0.0]  # Can be zero if no AGN heating has occurred

  - name: SupernovaOutflowRate
    type: float
    units: Msun/yr
    description: Supernova-reheated gas outflow rate, SAGE26's OutflowRate
    notes: The shared feedback commit (shared/sage_sf_feedback_physics.h, SAGE26's update_from_feedback) adds the reheated mass on every disk star-formation and burst event, and sage26_finalize_cooling_heating divides the sum once per halo by the deltaT of the FoF's first galaxy, skipping merged galaxies; the output converts code mass per code time to Msun/yr. Reset for every inherited galaxy each snapshot (init_repeat), whereas SAGE26 does not reset an orphan's; mergers never move it, so that difference shows only in the orphan's own row.
    output: true
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    output_source: galaxy_property
    output_convert: MimicConfig.UnitMass_in_g / MimicConfig.UnitTime_in_s * SEC_PER_YEAR / SOLAR_MASS
    range: [0.0, 10000.0]  # Up to 10^4 Msun/yr (extreme starbursts)
    sentinels: [0.0]  # Zero when no star formation/feedback occurring

  # =============================================================================
  # STRUCTURE
  # =============================================================================

  - name: DiskScaleRadius
    type: float
    units: Mpc/h
    description: Disk scale radius (exponential disk scale length)
    output: true
    init_source: default
    init_value: 0.0
    output_source: galaxy_property
    range: [0.0, 10.0]  # Comparable to virial radius
    sentinels: [0.0]  # Can be zero for galaxies without formed disks

  # =============================================================================
  # MERGER HISTORY
  # =============================================================================

  - name: MergTime
    type: float  # SAGE parity: SAGE26's float MergTime
    units: Internal
    description: Dynamical-friction merger timescale for satellite galaxies (code time units)
    notes: sage26_initialise_merger_clock sets it at progenitor joining in pre_timestep - 999.9 for every FoF central, the dynamical-friction estimate for a Type 0 that becomes a Type 1 or a Type 1 whose clock is above 999, and 0 for a galaxy that loses its subhalo as a Type 0 or with a clock above 999; the merger pass decrements it. Sentinel protocol in shared/sage_constants.h (values above 999.0 mean unset; computed times are capped at 998.0)
    output: false
    init_source: default
    init_value: 999.9
    sentinels: [999.9, -1.0]  # 999.9 = unset (no merger clock assigned); -1.0 = immediate merger
    range: [0.0, 1000.0]

  - name: PreviousType
    type: int
    units: dimensionless
    description: The galaxy's Type at the end of the previous snapshot (-1 = no previous snapshot)
    notes: Package-private transition state - SAGE26's progenitor joining reads a galaxy's old Type, which Mimic's core overwrites during inheritance. sage26_record_transition_state writes the galaxy's final Type here as the last post_timestep module, the galaxy carries it into the next snapshot (no init_repeat), and sage26_initialise_merger_clock and sage26_set_halo_concentration read it in pre_timestep; a galaxy created this snapshot has -1. Never written to output
    output: false
    init_source: default
    init_value: -1
    range: [-1, 3]

  - name: infallStellarMassState
    type: float  # SAGE parity: SAGE26's float infallStellarMass
    units: 1e10 Msun/h
    description: Stellar mass when the galaxy last became a satellite, as SAGE26 holds it in memory (-1 = never)
    notes: Package-private state behind the output infallStellarMass. sage26_initialise_merger_clock sets it from StellarMass at progenitor joining when a Type 0 becomes a Type 1 and when a galaxy loses its subhalo as a Type 0 or with a clock above 999. Kept for centrals, as SAGE26 keeps the member; only the output zeroes Type 0 rows. Never written to output
    output: false
    init_source: default
    init_value: -1.0
    sentinels: [-1.0]  # -1.0 = never a satellite

  - name: TimeOfInfallState
    type: float  # SAGE parity: SAGE26's float TimeOfInfall
    units: index
    description: Snapshot number at which the galaxy last became a satellite with a subhalo, as SAGE26 holds it in memory (-1 = never)
    notes: Package-private state behind the output TimeOfInfall. sage26_initialise_merger_clock sets it to the descendant halo's snapshot number, stored as a float, when a Type 0 becomes a Type 1 at progenitor joining; the transition to Type 2 does not write it, so an orphan keeps any earlier value. Kept for centrals; only the output zeroes Type 0 rows. Never written to output
    output: false
    init_source: default
    init_value: -1.0
    sentinels: [-1.0]  # -1.0 = never a satellite

  - name: TimeOfLastMajorMerger
    type: float
    units: Myr
    description: Lookback time of the galaxy's last major merger (mass ratio strictly above ThresholdMajorMerger), as SAGE26 writes it; -1 times the unit factor if it never had one
    notes: A lookback time in code units, set by sage26_resolve_mergers_and_disruption to the merger's event time on a major merger (ratio strictly above ThresholdMajorMerger). The output multiplies it by UnitTime_in_Megayears, -1 included, as SAGE26's writer does, so a galaxy that never had a major merger is written as -1 times that factor (-978028.5 for Millennium units); that is why -1 is the init_value and not a sentinel, which would skip the conversion. Myr is SAGE26's label; the code time unit carries a 1/h.
    output: true
    init_source: default
    init_value: -1.0
    output_source: galaxy_property
    output_convert: MimicConfig.UnitTime_in_Megayears
    range: [-978029.0, 14000.0]  # never merged (-1 x 978028.53 Myr) to a lookback beyond the age of the universe

  - name: TimeOfLastMinorMerger
    type: float
    units: Myr
    description: Lookback time of the galaxy's last minor merger (every merger not above ThresholdMajorMerger), as SAGE26 writes it; -1 times the unit factor if it never had one
    notes: A lookback time in code units, set by sage26_resolve_mergers_and_disruption to the merger's event time on every merger that is not major (a ratio of 0, at or below 0.1, or equal to ThresholdMajorMerger included). The output multiplies it by UnitTime_in_Megayears, -1 included, as SAGE26's writer does, so a galaxy that never had a minor merger is written as -1 times that factor (-978028.5 for Millennium units); that is why -1 is the init_value and not a sentinel, which would skip the conversion. Myr is SAGE26's label; the code time unit carries a 1/h.
    output: true
    init_source: default
    init_value: -1.0
    output_source: galaxy_property
    output_convert: MimicConfig.UnitTime_in_Megayears
    range: [-978029.0, 14000.0]  # never merged (-1 x 978028.53 Myr) to a lookback beyond the age of the universe

  # =============================================================================
  # DISK INSTABILITY & MERGER TRIGGERS
  # =============================================================================

  - name: UnstableDiskGasFraction
    type: double  # SAGE parity: unstable_gas_fraction is a double local in SAGE
    units: dimensionless
    description: Fraction of cold gas that is unstable (0.0-1.0)
    notes: Transport scratch buffer written by sage26_disk_instability; read by sage26_quasar_mode and sage26_starburst_feedback; reset to 0.0 once each snapshot, after inheritance (init_repeat), not between substeps
    output: false
    init_source: default
    init_value: 0.0
    init_repeat: true  # Reset each snapshot
    range: [0.0, 1.0]
    sentinels: [0.0]

  - name: MergerDiskDominated
    type: int
    units: dimensionless
    description: The merger target's morphology before the satellite was added, 1 if disk-dominated (its float disk mass above half its StellarMass), else 0
    notes: Transport field of the merger event, whose payload holds only the ratio and the satellite's dt. sage26_resolve_mergers_and_disruption writes the target's pre-addition flag immediately before each merger event, and sage26_starburst_feedback's merger consumer reads it to select the burst's bulge channel. Each merger rewrites it before its event, so a stale value is never read; reset at each snapshot's inheritance (init_repeat)
    output: false
    init_source: default
    init_value: 0
    init_repeat: true  # Reset each snapshot; rewritten before every merger event
    range: [0, 1]

  # =============================================================================
  # SAGE26 OUTPUT CONTRACT
  # The properties in the sections below mirror SAGE26's output fields. Each has a
  # writer in the package, named in its notes, except H2DepletionTime_Gyr, which no
  # module writes and which keeps its creation value -1; a property whose writer
  # acts only under a configuration flag keeps its creation value where its notes
  # say that writer writes nothing.
  # =============================================================================

  # -----------------------------------------------------------------------------
  # Gas accretion regime and circumgalactic medium (CGM)
  # -----------------------------------------------------------------------------

  - name: Regime
    type: int
    units: dimensionless
    description: Gas accretion regime of the halo - 0 = CGM regime, 1 = hot-halo regime, -1 = not yet assigned
    notes: With CGMrecipeOn 1 (SAGE26's default and the run files' value) sage26_determine_regime classifies every live row of the FoF group, satellites and orphans included, as 0 or 1 once per snapshot in pre_timestep; with CGMrecipeOn 0 it writes nothing and the value stays -1. Its deviate is the package's keyed draw of the row's UniqueGalaxyID and the current snapshot (shared/sage_keyed_draw.h) in place of SAGE26's rand(). SAGE26's HDF5 text calls regime 1 the ICM regime
    output: true
    init_source: default
    init_value: -1
    range: [-1, 1]
    sentinels: [-1]  # -1 = regime not yet assigned

  - name: FFBRegime
    type: int
    units: dimensionless
    description: Feedback-free-burst regime of the halo - 0 = normal halo, 1 = FFB halo
    notes: With EnhancedStarFormationOn 1 (SAGE26's default and the run files' value) sage26_determine_ffb_regime writes it once per FoF in pre_timestep; with EnhancedStarFormationOn 0 it writes nothing and every row keeps 0. Every row but Type 3 gets 1 when SAGE26's SplitMix64 hash halo_uniform of the row's MostBoundID and the current snapshot falls below the FFB fraction, the Li et al. (2024) sigmoid 0.15 dex wide about the threshold mass, evaluated at the row's float Mvir and the current redshift. Persists between snapshots (no init_repeat), as SAGE26's member does.
    output: true
    init_source: default
    init_value: 0
    range: [0, 1]

  - name: CGMgas
    type: float
    units: 1e10 Msun/h
    description: Gas mass in the circumgalactic medium (CGM), the hot-phase reservoir of CGM-regime halos
    notes: Filled only with CGMrecipeOn 1 (the run files' value); with CGMrecipeOn 0 nothing adds to it and it stays 0. The central's migration in sage26_prepare_infall_budget, infall, stripping, reincorporation, the supernova commits (ordinary, burst and feedback-free-burst), the quasar wind and disruption deposit into or take from it by Regime, and sage26_regime_aware_cooling cools it and, in its CGM radio-mode heating (AGNrecipeOn > 0), accretes from it onto the black hole. A merger in sage26_resolve_mergers_and_disruption moves the satellite's CGMgas and MetalsCGMgas to the target whatever either galaxy's Regime
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # 0 to 10^15 Msun/h

  - name: MetalsCGMgas
    type: float
    units: 1e10 Msun/h
    description: Metal mass in the circumgalactic medium (CGM) gas
    notes: With CGMrecipeOn 1 (the run files' value) it moves with CGMgas in each transfer listed under CGMgas, and the escaping metals of the disk yield (sage26_apply_metal_enrichment and, on an FFBRegime 1 row, sage26_ffb_star_formation, both through shared/sage_metal_yield_physics.h) and of the burst yield reach it when the FoF central's Regime is 0; with CGMrecipeOn 0 it stays 0
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= CGMgas

  # -----------------------------------------------------------------------------
  # Cooling diagnostics
  # -----------------------------------------------------------------------------

  - name: tcool
    type: float
    units: Internal
    description: Cooling-time diagnostic - the hot recipe's float(Rvir/Vvir) * 1e10/Hubble_h * SEC_PER_GIGAYEAR/UnitTime_in_s (not Gyr), or with CGMrecipeOn 1 the CGM recipe's time in h^2 Gyr or 0 after the CGM reset; -1 until first set
    notes: Unit is Internal because neither path stores a time in Gyr, whatever SAGE26's labels say - the hot path stores the expression in the description and the CGM path h^2 times the cooling time in Gyr. With CGMrecipeOn 0 sage26_calculate_cooling_budget resets it to 0 on every call and then writes the hot-path value before the recipe's early returns. With CGMrecipeOn 1 sage26_regime_aware_cooling runs SAGE26's regime-aware recipe - a Regime 0 galaxy takes the CGM value when its CGM gas passes the Vvir and lambda guards, keeps its earlier value when that gas fails either guard and is reset to 0 when it has none; any other Regime takes the hot value, falling back to the CGM value or the reset only when the hot diagnostics are invalid
    output: true
    init_source: default
    init_value: -1.0
    sentinels: [-1.0]  # -1.0 = not yet set

  - name: tff
    type: float
    units: Internal
    description: Free-fall diagnostic - the hot recipe's sqrt(2) float(Rvir/Vvir) * 1e10/Hubble_h * SEC_PER_GIGAYEAR/UnitTime_in_s (not Gyr), or with CGMrecipeOn 1 the CGM recipe's in Gyr/h, or -1 (reset, restored hot); -1 until first set
    notes: Unit is Internal because neither path stores a time in Gyr, whatever SAGE26's labels say - the hot path stores the expression in the description and the CGM path h times the free-fall time in Gyr. With CGMrecipeOn 0 sage26_calculate_cooling_budget writes it on the hot path but, unlike tcool, does not reset it at the start of a call, so an outer-guard failure leaves it stale. With CGMrecipeOn 1 sage26_regime_aware_cooling writes the hot or CGM value, sets -1 where it resets the CGM diagnostics and ends a hot-regime galaxy whose hot call left Vvir > 0 and tcool > 0 at -1, even after CGM cooling; CGM gas that fails either CGM guard leaves it stale
    output: true
    init_source: default
    init_value: -1.0
    sentinels: [-1.0]  # -1.0 = not yet set or reset

  - name: RcoolToRvir
    type: float
    units: dimensionless
    description: Cooling radius over the float virial radius at the last hot cooling call that formed one (uncapped, can exceed 1); early returns and CGM cooling leave it; -1 if never evaluated or after the CGMrecipeOn 1 reset
    notes: Written by the hot cooling recipe (rcool is uncapped, so the ratio can exceed 1); CGM cooling never writes it. With CGMrecipeOn 0 sage26_calculate_cooling_budget fills it; with CGMrecipeOn 1 sage26_regime_aware_cooling does, and resets it to -1 for a Regime 0 galaxy without CGM gas and for a hot-regime galaxy without CGM gas whose hot diagnostics are invalid. CGM gas that fails the CGM Vvir or lambda guard leaves it as it was
    output: true
    init_source: default
    init_value: -1.0
    sentinels: [-1.0]  # -1.0 = not evaluated

  - name: CoolingRate
    type: float
    units: Internal
    description: Cooled mass over the substep times 1e10/Hubble_h * SEC_PER_GIGAYEAR/UnitTime_in_s (Msun/Gyr over h) - CGMrecipeOn 0 the suppressed hot mass at SAGE26's tail, CGMrecipeOn 1 the applied CGM plus hot mass
    notes: Written by cooling on every call, so the last call wins; since code time already carries 1/h, the extra 1/Hubble_h makes the value the true Msun/Gyr rate divided by h, whatever SAGE26's label says (Internal, as the registry has no label for it). With CGMrecipeOn 0 sage26_apply_cooling writes it at the hot recipe's tail, which the early returns skip; with CGMrecipeOn 1 sage26_regime_aware_cooling's tail always overwrites it with the total CGM plus hot mass applied after both reservoir caps. SAGE26 gives it no creation value; the package's 0 stays until the first cooling call that reaches a tail
    output: true
    init_source: default
    init_value: 0.0

  - name: mdot_cool
    type: float
    units: Msun/yr
    description: Hot-halo cooling rate of the hot regime's cold-stream recipe before the reservoir cap and AGN suppression, in Msun/yr (0 with CGMrecipeOn 0)
    notes: sage26_finalize_cooling_heating writes it for every galaxy it finalises from mdot_cool_raw, converted to Msun/yr with SAGE26's writer expression, so no output_convert is declared (the generator's grouped conversion would round differently); SAGE26's HDF5 label says 1.0e10 Msun/yr, but the written unit is Msun/yr. The raw rate is set only on the CGMrecipeOn 1 hot recipe's cold-stream path, before the reservoir cap and AGN suppression, so this is neither the applied rate nor a snapshot average; with CGMrecipeOn 0 it holds 0
    output: true
    init_source: default
    init_value: 0.0

  - name: mdot_stream
    type: float
    units: Msun/yr
    description: Cold-stream cooling rate of the hot regime's cold-stream recipe before the reservoir cap and AGN suppression, in Msun/yr (0 with CGMrecipeOn 0)
    notes: sage26_finalize_cooling_heating writes it for every galaxy it finalises from mdot_stream_raw, converted to Msun/yr with SAGE26's writer expression, so no output_convert is declared (the generator's grouped conversion would round differently); SAGE26's HDF5 label says 1.0e10 Msun/yr, but the written unit is Msun/yr. The raw rate is set only on the CGMrecipeOn 1 hot recipe's cold-stream path, before the reservoir cap and AGN suppression, so this is neither the applied rate nor a snapshot average; with CGMrecipeOn 0 it holds 0
    output: true
    init_source: default
    init_value: 0.0

  - name: mdot_cool_raw
    type: float  # SAGE parity: SAGE26's float member mdot_cool
    units: Internal
    description: SAGE26's raw float mdot_cool, hot_halo_cooling / dt of the cold-stream recipe before the reservoir cap and AGN, as SAGE26 holds it
    notes: Package-private state behind the output mdot_cool, in code units of 1e10 Msun/h per code time (Internal, as the registry has no label for this rate). Written only by sage26_regime_aware_cooling with CGMrecipeOn 1 - 0 at the start of every regime-aware call, then hot_halo_cooling / dt where the hot recipe reaches its cold streams - and otherwise persists (no init_repeat), as SAGE26's member does; sage26_finalize_cooling_heating converts it to mdot_cool. Never written to output
    output: false
    init_source: default
    init_value: 0.0

  - name: mdot_stream_raw
    type: float  # SAGE parity: SAGE26's float member mdot_stream
    units: Internal
    description: SAGE26's raw float mdot_stream, cold_stream_cooling / dt of the cold-stream recipe before the reservoir cap and AGN, as SAGE26 holds it
    notes: Package-private state behind the output mdot_stream, in code units of 1e10 Msun/h per code time (Internal, as the registry has no label for this rate). Written only by sage26_regime_aware_cooling with CGMrecipeOn 1 - 0 at the start of every regime-aware call, then cold_stream_cooling / dt where the hot recipe reaches its cold streams - and otherwise persists (no init_repeat), as SAGE26's member does; sage26_finalize_cooling_heating converts it to mdot_stream. Never written to output
    output: false
    init_source: default
    init_value: 0.0

  # -----------------------------------------------------------------------------
  # Cold gas phases and star formation
  # -----------------------------------------------------------------------------

  - name: H2gas
    type: float
    units: 1e10 Msun/h
    description: Mass of molecular hydrogen (H2) in the cold gas reservoir
    notes: With SFprescription 1 (BR06 with radial integration, the run files' value) sage26_calculate_star_formation writes it on every disk star-formation call from the Blitz & Rosolowsky (2006) molecular fraction, 0 where the galaxy's Vvir or scale radius is not positive, capped at ColdGas * 0.74; each later step that removes cold gas (the star-formation commit, the reheating, black-hole accretion and every burst's hydrogen refresh) caps it again at the hydrogen of the cold gas it leaves, and only a quasar wind can leave it briefly above that bound until the burst that follows. On the feedback-free-burst path (EnhancedStarFormationOn 1 and FFBRegime 1) sage26_ffb_star_formation sets it to 0; with SFprescription 0 nothing else writes it. Inherited between snapshots, as in SAGE26.
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Must be <= ColdGas

  - name: H1gas
    type: float
    units: 1e10 Msun/h
    description: Mass of atomic hydrogen (HI) in the cold gas reservoir
    notes: sage26_calculate_star_formation writes it on every disk star-formation call from the cold gas before that substep's star formation, as (ColdGas * 0.74 - H2gas, floored at 0) * (1 - f_ion), f_ion the ionised fraction of an exponential disk below 0.5 Msun/pc^2; on the feedback-free-burst path sage26_ffb_star_formation writes it the same way (shared/sage_hi_physics.h) after zeroing H2gas. Under SFprescription 1 (the run files' value) the star-formation commit, the reheating and black-hole accretion cap it at the hydrogen of the cold gas each leaves, and every burst overwrites it with ColdGas * 0.74 - H2gas (floored at 0, no ionisation correction). Under SFprescription 0 it is not resynchronised after the star formation and feedback that follow (SAGE26's behaviour), so it can exceed the hydrogen left in ColdGas; inherited between snapshots, as in SAGE26.
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 100000.0]  # Below ColdGas; can exceed its hydrogen with SFprescription 0

  - name: H2DepletionTime_Gyr
    type: float
    units: Gyr
    description: Molecular-gas depletion time from the K13 prescription, -1 if not applicable
    notes: No module writes it. SAGE26 assigns it only in its K13 H2 routine and a star-formation path the package does not support, and SFprescription 1's BR06 integration does not produce it, so every galaxy keeps the creation value -1, as in SAGE26.
    output: true
    init_source: default
    init_value: -1.0
    sentinels: [-1.0]  # -1.0 = not applicable

  - name: SfrDisk
    type: float
    units: Msun/yr
    description: Disk star formation rate averaged over the snapshot substeps, in Msun/yr
    notes: Averaged from the per-substep history SfrDiskBin0-9, to which sage26_apply_star_formation_supernova and, with EnhancedStarFormationOn 1, sage26_ffb_star_formation add stars / dt. sage26_finalize_sfr_histories averages the bins once per FoF in post_timestep with SAGE26's writer expression (each bin converted to Msun/yr and divided by sfr_rate_divisor(SubstepsUsed)), so this field holds the final value and has no output_convert.
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10000.0]  # Up to 10^4 Msun/yr (extreme starbursts)

  - name: SfrBulge
    type: float
    units: Msun/yr
    description: Bulge (starburst) star formation rate averaged over the snapshot substeps, in Msun/yr
    notes: Averaged from the per-substep history SfrBulgeBin0-9, to which every burst (shared/sage_starburst_physics.h) adds stars / dt of the bursting galaxy. sage26_finalize_sfr_histories averages the bins once per FoF in post_timestep with SAGE26's writer expression (each bin converted to Msun/yr and divided by sfr_rate_divisor(SubstepsUsed)), so this field holds the final value and has no output_convert.
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 10000.0]  # Up to 10^4 Msun/yr (extreme starbursts)

  - name: SfrDiskZ
    type: float
    units: dimensionless
    description: Mean metallicity (metal mass / cold gas mass) of the cold gas forming disk stars, averaged over the snapshot substeps
    notes: sage26_finalize_sfr_histories computes it once per FoF in post_timestep from the histories SfrDiskColdGasBin0-9 and SfrDiskColdGasMetalsBin0-9 (written by disk and feedback-free-burst star formation), summing metals / gas / sfr_metallicity_divisor(SubstepsUsed) over the bins whose gas is positive, as SAGE26's writer does; the field is written as it is. Dimensionless, although SAGE26's HDF5 label says Msun/yr.
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 1.0]  # Metal mass fraction of cold gas

  - name: SfrBulgeZ
    type: float
    units: dimensionless
    description: Mean metallicity (metal mass / cold gas mass) of the cold gas forming bulge stars, averaged over the snapshot substeps
    notes: sage26_finalize_sfr_histories computes it once per FoF in post_timestep from the histories SfrBulgeColdGasBin0-9 and SfrBulgeColdGasMetalsBin0-9 (to which every burst adds the bursting galaxy's cold gas), summing metals / gas / sfr_metallicity_divisor(SubstepsUsed) over the bins whose gas is positive, as SAGE26's writer does; the field is written as it is. Dimensionless, although SAGE26's HDF5 label says Msun/yr.
    output: true
    init_source: default
    init_value: 0.0
    range: [0.0, 1.0]  # Metal mass fraction of cold gas

  # -----------------------------------------------------------------------------
  # SAGE26 per-substep star-formation histories (package-private)
  # -----------------------------------------------------------------------------
  # SAGE26's six float arrays of STEPS = 10 bins, one float scalar per element
  # because the generator emits scalars only. Modules reach them only through
  # shared/sage_sfr_history.h, which maps (history, bin) to the element. SAGE26
  # zeroes them at creation and at the first-occupied update, which runs only for a
  # galaxy that was a Type 0 or 1 and stays one; a galaxy that becomes or stays an
  # orphan keeps its histories and moves them in a merger in the same snapshot. So
  # they are inherited (no init_repeat): sage26_initialise_merger_clock, the first
  # pre_timestep module, zeroes them at joining for exactly SAGE26's rows
  # (shared/sage_sfr_history.h mimic_sage_reset_sfr_histories).
  # sage26_finalize_sfr_histories averages them into SfrDisk, SfrBulge, SfrDiskZ
  # and SfrBulgeZ.

  - name: SubstepsUsed
    type: int
    units: count
    description: Substeps integrated this snapshot, the divisor of the SFR history averages
    notes: Created as 10, SAGE26's STEPS. sage26_finalize_sfr_histories sets it to the halo's substep count once per FoF in post_timestep and divides the histories by sfr_rate_divisor and sfr_metallicity_divisor of it; no module reads it before then. Never written to output
    output: false
    init_source: default
    init_value: 10
    range: [0, 100000]

  - name: SfrDiskBin0
    type: float  # SAGE parity: element 0 of SAGE26's float SfrDisk[STEPS]
    units: Internal
    description: SAGE26 SfrDisk[0], the disk star formation rate stars / dt summed over the substeps mapped to this bin, in 1e10 Msun/h per code time
