# Mimic SAGE on mini-Millennium Run Configuration

model:
  name: sage26

simulation:
  name: mini-millennium

output:
  output_filename: model
  output_directory: output/sage26-mini-millennium
  output_format: hdf5                               # Select binary or hdf5
  snapshot_list: [63, 37, 32, 27, 23, 20, 18, 16]   # Leave empty for all snapshots

SubSteps: 10

modules:

  pre_timestep:
    # Setup and snapshot budgets, in SAGE26's source order: progenitor joining (the
    # SFR-history reset, merger clock and infall, then the central's halo concentration,
    # core_build_model.c:290-294, and its disk radius, SAGE26 core_build_model.c:240-338),
    # then reionization, the CGM regime classifier (SAGE26 calls it between joining and
    # infall_recipe, core_build_model.c:407-415; it writes nothing with CGMrecipeOn 0), the
    # FoF infall budget, and the feedback-free-burst classifier (SAGE26's order,
    # core_build_model.c:407-427: the CGM classifier, infall_recipe, then the FFB classifier
    # once per FoF before the substeps; it writes nothing with EnhancedStarFormationOn 0).
    # The merger clock runs first: it zeroes the histories of the rows SAGE26 resets
    # (core_build_model.c:278-282) before any history is read or written. The concentration
    # writes nothing with ConcentrationOn 0
    - sage26_initialise_merger_clock: process_full_halo
    - sage26_set_halo_concentration:  process_full_halo
    - sage26_set_disk_scale_radius:   process_full_halo
    - sage26_reionization:            process_full_halo
    - sage26_determine_regime:        process_full_halo
    - sage26_prepare_infall_budget:   process_full_halo
    - sage26_determine_ffb_regime:    process_full_halo

  # Ordered, user-named substep middle phases. Each runs once per substep, in the
  # order listed. Within a phase, full-halo/event work precedes galaxy-local work.
  phases:

    galaxy_physics:
      # Baryon supply (central-only, full-halo)
      - sage26_apply_infall:            process_full_halo
      - sage26_reincorporation:         process_full_halo

      # Satellite stripping
      - sage26_satellite_stripping:     process_by_galaxy

      # Cooling and AGN suppression: with CGMrecipeOn 0 the classic hot path (budget, radio,
      # apply); with CGMrecipeOn 1 the budget writes no cooling and sage26_regime_aware_cooling
      # runs SAGE26's whole regime-aware cooling (it writes nothing with CGMrecipeOn 0)
      - sage26_calculate_cooling_budget: process_by_galaxy
      - sage26_radio_mode_heating:      process_by_galaxy
      - sage26_apply_cooling:           process_by_galaxy
      - sage26_regime_aware_cooling:    process_by_galaxy

      # Star formation and supernova feedback: first SAGE26's feedback-free-burst transaction
      # (starformation_ffb, model_starformation_and_feedback.c:1262-1368), which with
      # EnhancedStarFormationOn 1 forms, commits and feeds back an FFBRegime 1 row's stars in one
      # step and writes nothing with EnhancedStarFormationOn 0; then the ordinary chain. As in
      # SAGE26's dispatch (model_starformation_and_feedback.c:1004-1008), an FFBRegime 1 row
      # bypasses the ordinary chain: the three modules below, sage26_disk_instability and
      # sage26_apply_metal_enrichment return at once on it, writing nothing, so the by-galaxy
      # quasar and burst entries never fire on it; the merger consumers are not bypassed. With
      # EnhancedStarFormationOn 1 the transaction must sit immediately before
      # sage26_calculate_star_formation, and it and sage26_determine_ffb_regime require each other
      - sage26_ffb_star_formation:              process_by_galaxy
      - sage26_calculate_star_formation:        process_by_galaxy
      - sage26_calculate_supernova_feedback:    process_by_galaxy
      - sage26_apply_star_formation_supernova:  process_by_galaxy

      # Disk instability
      - sage26_disk_instability:        process_by_galaxy
      - sage26_quasar_mode:             process_by_galaxy
      - sage26_starburst_feedback:      process_by_galaxy

      # Disk-SF metal yield — must follow the disk-instability chain (SAGE ordering)
      - sage26_apply_metal_enrichment:  process_by_galaxy

    satellite_mergers:
      # Mergers and disruption — runs after all galaxy physics for the current substep
      # sage26_resolve_mergers_and_disruption emits its merger event for downstream consumers
      - sage26_resolve_mergers_and_disruption: process_full_halo
      - sage26_quasar_mode:             process_per_event   # merger event consumer
      - sage26_starburst_feedback:      process_per_event   # merger event consumer

  post_timestep:
    # Once per FoF after the last substep: normalise the accumulated Cooling and
    # Heating energies by the snapshot interval (SAGE26 core_build_model.c:590-603)
    - sage26_finalize_cooling_heating: process_full_halo
    # Then average the per-substep SFR histories into SfrDisk, SfrBulge, SfrDiskZ and
    # SfrBulgeZ, as SAGE26's writer does (SAGE26 io/save_gals_hdf5.c:934-959)
    - sage26_finalize_sfr_histories:   process_full_halo
    # Last: record each galaxy's final Type for the next snapshot's progenitor-joining
    # transitions (SAGE26 core_build_model.c:240-338) and write infallStellarMass and
    # TimeOfInfall, 0 for Type 0 rows (SAGE26 io/save_gals_hdf5.c:1004-1017)
    - sage26_record_transition_state:  process_full_halo

  parameters:
    # Reionisation
    GlobalBaryonFraction: 0.17          # Cosmic baryon fraction (Planck 2018)

    # CGM regime
    CGMrecipeOn: 1                      # CGM regime recipe: 1 = SAGE26's R4 (input/millennium.par:54 sets 1), the classifier with the package's keyed draw, regime-aware routing and regime-aware cooling; 0 = off, Regime keeps its creation value -1 and cooling takes the classic hot path (SAGE26 R0-R3; input/millennium.par:54, "0: switch off"); required
    MShockMsun: 6.0e11                  # Dekel & Birnboim (2006) shock mass in physical Msun (SAGE26 default, core_read_parameter_file.c:114; input/millennium.par does not set it); used only with CGMrecipeOn 1, but always required and validated (positive, finite)

    # Feedback-free bursts
    EnhancedStarFormationOn: 1          # FFB mode: 0 = off, FFBRegime keeps its creation value 0 (SAGE26 R0-R5; input/millennium.par:58, "0: off"); 1 = SAGE26's Li+24 classifier and FFB star formation (R6, SAGE26's default, input/millennium.par:58); 2 not ported; required
    EnhancedSFEfficiency: 0.2           # FFB star-formation efficiency epsilon_FFB of SAGE26's starformation_ffb (input/millennium.par:67; SAGE26's default, core_read_parameter_file.c:104); read only with EnhancedStarFormationOn 1, but always required and validated (finite, within [0, 1])

    # Halo concentration
    ConcentrationOn: 3                  # NFW halo concentration: 0 = off, Concentration keeps its creation value 0 (SAGE26 R0-R4; input/millennium.par:57, "0: off"); 3 = the Vmax/Vvir inversion, infall-frozen for a former satellite (R5; input/millennium.par:57); 1 and 2 not ported; required

    # Star Formation
    SfrEfficiency: 0.05                 # Star formation efficiency
    StarFormingDiskFactor: 3.0          # Number of disc scale radii to form stars over
    SFprescription: 1                   # SF law: 1 = Blitz & Rosolowsky 2006 H2 with radial integration (SAGE26 R2; input/millennium.par:48); 0 = Croton et al. 2006 critical mass (R0, R1; input/millennium.par:48, "0: original Croton et al. 2006"); 2-7 not ported
    H2RadialIntegrationOn: 1            # BR06 H2 by radial integration of the exponential disk (SAGE26 default, core_read_parameter_file.c:99; R2); 0, the single-slab branch, not ported
    H2RadialNBins: 25                   # Radial bins of the H2 integration (SAGE26 default, core_read_parameter_file.c:100; R2); only 25 supported
    H2RadialRMaxFactor: 5.0             # H2 integration out to this many disc scale radii (SAGE26 default, core_read_parameter_file.c:101; R2); only 5.0 supported
    StarburstColdGasOn: 1               # Starburst fuel: 1 = the cold gas (SAGE26 default, core_read_parameter_file.c:109; R0-R2); 0, the H2 fuel, not ported

    # Supernova Feedback
    FeedbackReheatingEpsilon: 2.9       # Reheating efficiency (SAGE26 R0, input/millennium.par:69)
    FeedbackEjectionEfficiency: 0.3     # Ejection efficiency
    FIREmodeOn: 1                       # SN feedback of the disk path and every burst: 1 = FIRE scaling, capped loading and energy-based ejection, the package default (SAGE26 R3; input/millennium.par:55); 0 = fixed-epsilon Croton et al. 2016 (R0-R2; input/millennium.par:55, "0: switch off"); required

    # Gas Reincorporation
    ReIncorporationFactor: 0.19         # Scales Vcrit = 354.53 km/s (SAGE26 R0, input/millennium.par:72)

    # Cooling & AGN Feedback
    AGNrecipe: 2                        # AGN mode: 2 = Bondi-Hoyle radio mode (SAGE26's AGNrecipeOn 2, input/millennium.par:49); 0 = off, no radio-mode heating and no black-hole growth; 1 and 3 not ported; required
    RadioModeEfficiency: 0.08           # Radio-mode AGN feedback efficiency

    # Black Hole Growth
    BlackHoleGrowthRate: 0.015          # BH growth efficiency during mergers
    QuasarModeEfficiency: 0.005         # Quasar-mode AGN feedback efficiency

    # Metals
    RecycleFraction: 0.43               # Instantaneous recycling fraction
    Yield: 0.025                        # Metal yield per unit stellar mass
    FracZleaveDisk: 0.0                 # Fraction of metals leaving disk

    # Mergers & Disruption
    ThresholdMajorMerger: 0.3           # Mass ratio threshold for major mergers
    ThresholdSatDisruption: 1.0         # Mvir-to-baryonic mass ratio threshold for sat merger/disruption
    MergerTimeFactor: 2.0               # Merger-clock scaling (SAGE26 R0: the default, core_read_parameter_file.c:128; input/millennium.par does not set it)

    # Bulge Sizes
    BulgeSizeOn: 3                      # Bulge-size mode: 3 = Tonini merger and instability bulges (SAGE26 R1; model_misc.c:316-317, the default at core_read_parameter_file.c:107, which input/millennium.par does not set); 0 = none, the radii zeroed (R0; model_misc.c:241-245); 1 and 2 not ported
