# Mimic SAGE26 on Shin-Uchuu Run Configuration - Consistent-Trees ASCII

model:
  name: sage26

simulation:
  name: shin-uchuu-ascii

output:
  output_filename: model
  output_directory: output/sage26-shin-uchuu-ascii
  output_format: hdf5
  snapshot_list: [69, 48, 44, 37, 32, 30, 27, 24]

SubSteps: 10

modules:

  pre_timestep:
    # Progenitor joining and snapshot setup, in SAGE26's order: the merger clock first (it
    # resets the SFR histories of rejoined rows), then the central's halo concentration and
    # disk radius, reionization, the CGM regime classifier, the FoF infall budget and the
    # feedback-free-burst classifier. The classifiers write nothing with their switch at 0.
    - sage26_initialise_merger_clock: process_full_halo
    - sage26_set_halo_concentration:  process_full_halo
    - sage26_set_disk_scale_radius:   process_full_halo
    - sage26_reionization:            process_full_halo
    - sage26_determine_regime:        process_full_halo
    - sage26_prepare_infall_budget:   process_full_halo
    - sage26_determine_ffb_regime:    process_full_halo

  # Ordered, user-named substep middle phases. Each runs once per substep, in the
  # order listed. Within a phase, full-halo/event work precedes galaxy-local work.
  phases:

    galaxy_physics:
      # Baryon supply (central-only, full-halo)
      - sage26_apply_infall:            process_full_halo
      - sage26_reincorporation:         process_full_halo

      # Satellite stripping
      - sage26_satellite_stripping:     process_by_galaxy

      # Cooling and AGN suppression. With CGMrecipeOn 0 the hot path (budget, radio heating,
      # apply) cools; with CGMrecipeOn 1 sage26_regime_aware_cooling cools instead.
      - sage26_calculate_cooling_budget: process_by_galaxy
      - sage26_radio_mode_heating:      process_by_galaxy
      - sage26_apply_cooling:           process_by_galaxy
      - sage26_regime_aware_cooling:    process_by_galaxy

      # Star formation and supernova feedback. The feedback-free burst runs first and must sit
      # immediately before sage26_calculate_star_formation; a galaxy in the burst regime skips
      # the ordinary chain, the disk instability and the metal enrichment below.
      - sage26_ffb_star_formation:              process_by_galaxy
      - sage26_calculate_star_formation:        process_by_galaxy
      - sage26_calculate_supernova_feedback:    process_by_galaxy
      - sage26_apply_star_formation_supernova:  process_by_galaxy

      # Disk instability
      - sage26_disk_instability:        process_by_galaxy
      - sage26_quasar_mode:             process_by_galaxy
      - sage26_starburst_feedback:      process_by_galaxy

      # Disk-SF metal yield — must follow the disk-instability chain (SAGE ordering)
      - sage26_apply_metal_enrichment:  process_by_galaxy

    satellite_mergers:
      # Mergers and disruption — runs after all galaxy physics for the current substep
      # sage26_resolve_mergers_and_disruption emits its merger event for downstream consumers
      - sage26_resolve_mergers_and_disruption: process_full_halo
      - sage26_quasar_mode:             process_per_event   # merger event consumer
      - sage26_starburst_feedback:      process_per_event   # merger event consumer

  post_timestep:
    # Once per FoF after the last substep: normalise the accumulated Cooling and Heating
    # energies, average the per-substep SFR histories into the written rates, then record
    # each galaxy's final Type and infall values for the next snapshot (the recorder last)
    - sage26_finalize_cooling_heating: process_full_halo
    - sage26_finalize_sfr_histories:   process_full_halo
    - sage26_record_transition_state:  process_full_halo

  parameters:
    # Reionisation
    GlobalBaryonFraction: 0.17          # Cosmic baryon fraction (Planck 2018)

    # CGM regime
    CGMrecipeOn: 1                      # Two-regime CGM (0=off: classic hot-halo cooling, 1=on)
    MShockMsun: 6.0e11                  # Shock mass of the regime classifier [Msun]

    # Feedback-free bursts
    EnhancedStarFormationOn: 1          # Feedback-free bursts (0=off, 1=on)
    EnhancedSFEfficiency: 0.2           # Star-formation efficiency of a feedback-free burst

    # Halo concentration
    ConcentrationOn: 3                  # NFW concentration (0=off, 3=from Vmax/Vvir)

    # Star Formation
    SfrEfficiency: 0.05                 # Star formation efficiency
    StarFormingDiskFactor: 3.0          # Number of disc scale radii to form stars over
    SFprescription: 1                   # SF law (0=Croton et al. 2006, 1=Blitz & Rosolowsky 2006 H2)
    H2RadialIntegrationOn: 1            # Integrate the H2 fraction radially over the disc (1 only)
    H2RadialNBins: 25                   # Radial bins of the H2 integration (25 only)
    H2RadialRMaxFactor: 5.0             # Outer radius of the integration in disc scale radii (5.0 only)
    StarburstColdGasOn: 1               # Starbursts consume the cold gas (1 only)

    # Supernova Feedback
    FeedbackReheatingEpsilon: 2.9       # Reheating efficiency
    FeedbackEjectionEfficiency: 0.3     # Ejection efficiency
    FIREmodeOn: 1                       # SN feedback (0=fixed efficiency, 1=FIRE mass loading)

    # Gas Reincorporation
    ReIncorporationFactor: 0.19         # Reincorporation timescale factor

    # Cooling & AGN Feedback
    AGNrecipe: 2                        # AGN feedback mode (0=off, 2=Bondi-Hoyle; 1 and 3 not supported)
    RadioModeEfficiency: 0.08           # Radio-mode AGN feedback efficiency

    # Black Hole Growth
    BlackHoleGrowthRate: 0.015          # BH growth efficiency during mergers
    QuasarModeEfficiency: 0.005         # Quasar-mode AGN feedback efficiency

    # Metals
    RecycleFraction: 0.43               # Instantaneous recycling fraction
    Yield: 0.025                        # Metal yield per unit stellar mass
    FracZleaveDisk: 0.0                 # Fraction of metals leaving disk

    # Mergers & Disruption
    ThresholdMajorMerger: 0.3           # Mass ratio threshold for major mergers
    ThresholdSatDisruption: 1.0         # Mvir-to-baryonic mass ratio threshold for sat merger/disruption
    MergerTimeFactor: 2.0               # Merger-clock scaling (optional; default 2.0)

    # Bulge Sizes
    BulgeSizeOn: 3                      # Bulge sizes (0=none, 3=Tonini et al. 2016)
