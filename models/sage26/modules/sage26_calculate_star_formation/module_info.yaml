module:
  name: sage26_calculate_star_formation
  description: >-
    SAGE26 disk star formation (SFprescription 0, Croton et al. 2006): stellar mass formed this
    substep above the Kauffmann critical cold gas, stored in the NewStellarMass transport field,
    and the H I diagnostic H1gas from the cold gas before star formation

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - Type
      - HaloNr
      - SnapNum
      - dT
      - Vvir
      - ColdGas
      - DiskScaleRadius
      - H2gas
      - H1gas
      - NewStellarMass
    parameters:
      - SfrEfficiency
      - StarFormingDiskFactor

  tests:
    unit:
      - _tests/test_unit_sage26_calculate_star_formation.c
      - _tests/test_unit_sage26_calculate_star_formation_oracle.c
    integration: _tests/test_integration_sage26_calculate_star_formation.py
    scientific: []

  docs:
    physics: README.md
