module:
  name: sage26_calculate_supernova_feedback
  description: >-
    Calculates SAGE26's supernova reheated and ejected gas masses from NewStellarMass with
    renormalization and ejection against the forming galaxy's own Vvir; stores results in
    SupernovaReheatedMass and SupernovaEjectedMass

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - Vvir
      - ColdGas
      - NewStellarMass
      - SupernovaReheatedMass
      - SupernovaEjectedMass
    parameters:
      - FeedbackReheatingEpsilon
      - FeedbackEjectionEfficiency

  tests:
    unit: _tests/test_unit_sage26_calculate_supernova_feedback.c
    integration: _tests/test_integration_sage26_calculate_supernova_feedback.py
    scientific: []

  docs:
    physics: README.md
