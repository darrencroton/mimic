#=============================================================================
# Mimic Full-Physics Test Parameter File (sage26)
#=============================================================================
# Runs the package's COMPLETE default sage26 pipeline (CGM regime,
# concentration, H2 star formation, FIRE feedback and feedback-free bursts) on
# the committed single-file test trees and writes binary output, so the
# committed galaxy-physics baseline can catch drift in sage26 output.
#
# Used by: models/sage26/modules/_tests/test_scientific_sage26_physics_baseline.py
# That test asserts that this file's SubSteps and modules block (every phase,
# module, processing mode, parameter and value, in order) equal the package's
# vertical run file, models/sage26/input/sage26_mini-millennium.yaml. Only the
# simulation and output sections and the comments may differ, so a deliberate
# change to the run file fails the test until this file and the baseline are
# refreshed with it.
#
# To run manually (after make MODEL=sage26 SIMULATION=mini-millennium):
#   ./mimic models/sage26/modules/_tests/input/test_physics_binary.yaml
#
# Output location:
#   output/sage26-physics-binary/  (under the gitignored output/ root)
# Committed reference:
#   models/sage26/modules/_tests/baseline/physics-binary/  (galaxy-physics baseline)
#=============================================================================

model:
  name: sage26

simulation:
  name: mini-millennium
  config: tests/data/test_simulation.yaml

output:
  output_filename: model
  output_directory: ./output/sage26-physics-binary/
  output_format: binary
  snapshot_list: [63, 16]             # z=0, and snapshot 16 (z=7.27), the one among five of the package run file's eight output snapshots (16, 18, 20, 23 and 27) holding the most FFBRegime 1 rows on these trees

SubSteps: 10

modules:

  pre_timestep:
    # Setup and snapshot budgets, in SAGE26's source order: progenitor joining (the
    # SFR-history reset, merger clock and infall, then the central's halo concentration
    # and its disk radius), then reionization, the CGM regime classifier (SAGE26 calls it
    # between joining and infall_recipe; it writes nothing with CGMrecipeOn 0), the FoF infall
    # budget, and the feedback-free-burst classifier (SAGE26's order: the CGM classifier,
    # infall_recipe, then the FFB classifier once per FoF before the substeps; it writes
    # nothing with EnhancedStarFormationOn 0). The merger clock runs first: it zeroes the
    # histories of the rows SAGE26 resets before any history is read or written. The
    # concentration writes nothing with ConcentrationOn 0
    - sage26_initialise_merger_clock: process_full_halo
    - sage26_set_halo_concentration:  process_full_halo
    - sage26_set_disk_scale_radius:   process_full_halo
    - sage26_reionization:            process_full_halo
    - sage26_determine_regime:        process_full_halo
    - sage26_prepare_infall_budget:   process_full_halo
    - sage26_determine_ffb_regime:    process_full_halo

  # Ordered, user-named substep middle phases. Each runs once per substep, in the
  # order listed. Within a phase, full-halo/event work precedes galaxy-local work.
  phases:

    galaxy_physics:
      # Baryon supply (central-only, full-halo)
      - sage26_apply_infall:            process_full_halo
      - sage26_reincorporation:         process_full_halo

      # Satellite stripping
      - sage26_satellite_stripping:     process_by_galaxy

      # Cooling and AGN suppression: with CGMrecipeOn 0 the classic hot path (budget, radio,
      # apply); with CGMrecipeOn 1 the budget writes no cooling and sage26_regime_aware_cooling
      # runs SAGE26's whole regime-aware cooling (it writes nothing with CGMrecipeOn 0)
      - sage26_calculate_cooling_budget: process_by_galaxy
      - sage26_radio_mode_heating:      process_by_galaxy
      - sage26_apply_cooling:           process_by_galaxy
      - sage26_regime_aware_cooling:    process_by_galaxy

      # Star formation and supernova feedback: first SAGE26's feedback-free-burst transaction
      # (starformation_ffb), which with
      # EnhancedStarFormationOn 1 forms, commits and feeds back an FFBRegime 1 row's stars in one
      # step and writes nothing with EnhancedStarFormationOn 0; then the ordinary chain. As in
      # SAGE26's dispatch, an FFBRegime 1 row
      # bypasses the ordinary chain: the three modules below, sage26_disk_instability and
      # sage26_apply_metal_enrichment return at once on it, writing nothing, so the by-galaxy
      # quasar and burst entries never fire on it; the merger consumers are not bypassed. With
      # EnhancedStarFormationOn 1 the transaction must sit immediately before
      # sage26_calculate_star_formation, and it and sage26_determine_ffb_regime require each other
      - sage26_ffb_star_formation:              process_by_galaxy
      - sage26_calculate_star_formation:        process_by_galaxy
      - sage26_calculate_supernova_feedback:    process_by_galaxy
      - sage26_apply_star_formation_supernova:  process_by_galaxy

      # Disk instability
      - sage26_disk_instability:        process_by_galaxy
      - sage26_quasar_mode:             process_by_galaxy
      - sage26_starburst_feedback:      process_by_galaxy

      # Disk-SF metal yield — must follow the disk-instability chain (SAGE ordering)
      - sage26_apply_metal_enrichment:  process_by_galaxy

    satellite_mergers:
      # Mergers and disruption — runs after all galaxy physics for the current substep
      # sage26_resolve_mergers_and_disruption emits its merger event for downstream consumers
      - sage26_resolve_mergers_and_disruption: process_full_halo
      - sage26_quasar_mode:             process_per_event   # merger event consumer
      - sage26_starburst_feedback:      process_per_event   # merger event consumer

  post_timestep:
    # Once per FoF after the last substep: normalise the accumulated Cooling and
    # Heating energies by the snapshot interval
    - sage26_finalize_cooling_heating: process_full_halo
    # Then average the per-substep SFR histories into SfrDisk, SfrBulge, SfrDiskZ and
    # SfrBulgeZ, as SAGE26's writer does
    - sage26_finalize_sfr_histories:   process_full_halo
    # Last: record each galaxy's final Type for the next snapshot's progenitor-joining
    # transitions and write infallStellarMass and TimeOfInfall, 0 for Type 0 rows
    - sage26_record_transition_state:  process_full_halo

  parameters:
    # Reionisation
    GlobalBaryonFraction: 0.17          # Cosmic baryon fraction (Planck 2018)

    # CGM regime
    CGMrecipeOn: 1                      # CGM regime recipe: 1 = the classifier with the package's keyed draw, regime-aware routing and regime-aware cooling; 0 = off, Regime keeps its creation value -1 and cooling takes the classic hot path; required
    MShockMsun: 6.0e11                  # Dekel & Birnboim (2006) shock mass in physical Msun (SAGE26 default); used only with CGMrecipeOn 1, but always required and validated (positive, finite)

    # Feedback-free bursts
    EnhancedStarFormationOn: 1          # FFB mode: 0 = off, FFBRegime keeps its creation value 0; 1 = SAGE26's Li+24 classifier and FFB star formation (SAGE26 default); 2 not supported; required
    EnhancedSFEfficiency: 0.2           # FFB star-formation efficiency epsilon_FFB of SAGE26's starformation_ffb (SAGE26 default); read only with EnhancedStarFormationOn 1, but always required and validated (finite, within [0, 1])

    # Halo concentration
    ConcentrationOn: 3                  # NFW halo concentration: 0 = off, Concentration keeps its creation value 0; 3 = the Vmax/Vvir inversion, infall-frozen for a former satellite; 1 and 2 not supported; required

    # Star Formation
    SfrEfficiency: 0.05                 # Star formation efficiency
    StarFormingDiskFactor: 3.0          # Number of disc scale radii to form stars over
    SFprescription: 1                   # SF law: 1 = Blitz & Rosolowsky 2006 H2 with radial integration; 0 = Croton et al. 2006 critical mass; 2-7 not supported
    H2RadialIntegrationOn: 1            # BR06 H2 by radial integration of the exponential disk (SAGE26 default); 0, the single-slab branch, not supported
    H2RadialNBins: 25                   # Radial bins of the H2 integration (SAGE26 default); only 25 supported
    H2RadialRMaxFactor: 5.0             # H2 integration out to this many disc scale radii (SAGE26 default); only 5.0 supported
    StarburstColdGasOn: 1               # Starburst fuel: 1 = the cold gas (SAGE26 default); 0, the H2 fuel, not supported

    # Supernova Feedback
    FeedbackReheatingEpsilon: 2.9       # Reheating efficiency
    FeedbackEjectionEfficiency: 0.3     # Ejection efficiency
    FIREmodeOn: 1                       # SN feedback of the disk path and every burst: 1 = FIRE scaling, capped loading and energy-based ejection, the package default; 0 = fixed-epsilon Croton et al. 2016; required

    # Gas Reincorporation
    ReIncorporationFactor: 0.19         # Scales Vcrit = 354.53 km/s

    # Cooling & AGN Feedback
    AGNrecipe: 2                        # AGN feedback mode: 2 = Bondi-Hoyle radio-mode accretion; 0 = off; 1 and 3 not supported
    RadioModeEfficiency: 0.08           # Radio-mode AGN feedback efficiency

    # Black Hole Growth
    BlackHoleGrowthRate: 0.015          # BH growth efficiency during mergers
    QuasarModeEfficiency: 0.005         # Quasar-mode AGN feedback efficiency

    # Metals
    RecycleFraction: 0.43               # Instantaneous recycling fraction
    Yield: 0.025                        # Metal yield per unit stellar mass
    FracZleaveDisk: 0.0                 # Fraction of metals leaving disk

    # Mergers & Disruption
    ThresholdMajorMerger: 0.3           # Mass ratio threshold for major mergers
    ThresholdSatDisruption: 1.0         # Mvir-to-baryonic mass ratio threshold for sat merger/disruption
    MergerTimeFactor: 2.0               # Merger-clock scaling (SAGE26 default)

    # Bulge Sizes
    BulgeSizeOn: 3                      # Bulge-size mode: 3 = Tonini merger and instability bulges (SAGE26 default); 0 = none, the radii zeroed; 1 and 2 not supported
