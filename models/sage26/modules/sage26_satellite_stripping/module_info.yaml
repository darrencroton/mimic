module:
  name: sage26_satellite_stripping
  description: >-
    Strips gas from Type 1 satellites when baryon content exceeds HaloBaryonFraction × Mvir;
    transfers it to the central. With CGMrecipeOn 1 the satellite's Regime selects the source
    (CGM or hot) and the central's Regime the destination; with CGMrecipeOn 0 both are hot gas

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - Type
      - Mvir
      - HaloBaryonFraction
      - HotGas
      - MetalsHotGas
      - StellarMass
      - ColdGas
      - EjectedGas
      - BlackHoleMass
      - ICS
      - CGMgas
      - MetalsCGMgas
      - Regime          # read (CGMrecipeOn 1): the satellite's selects the source, the central's the destination
    parameters:
      - GlobalBaryonFraction
      - CGMrecipeOn     # required: 0 or 1

  tests:
    unit: _tests/test_unit_sage26_satellite_stripping.c
    integration: _tests/test_integration_sage26_satellite_stripping.py
    scientific: []

  docs:
    physics: README.md
