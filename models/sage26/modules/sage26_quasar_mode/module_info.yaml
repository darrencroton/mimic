module:
  name: sage26_quasar_mode
  description: >-
    SAGE26's grow_black_hole and quasar_mode_wind (Kauffmann & Haehnelt 2000 BH growth with an
    energy-driven quasar wind); triggered by the disk instability's gas branch (process_by_galaxy)
    and merger events (process_per_event)

  supported_processing_modes: [process_by_galaxy, process_per_event]

  dependencies:
    properties:
      - BlackHoleMass
      - QuasarModeBHaccretionMass
      - ColdGas
      - MetalsColdGas
      - H1gas
      - H2gas
      - HotGas
      - MetalsHotGas
      - CGMgas
      - MetalsCGMgas
      - Regime          # read (CGMrecipeOn 1): the wind host's selects the wind's second pair
      - EjectedGas
      - MetalsEjectedGas
      - UnstableDiskGasFraction
      - Vvir
    parameters:
      - BlackHoleGrowthRate
      - QuasarModeEfficiency
      - SFprescription
      - CGMrecipeOn     # required: 0 or 1
      - AGNrecipe       # required: 0 (no black-hole growth) or 2

  events:
    consumes:
      - producer: sage26_resolve_mergers_and_disruption
        event: merger

  tests:
    unit:
      - _tests/test_unit_sage26_quasar_mode.c
      - _tests/test_unit_sage26_quasar_mode_oracle.c
    integration: _tests/test_integration_sage26_quasar_mode.py
    scientific: []

  docs:
    physics: README.md
