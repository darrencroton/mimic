module:
  name: sage26_starburst_feedback
  description: >-
    Implements collisional starburst recipe (Somerville et al. 2001) from disk instability
    (process_by_galaxy) and merger events (process_per_event); includes optional
    post-minor-merger disk-instability follow-up

  supported_processing_modes: [process_by_galaxy, process_per_event]

  dependencies:
    properties:
      - Type
      - HaloNr
      - SnapNum
      - dT
      - Mvir
      - Vvir
      - ColdGas
      - MetalsColdGas
      - StellarMass
      - MetalsStellarMass
      - BulgeMass
      - MetalsBulgeMass
      - HotGas
      - MetalsHotGas
      - EjectedGas
      - MetalsEjectedGas
      - BlackHoleMass
      - DiskScaleRadius
      - UnstableDiskGasFraction
      - StarFormationRate
      - SupernovaOutflowRate
      - SfrBulgeBin0
      - SfrBulgeBin1
      - SfrBulgeBin2
      - SfrBulgeBin3
      - SfrBulgeBin4
      - SfrBulgeBin5
      - SfrBulgeBin6
      - SfrBulgeBin7
      - SfrBulgeBin8
      - SfrBulgeBin9
      - SfrBulgeColdGasBin0
      - SfrBulgeColdGasBin1
      - SfrBulgeColdGasBin2
      - SfrBulgeColdGasBin3
      - SfrBulgeColdGasBin4
      - SfrBulgeColdGasBin5
      - SfrBulgeColdGasBin6
      - SfrBulgeColdGasBin7
      - SfrBulgeColdGasBin8
      - SfrBulgeColdGasBin9
      - SfrBulgeColdGasMetalsBin0
      - SfrBulgeColdGasMetalsBin1
      - SfrBulgeColdGasMetalsBin2
      - SfrBulgeColdGasMetalsBin3
      - SfrBulgeColdGasMetalsBin4
      - SfrBulgeColdGasMetalsBin5
      - SfrBulgeColdGasMetalsBin6
      - SfrBulgeColdGasMetalsBin7
      - SfrBulgeColdGasMetalsBin8
      - SfrBulgeColdGasMetalsBin9
    parameters:
      - FeedbackReheatingEpsilon
      - FeedbackEjectionEfficiency
      - RecycleFraction
      - Yield
      - FracZleaveDisk
      - StarFormingDiskFactor
      - BlackHoleGrowthRate
      - QuasarModeEfficiency
      - ThresholdMajorMerger

  events:
    consumes:
      - producer: sage26_resolve_mergers_and_disruption
        event: merger

  tests:
    unit: _tests/test_unit_sage26_starburst_feedback.c
    integration: _tests/test_integration_sage26_starburst_feedback.py
    scientific: []

  docs:
    physics: README.md
