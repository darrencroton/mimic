module:
  name: sage26_calculate_cooling_budget
  description: >-
    SAGE26's hot-halo cooling up to the AGN step: diagnostics, cooling radius and the post-cap
    cooling mass, carried with x, rcool and the return path to the radio and apply modules
    (CGMrecipeOn 0); with CGMrecipeOn 1 only the no-cooling transport, as
    sage26_regime_aware_cooling owns SAGE26's regime-aware cooling

  additional_files:
    - cooling_tables.c
    - cooling_tables.h

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - HaloNr
      - SnapNum
      - dT
      - HotGas
      - MetalsHotGas
      - CoolingGas
      - CoolingX
      - Rcool
      - CoolingReturnPath
      - tcool
      - tff
      - RcoolToRvir
      - Vvir
      - Rvir
    parameters:
      - CGMrecipeOn     # required: 0 (classic hot cooling) or 1 (no-cooling transport only)

  tests:
    unit:
      - _tests/test_unit_sage26_calculate_cooling_budget.c
      - _tests/test_unit_sage26_calculate_cooling_budget_oracle.c
    integration: _tests/test_integration_sage26_calculate_cooling_budget.py
    scientific: []

  docs:
    physics: README.md
