module:
  name: sage26_initialise_merger_clock
  description: >-
    SAGE26's merger-clock and infall assignment of progenitor joining: resets a central's clock,
    records infallStellarMass and TimeOfInfall when a central becomes a satellite, estimates the
    dynamical-friction clock (estimate_merging_time) and starts an orphan's clock at zero

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - HaloNr
      - Type
      - Len
      - Mvir
      - MergTime
      - StellarMass
      - ColdGas
      - PreviousType
      - infallStellarMassState
      - TimeOfInfallState
    parameters:
      - MergerTimeFactor  # optional: absent means SAGE26's default 2.0

  tests:
    unit:
      - _tests/test_unit_sage26_initialise_merger_clock.c
      - _tests/test_unit_sage26_initialise_merger_clock_oracle.c
    integration: _tests/test_integration_sage26_initialise_merger_clock.py
    scientific: []

  docs:
    physics: README.md
