module:
  name: sage26_finalize_cooling_heating
  description: >-
    Normalises the Cooling and Heating energies and the SupernovaOutflowRate reheated mass
    accumulated over the substeps by the FoF's snapshot interval once per halo, as SAGE26 does
    after its last substep, and writes the output mdot rates from the raw rates with SAGE26's
    writer arithmetic

  supported_processing_modes: [process_full_halo]

  dependencies:
    properties:
      - Type
      - dT
      - Cooling
      - Heating
      - SupernovaOutflowRate
      - mdot_cool_raw     # read: the raw float rate sage26_regime_aware_cooling stores
      - mdot_stream_raw   # read
      - mdot_cool         # written: SAGE26's writer conversion of the raw rate
      - mdot_stream       # written
    parameters: []

  tests:
    unit:
      - _tests/test_unit_sage26_finalize_cooling_heating.c
      - _tests/test_unit_sage26_finalize_cooling_heating_oracle.c
    integration: _tests/test_integration_sage26_finalize_cooling_heating.py
    scientific: []

  docs:
    physics: README.md
