module:
  name: sage26_radio_mode_heating
  description: >-
    SAGE26's do_AGN_heating on the hot-cooling path: suppresses the cooling mass by the heating
    radius and grows the black hole by Bondi-Hoyle accretion (AGNrecipe 2; 0 off, 1 and 3 refused)

  supported_processing_modes: [process_by_galaxy]

  dependencies:
    properties:
      - HaloNr
      - SnapNum
      - dT
      - Vvir
      - Rvir
      - CoolingGas
      - BlackHoleMass
      - HotGas
      - MetalsHotGas
      - CoolingX
      - Rheat
      - Rcool
      - Heating
    parameters:
      - RadioModeEfficiency
      - AGNrecipe

  tests:
    unit: _tests/test_unit_sage26_radio_mode_heating.c
    integration: _tests/test_integration_sage26_radio_mode_heating.py
    scientific: []

  docs:
    physics: README.md
